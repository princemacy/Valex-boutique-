<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable | VAlex Boutique</title>
<meta name="description" content="Cette page n'existe pas ou n'existe plus sur VAlex Boutique.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FF6A00">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--ink:#111111;--ink-2:#3D3D3D;--ink-3:#767676;--line:#E8E8E8;--accent:#FF6A00}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#FFFFFF;color:var(--ink);font-family:"Instrument Sans","Segoe UI",Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center}
  .mark{display:flex;align-items:center;gap:10px;margin-bottom:40px;color:var(--ink);text-decoration:none}
  .mark svg{width:40px;height:40px;display:block}
  .mark b{font-size:18px;font-weight:700}
  .code{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--accent);margin:0 0 12px}
  h1{margin:0;font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.5px;max-width:520px}
  p.lede{margin:16px 0 32px;font-size:17px;line-height:1.5;color:var(--ink-2);max-width:480px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-block;background:var(--accent);color:#FFFFFF;text-decoration:none;
    font-weight:700;font-size:16px;padding:14px 22px;border-radius:8px}
  a.btn:hover{background:#E85F00}
  a.second{background:#FFFFFF;color:var(--ink);border:1.5px solid var(--line)}
  a.second:hover{border-color:var(--ink)}
  .foot{margin-top:48px;font-size:13px;color:var(--ink-3)}
  @media (min-width:720px){h1{font-size:40px}p.lede{font-size:18px}}
</style>
</head>
<body>
  <a class="mark" href="/" aria-label="VAlex Boutique, accueil">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <path d="M9 11h12.4L32 42.2 42.6 11H55L37.8 55H26.2z" fill="#111111"/>
      <rect x="9" y="57" width="46" height="4" fill="#FF6A00"/>
    </svg>
    <b>VAlex Boutique</b>
  </a>
  <p class="code">ERREUR 404</p>
  <h1>Cette page n'existe pas.</h1>
  <p class="lede">Le lien est peut-être ancien, ou l'adresse a été mal recopiée. Le catalogue et les boutiques sont toujours accessibles depuis l'accueil.</p>
  <div class="actions">
    <a class="btn" href="/">Retour à l'accueil</a>
    <a class="btn second" href="/#/boutiques">Voir les boutiques</a>
  </div>
  <p class="foot">VAlex Boutique, Haïti</p>
</body>
</html>
