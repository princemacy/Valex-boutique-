.timer svg{width:16px;height:16px;flex:0 0 auto}.timer.urgent{background:#FDE8E8;color:#B42318}
.howto{margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px}
.howto summary{display:flex;gap:8px;align-items:center;padding:11px 0;font-weight:700;font-size:14px;cursor:pointer;list-style:none}
.howto summary::-webkit-details-marker{display:none}.howto summary svg{width:17px;height:17px}
.howto ol{margin:0 0 8px;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}.howto li{margin-bottom:6px}.howto p{margin:0 0 12px}
.ostate{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:#F4F4F4;font-size:13.5px;line-height:1.5;margin:10px 0}
.ostate svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
.ostate--pending{background:#FFF1E6;color:#7A3100}.ostate--cancelled{background:#FDE8E8;color:#8A1C14}.ostate--delivered{background:#E9F7EF;color:#0F5132}
.card__f .btn svg{width:15px;height:15px}
/* Tableau de bord */
.minist .card__h h3{display:flex;gap:6px;align-items:center}.minist .card__h h3 svg{width:16px;height:16px}
.bigk{font-family:var(--ff-d);font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;margin-bottom:4px}
.procta{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#111;color:#fff;margin-bottom:14px}
.procta>svg{width:26px;height:26px;color:#FF6A00;flex:0 0 auto}.procta strong{display:block;font-size:15px}.procta span span{font-size:12.5px;color:#ccc;line-height:1.4}
.procta>svg:last-child{width:18px;height:18px;color:#fff}
.probadge{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#FFF1E6;color:#7A3100;font-size:13.5px;margin:0 0 14px}
.probadge svg{width:18px;height:18px;color:#FF6A00}
.probadge-s{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;background:#111;color:#FF6A00;font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px}
.probadge-s svg{width:12px;height:12px}
/* Graphiques */
.chart svg{width:100%;height:150px;display:block;touch-action:pan-y}
.chart__tip{font-size:12.5px;color:var(--ink-2);margin-top:4px;min-height:18px}
.seg{display:flex;gap:6px;background:#F4F4F4;padding:4px;border-radius:12px;margin:0 0 12px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button svg{width:15px;height:15px}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpis--4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpis--4>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpis--4 b{display:block;font-family:var(--ff-d);font-size:19px;font-weight:800;letter-spacing:-.02em}
.kpis--4 span{display:block;font-size:12px;color:var(--ink-3)}
.kpis--4 .up{color:#0F7B3F;font-weight:700}.kpis--4 .down{color:#B42318;font-weight:700}
#sres .card,#qres .card{margin-bottom:12px}
.legend{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--ink-3)}.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-left:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-bottom:16px;position:relative}
.bars__c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bars__c i{display:block;width:100%;background:#FFD2B0;border-radius:3px 3px 0 0}.bars__c.hi i{background:#FF6A00}
.bars__c span{position:absolute;bottom:-16px;font-size:9px;color:#999}
.hbars>div{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin-bottom:7px}
.hbars>div>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars i{height:10px;background:#F4F4F4;border-radius:5px;overflow:hidden}.hbars b{display:block;height:100%;background:#FF6A00;border-radius:5px}
.hbars em{font-style:normal;font-weight:700;text-align:right}
.toplist a{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.toplist a:last-child{border:0}.toplist em{grid-row:span 2;font-style:normal;font-weight:800;color:#FF6A00}
.toplist span{font-size:14px;font-weight:600}.toplist b{font-size:12px;font-weight:500;color:var(--ink-3)}
.locked .blurbox{filter:blur(5px);opacity:.55;pointer-events:none;margin-bottom:10px;user-select:none}
/* Pro */
.prohero{text-align:center;padding:22px 14px 14px;border-radius:16px;background:#111;color:#fff;margin-bottom:12px}
.prohero svg{width:34px;height:34px;color:#FF6A00}.prohero h1{font-family:var(--ff-d);font-size:26px;margin:6px 0}.prohero p{font-size:13.5px;color:#ccc;line-height:1.5}
.plans{display:grid;gap:10px}
.plan{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.plan strong{display:block;font-size:14px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.plan>b{display:block;font-family:var(--ff-d);font-size:24px;font-weight:800;margin:2px 0}.plan>b small{font-size:13px;font-weight:600;color:var(--ink-3)}
.plan p{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-top:8px}
.plan--pro{border:2px solid #FF6A00}.plan--pro strong{color:#FF6A00}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 2px;table-layout:fixed}
.ptable th,.ptable td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.ptable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.ptable td:last-child,.ptable th:last-child{text-align:right}
.ptable tr:last-child td{border-bottom:0}
.prosum{font-size:14px;margin:8px 0 12px;color:var(--ink-2)}
.howsteps{padding-left:18px;font-size:13.5px;line-height:1.55;margin:6px 0 12px}.howsteps li{margin-bottom:5px}
/* Connexion */
.authbox{max-width:420px;margin:0 auto;padding-top:6px}
.authbox h1{font-family:var(--ff-d);font-size:26px;letter-spacing:-.02em}.authbox>p{font-size:14px;color:var(--ink-2);line-height:1.55;margin:6px 0 16px}
.gbtn{background:#fff;border:1.5px solid var(--line);color:var(--ink);display:flex;gap:10px;justify-content:center;font-weight:700}
.gbtn svg{width:20px;height:20px}
.orsep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-3);font-size:12.5px}
.orsep:before,.orsep:after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{display:block;margin:8px auto 0}
.newacc{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);text-align:center}.newacc>span{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.finish{margin-top:12px;border:2px solid #FF6A00}
/* Boutique */
.picbtn{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;z-index:2}
.picbtn svg{width:15px;height:15px}
.picbtn--logo{right:-6px;top:auto;bottom:-6px;padding:6px;background:#FF6A00;border:2px solid #fff}
.banpick{width:100%;height:92px;border-radius:12px;border:1.5px dashed var(--line);background:#F7F7F7 center/cover;display:flex;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.banpick[style*="url"]{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);border-style:solid}
.banpick svg{width:18px;height:18px}
/* Prix par taille */
.vprice{margin-top:10px}.pgridin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pgridin label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700}
.pgridin input{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:9px;font-size:14px}
/* Messagerie */
.bell{position:relative}
.privnote{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#F4F4F4;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-bottom:10px}
.privnote svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.clist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.crow:last-child{border:0}.crow .av{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}
.crow .av img{width:100%;height:100%;object-fit:cover}
.crow__b{min-width:0}.crow__b strong{display:block;font-size:14.5px}.crow__b>span{display:block;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow.un .crow__b>span{color:var(--ink);font-weight:600}
.crow__t{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.crow__t b{background:#FF6A00;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.tagsel{font-style:normal;font-size:10.5px;font-weight:700;background:#FFF1E6;color:#9A3D00;padding:1px 6px;border-radius:999px;margin-left:4px}
.nlist{display:grid;gap:8px}.nlist a{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.45}
.nlist a.nhot{border-color:#FF6A00;background:#FFF8F2}.nlist svg{width:18px;height:18px;flex:0 0 auto;color:#FF6A00}.nlist em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3)}
.nlist__head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px 2px;font-size:12px;color:var(--ink-3)}
.nlist__read{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--ink)}
.nlist__item{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.45;text-decoration:none;color:inherit}
.nlist__item.un{border-color:#FF6A00;background:#FFF8F2}
.nlist__kind{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#0B5D45;background:#E8F3EE;border-radius:999px;padding:2px 7px;flex:0 0 auto;margin-top:1px}
.nlist__b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nlist__b strong{font-size:13.5px;color:var(--ink)}
.nlist__b>span{font-size:12.5px;color:var(--ink-2)}
.nlist__b em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.nlist__dot{width:8px;height:8px;border-radius:50%;background:#FF6A00;flex:0 0 auto;margin-top:6px}
.nlist__empty{display:flex;flex-direction:column;gap:4px;padding:18px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink-3)}
/* portefeuille */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.wcard__l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.wcard__v{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wcard__n{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.wquote{margin-top:2px;padding:10px 12px;border-radius:10px;background:#F6F8F7;border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.wquote b{color:var(--ink)}
.wlist{display:grid;gap:0}
.wrow{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.wrow:last-child{border-bottom:0}
.wrow__l{font-size:13.5px;font-weight:600}
.wlist__m{flex:1 1 100%;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow__a{margin-left:auto;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.wrow__a.in{color:var(--pine)}
.wrow__a.out{color:var(--ink)}
.wrow__d{font-size:11px;color:var(--ink-4);flex:0 0 auto}
/* assistance */
.spitem{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-decoration:none;color:inherit}
.spitem__b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.spitem__b strong{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splist{display:grid;gap:8px}
.spmsg{display:flex;flex-direction:column;gap:4px;max-width:92%;padding:10px 12px;border-radius:12px;background:#F6F8F7;border:1px solid var(--line)}
.spmsg.me{align-self:flex-end;background:#FFF3EA;border-color:#F6D8C2}
.spmsg.int{background:#EEF2FF;border-color:#CBD5F5}
.spmsg__b{font-size:13.5px;line-height:1.5;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere}
.spmsg__a{font-size:12px;font-weight:700;color:#C24F00;text-decoration:underline}
.spmsg__d{font-size:11px;color:var(--ink-4)}
/* suivi de commande (p47) */
.p47steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.p47steps span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-4)}
.p47steps i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.p47steps span.on{color:var(--ink-2);font-weight:600}
.p47steps span.on i{background:var(--pine)}
.p47note{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:11px;background:#F6F8F7;border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:10px}
.p47note svg{flex:0 0 auto;margin-top:1px}
.p47note.ok{background:var(--pine-soft);border-color:#BFE0CB;color:var(--pine)}
.p47note.warn{background:var(--mango-soft);border-color:#F6D8C2;color:#8A3D00}
.p47note.bad{background:var(--red-soft);border-color:#E9C6C1;color:var(--red)}
.p47est{display:block;margin-bottom:6px}
.p47proofs{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
.p47proof{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.p47proof:last-child{border-bottom:0}
.p47proofs .btn{margin-top:10px}
.t-small.p47ok{color:var(--pine);font-weight:600}
.t-small.p47bad{color:var(--red);font-weight:600}
/* QG (p45) */
.qgmeta{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.qgmeta b{color:var(--ink)}
.qglist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.qgrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.qgrow:last-child{border-bottom:0}
.qgrow__l{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.qgrow__l svg{flex:0 0 auto;color:var(--ink-3)}
.qgrow__l b{display:block;font-size:13.5px;font-weight:600}
.qgrow__l em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-4)}
.qgav{width:30px;height:30px;border-radius:50%;background:var(--pine-soft);color:var(--pine);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.qgacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qgenroll{margin-top:10px}
.qgqr{width:180px;height:180px;margin:0 auto 10px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px}
.qgqr svg{width:100%;height:100%;display:block}
.qgsecret{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.qgsecret code{flex:1;min-width:0;font-size:12px;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.qgfilters{display:flex;gap:8px;margin-bottom:10px}
.qgfilters select,.qgfilters input{flex:1;min-width:0}
.qgev{padding:9px 10px;border-radius:10px;border-left:3px solid var(--line);background:var(--sunk);margin-bottom:7px}
.qgev--critical{border-left-color:var(--red);background:var(--red-soft)}
.qgev--warning{border-left-color:#E08A2B;background:var(--mango-soft)}
.qgev--info{border-left-color:var(--blue);background:var(--blue-soft)}
.qgev__t{display:flex;align-items:center;gap:8px}
.qgev__t b{font-size:13px;flex:1}
.qgsev{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.qgsev--critical{color:var(--red)}
.qgsev--warning{color:#8A3D00}
.qgsev--info{color:var(--blue)}
.qgev__m{font-size:12px;color:var(--ink-2);margin-top:2px;word-break:break-word}
.qgev__d{font-size:11px;color:var(--ink-4);margin-top:3px}
.qglink{margin-top:12px}
/* Finances (p46) */
.fingrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.fincard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.fincard__l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.fincard__v{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fincard__n{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.finlist{display:flex;flex-direction:column;gap:0}
.finrow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.finrow:last-child{border-bottom:0}
.finrow__l{flex:1 1 160px;min-width:0}
.finrow__l b{display:block;font-size:13.5px;font-weight:600}
.finrow__l em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-4);word-break:break-word}
.finrow__m{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right}
.finrow__m b{color:var(--ink);font-variant-numeric:tabular-nums}
.finrate{font-size:14px;font-weight:700;color:var(--ink)}
.finledger{display:flex;flex-direction:column;gap:10px}
.fintx{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff}
.fintx__h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fintx__h b{font-size:13.5px}
.fintx__v{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.fintx__m{font-size:11.5px;color:var(--ink-3);margin-top:3px;word-break:break-word}
.finlines{margin-top:8px;border-top:1px solid var(--line-2);padding-top:6px}
.finline{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:12px;color:var(--ink-2)}
.finline>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.finline__b{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4)}
.finline__a{font-weight:700;font-variant-numeric:tabular-nums}
.finline__a.in{color:var(--pine)}
.finline__a.out{color:var(--red)}
.finwarn{margin-top:7px;font-size:11.5px;color:var(--red);font-weight:600}
/* Remboursements (p51) */
.rfsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.rflist{display:flex;flex-direction:column;gap:8px}
.rfitem{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff}
.rfitem__h{display:flex;align-items:center;gap:8px}

.stbtn{display:inline-flex;gap:6px;align-items:center;margin:4px 0 10px}.stbtn svg{width:15px;height:15px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;display:grid;gap:7px}
.tcard strong{font-size:14.5px}.tcard>div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tcard>div span{display:flex;gap:6px;align-items:center;color:var(--ink-2)}.tcard>div svg{width:15px;height:15px;color:#FF6A00}.tcard b{text-align:right}
.humanbtn{display:inline-flex;gap:6px;align-items:center;margin:0 0 10px}.humanbtn svg{width:15px;height:15px}
/* Zones à toucher plus grandes (doigt = 40px) sans changer le dessin */
a.more,button.more{position:relative}
a.more::after,button.more::after{content:"";position:absolute;inset:-12px -8px}
.t-small a,.howsteps a{display:inline-block;padding:10px 2px;margin:-10px 0}
.dchip.ok{background:#E9F6EE;color:#1E6B3A}
/* ===== Tous les écrans : tablette et PC (30/10) ===== */
.mgrid{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))!important;max-width:none!important}
@media(min-width:600px){
  .page{max-width:1280px!important;margin-left:auto;margin-right:auto}
  .circs4{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .circs4 .ci{width:76px;height:76px}
  .mgrid{margin:0;border-radius:12px;padding:10px;gap:10px}
  .mgrid>div{gap:10px}
  .mgrid .pcard__img img{max-height:340px}
}
@media(min-width:900px){
  .tabbar{padding-left:max(0px,calc((100vw - 760px)/2));padding-right:max(0px,calc((100vw - 760px)/2))}
  .logbar{max-width:760px;margin-left:auto!important;margin-right:auto!important;left:0!important;right:0!important}
  .main{padding-left:24px;padding-right:24px}
}
@media(min-width:600px){
  .catgrid{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));overflow:visible;margin:18px 0 0;padding:0}
  .catgrid .ci{width:80px;height:80px}
}
@media(min-width:900px){
  .best__g{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:none}
  .best__g a.b1{grid-row:auto;aspect-ratio:1}
}
@media(min-width:900px){
  #view.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:36px;align-items:start}
  #view.pdp>*{grid-column:2;min-width:0}
  #view.pdp>.gal{grid-column:1;grid-row:1 / span 40;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:hidden;border-radius:14px}
  #view.pdp>.gal img{max-height:calc(100vh - 120px);object-fit:contain}
  #view.pdp>.buybar{grid-column:1 / -1}
}
@media(min-width:900px){#view.pdp>.stbtn{justify-self:start;width:auto}}
body.hasbeta .shell .nav{top:34px}
/* Rien ne doit rester caché sous la barre du bas ni sous le bouton d'avis (30/10) */
.catpage.fixedcols .catmain,.catpage.fixedcols .catside{padding-bottom:calc(var(--tab-h) + 110px + env(safe-area-inset-bottom,0px))!important}

.paymode .pick{margin-top:8px}.paymode .pick.pmsoon{opacity:.6;pointer-events:none}
.soonb{font-style:normal;font-size:11px;font-weight:700;background:#111;color:#fff;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.pnumrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pnumrow select{flex:0 0 auto;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.pnumrow .tel{flex:1 1 160px}
.paymode.bad>label{color:var(--red)}.paymode.bad>.err{display:block}.paymode.bad .pick:not(.pmsoon){border-color:var(--red)}
.nores{display:flex;gap:10px;align-items:flex-start;margin-top:10px;background:#FDECEA;color:#8A1F17;border:1px solid #F5C2BD;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.4}
.nores svg{flex:0 0 18px;width:18px;height:18px;margin-top:1px}
.dchip.warn{background:#FFF4E5;color:#8A4B00}
.pnumwrap{display:none;margin:8px 0 0 30px;padding:10px 12px;border-left:3px solid #FF6A00;background:#FFF8F2;border-radius:0 10px 10px 0}
.pnumwrap.on{display:block}.pnumlab{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pnumwrap .pnumrow{margin-top:6px}.field.bad .pnumwrap .err,.pnumwrap.bad .err{display:block}
/* « + » panier sur les cartes */
.mgrid .pcard__b{position:relative}
.qplus{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;transition:transform .15s}
.qplus svg{width:16px;height:16px}.qplus:active{transform:scale(.86)}.qplus.done{background:#1E8A4C}
.mgrid .pcard__b .pc-sh{padding-right:36px}
.qpk{display:grid;gap:8px}.qpk button{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left}
.qpk button span{flex:1}.qpk button.on{border-color:#111;box-shadow:inset 0 0 0 1px #111}.qpk i{width:18px;height:18px;border-radius:50%;flex:0 0 18px;border:1px solid rgba(0,0,0,.1)}
.shipmode .pick{margin-top:8px}.shipfee{display:none;margin:8px 0 0 30px}.shipfee.on{display:block}.shipfee input{max-width:220px}
.colrow{display:flex;gap:8px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}.colrow::-webkit-scrollbar{display:none}
.colrow a{flex:0 0 auto;width:64px;text-align:center;font-size:11.5px;color:var(--ink-2)}
.colrow a img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent;display:block;background:#F4F4F4}
.colrow a.on img{border-color:#111}.colrow a span{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhd{font-size:13px;font-weight:700;margin-top:6px}
.pfcard{margin:12px 0;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:grid;gap:10px}
.pfcard__t strong{display:block;font-size:15px}.pfcard__t span{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.pfcard__c{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pfcode{font-family:var(--ff-d);font-size:30px;font-weight:800;letter-spacing:2px}
.pfcard__a{display:flex;gap:8px;flex-wrap:wrap}
.pfin{display:flex;gap:8px}.pfin input{flex:1;font-size:22px;letter-spacing:4px;text-align:center;min-height:48px;border:1px solid var(--line);border-radius:12px}
.pflab{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}.pfcode{display:block}.pfwarn{display:block;font-size:11.5px;color:#B3261E;margin-top:2px}
.pflink{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.pflink>span{flex:1}.pflink strong{display:block;font-size:14px}.pflink span span{font-size:12.5px;color:var(--ink-3)}.pflink svg{width:20px;height:20px;flex:0 0 20px}
/* titres vendeurs */
.lvchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;background:#F2F2F2;color:#333;vertical-align:middle;margin-left:6px}
.lvchip svg{width:12px;height:12px}.lvchip.lv2{background:#EAF3FF;color:#1F4E8C}.lvchip.lv3{background:#E9F6EE;color:#1E6B3A}.lvchip.lv4{background:#FFF1E6;color:#9A3D00}
.lvchip.lv5{background:#F3E8FF;color:#5B21B6}.lvchip.lv6{background:#111;color:#fff}.lvchip.lv7{background:linear-gradient(90deg,#FF6A00,#FFB000);color:#111}
.lvcard{margin:12px 0;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.lvcard.legend{border-color:#FF6A00;box-shadow:0 6px 24px -12px rgba(255,106,0,.6)}
.lvcard__h{display:flex;align-items:center;justify-content:space-between;gap:8px}.lvcard__h .lvchip{margin-left:0;font-size:13px;padding:5px 10px}
.lvladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.lvladder i{height:6px;border-radius:3px;background:#EEE}.lvladder i.on{background:#FF6A00}
.lvbar{height:6px;border-radius:3px;background:#EEE;margin-top:6px;overflow:hidden}.lvbar span{display:block;height:100%;background:#111}
.lvwhy{margin-top:8px;color:var(--ink-3)}
/* localisation */
.locbtn{display:flex;align-items:center;gap:3px;max-width:110px;padding:0 6px}.locbtn svg{width:18px;height:18px;flex:0 0 18px;color:#FF6A00}
.locbtn span{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nearme{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#1E6B3A}.nearme svg{width:11px;height:11px}
.locintro{display:flex;gap:10px;align-items:flex-start}.locintro svg{width:28px;height:28px;flex:0 0 28px;color:#FF6A00}

.setupcard__h{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}.setupcard__h svg{width:22px;height:22px;flex:0 0 22px;color:#D93025}
.setupcard__h strong{display:block;color:#B3261E}.setupcard__h span{font-size:12.5px;color:#5F2120}
.setupitem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #F5C2BD}
.setupitem i{width:16px;height:16px;border-radius:4px;border:2px solid #D93025;background:#fff;flex:0 0 16px}
.setupitem span{flex:1}.setupitem b{display:block;font-size:13.5px}.setupitem em{font-style:normal;font-size:12px;color:var(--ink-3)}.setupitem svg{width:16px;height:16px}
.dfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dfgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}.dfgrid em{font-style:normal;color:#FF6A00;font-weight:500}
.dfin{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 8px}.dfin input{border:0;min-height:40px;width:100%;outline:none}.dfin b{font-size:11px;color:var(--ink-3)}

.fbbtn{margin-top:8px;gap:10px;background:#fff;border:1px solid var(--line)}
.dropcode{margin:0 16px 4px;padding:12px 14px;border-radius:14px;background:#FFF4EC;border:1px dashed #FF6A00;display:flex;flex-direction:column;gap:2px}
.dropcode>span{font-size:13px;color:var(--ink-2,#555)}
.dropcode>b{font-size:30px;letter-spacing:8px;font-variant-numeric:tabular-nums}
.dropcode>em{font-style:normal;font-size:12px;color:var(--ink-3,#777)}
.pcodes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pcode{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;border:1px solid var(--line);min-width:120px}
.pcode b{letter-spacing:1px}.pcode em{font-style:normal;font-size:12px;color:var(--ink-3,#777)}
.pcode.used{opacity:.5}
.rsteps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.rsteps li{padding-left:22px;position:relative;color:var(--ink-3,#888);font-size:14px}
.rsteps li:before{content:"";position:absolute;left:4px;top:5px;width:10px;height:10px;border-radius:50%;border:2px solid #ccc}
.rsteps li.on{color:inherit;font-weight:600}.rsteps li.on:before{background:#FF6A00;border-color:#FF6A00}
.relaiscta{display:block;margin-bottom:12px;border:1px solid #FF6A00}
.relaiscta .card__b{display:flex;align-items:center;gap:12px}
.relaiscta span{display:flex;flex-direction:column;flex:1}.relaiscta em{font-style:normal;font-size:13px;color:var(--ink-3,#777)}
.rtgrid{display:grid;gap:8px}
.rtrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.rtrow input{width:110px}

.boot{background:#fff !important;align-items:center}
.splash{display:flex;flex-direction:column;align-items:center;gap:12px;animation:spIn .5s var(--ease) both}
.splash img{width:84px;height:84px;border-radius:20px}
.splash .brand{font-size:30px}
@keyframes spIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>

/* Toute erreur Supabase remonte à l'écran. Rien n'échoue en
   silence : c'est la règle la plus utile quand on débogue
   depuis un téléphone. */
function fail(err,ctx){
  const id='VX-'+Math.random().toString(36).slice(2,6).toUpperCase();
  try{
    const raw=String((err&&(err.message||err.error_description))||'');
    const safe=raw.replace(/(eyJ[A-Za-z0-9_-]{10,}\.?[A-Za-z0-9_-]*|sb_(?:secret|publishable)_[A-Za-z0-9_-]+|Bearer\s+\S+|postgres(?:ql)?:\/\/\S+|service_'+'role)/gi,'[masque]').slice(0,240);
    console.error('[VAlex]',id,(ctx||'erreur'),(err&&(err.code||err.status))||'',safe);
  }catch(e){}
  const raw=String((err&&(err.message||err.error_description))||'');
  let msg='Une erreur est survenue. Réessayez dans un instant.';
  if(/invalid login credentials/i.test(raw))msg='Email ou mot de passe incorrect.';
  else if(/email not confirmed/i.test(raw))msg='Confirmez votre email avant de vous connecter.';
  else if(/rate limit|too many/i.test(raw))msg='Trop de tentatives. Réessayez dans quelques minutes.';
  else if(/failed to fetch|network|load failed|offline/i.test(raw))msg='Connexion difficile. Vérifiez internet et réessayez.';
  else if(/duplicate key|unique constraint/i.test(raw))msg='Cette information existe déjà.';
  else if(/row-level security|permission denied/i.test(raw))msg='Cette action n\'est pas autorisée pour ce compte.';
  toast(msg+' Code '+id+'.');
  return null;
}

/* ==========================================================
   5. IMAGES — compression avant envoi
   Une photo de téléphone pèse 4 Mo. On ne la met pas telle
   quelle sur un réseau mobile haïtien.
   ========================================================== */
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error("Ce fichier n'est pas une image."));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Lecture impossible.'));
    fr.onload=()=>{const im=new Image();
      im.onerror=()=>rej(new Error('Image illisible.'));
      im.onload=()=>{let w=im.width,h=im.height;const r=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*r);h=Math.round(h*r);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('Conversion impossible.')),'image/jpeg',q);};
      im.src=fr.result;};
    fr.readAsDataURL(file);});
}
const STORAGE_CLAIM_BUCKETS=['product-images','product-videos','shop-logos'];
function storageModuleMissing(e){
  const code=String((e&&e.code)||''), m=String((e&&e.message)||'').toLowerCase();
  return code==='42883'||code==='42P01'||code==='PGRST202'||
    m.includes('does not exist')||m.includes('could not find the function')||m.includes('schema cache');
}
function storageClaimError(e){
  const m=String((e&&e.message)||'');
  if(/Quota quotidien d'images/i.test(m))return new Error('Quota quotidien d\'images atteint. Réessayez demain.');
  if(/Quota quotidien de videos/i.test(m))return new Error('Quota quotidien de vidéos atteint. Réessayez demain.');
  if(/Volume maximal/i.test(m))return new Error('La boutique a atteint son volume maximal de stockage.');
  if(/Image trop volumineuse/i.test(m))return new Error('Image trop volumineuse pour le serveur.');
  if(/Type de fichier refuse/i.test(m))return new Error('Ce format d\'image n\'est pas accepté.');
  if(/Chemin ou extension/i.test(m))return new Error('Nom de fichier refusé. Réessayez avec une photo.');
  if(/Boutique introuvable|Acces refuse/i.test(m))return new Error('Envoi refusé : boutique introuvable ou accès insuffisant.');
  if(/Quotas de stockage indisponibles/i.test(m))return new Error('Les quotas de stockage ne sont pas configurés.');
  return new Error(m||'Réservation de stockage impossible.');
}
/* p50 : reserver le quota AVANT l'envoi. Sans p50, l'envoi reste possible :
   on ne bloque pas une fonction absente, on la detecte et on continue. */
async function storageClaim(path,bucket,bytes,opts){
  const shopId=(opts&&opts.shopId)||(S.shop&&S.shop.id)||null;
  if((opts&&opts.skipClaim)||!shopId||!STORAGE_CLAIM_BUCKETS.includes(bucket))return {assetId:null,active:false};
  try{
    const {data,error}=await sb.rpc('storage_claim',{
      p_shop:shopId, p_product:(opts&&opts.productId)||null, p_bucket:bucket,
      p_path:path, p_mime:'image/jpeg', p_bytes:bytes, p_sha256:null,
      p_width:null, p_height:null, p_duration_seconds:null
    });
    if(error){
      if(storageModuleMissing(error))return {assetId:null,active:false};
      throw storageClaimError(error);
    }
    return {assetId:data||null,active:true};
  }catch(err){
    if(storageModuleMissing(err))return {assetId:null,active:false};
    throw err;
  }
}
async function storageRelease(assetId,reason){
  if(!assetId)return false;
  try{
    const {error}=await sb.rpc('storage_release',{p_asset:assetId,p_reason:reason,p_status:'deleted'});
    return !error;
  }catch(_){ return false; }
}
/* p50 : rendre le quota des medias retires d'une fiche. Best effort : un
   echec ne bloque jamais l'enregistrement du produit. Un chemin encore
   utilise par une autre fiche de la boutique n'est jamais libere. */
async function releaseMediaByPaths(paths,reason){
  const list=[...new Set((Array.isArray(paths)?paths:[]).filter(p=>typeof p==='string'&&p&&p.indexOf('demo:')!==0))];
  const shopId=(S.shop&&S.shop.id)||null;
  if(!shopId||!list.length)return 0;
  try{
    const {data:used,error:uerr}=await sb.from('product_images').select('storage_path').in('storage_path',list);
    if(uerr)return 0;
    const stillUsed=new Set((used||[]).map(r=>r&&r.storage_path).filter(Boolean));
    const free=list.filter(p=>!stillUsed.has(p));
    if(!free.length)return 0;
    const {data:assets,error:aerr}=await sb.from('media_assets').select('id,storage_path,status').in('storage_path',free).eq('shop_id',shopId);
    if(aerr)return 0;
    let done=0;
    for(const a of assets||[]){
      if(!a||!a.id||a.status==='deleted'||a.status==='rejected')continue;
      if(await storageRelease(a.id,reason||'media retire'))done++;
    }
    return done;
  }catch(_){ return 0; }
}
async function upload(bucket,file,max,q,opts){
  const blob=await shrink(file,max,q);
  const path=S.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
  const claim=await storageClaim(path,bucket,blob.size,opts);
  const {error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error){
    // L'envoi a echoue : rendre le quota reserve, sinon il serait perdu.
    await storageRelease(claim.assetId,'envoi echoue');
    throw error;
  }
  return path;
}

async function fetchCatalog(opts){
  opts=opts||{};
  let q=sb.from('catalog_products').select('*').order('published_at',{ascending:false,nullsFirst:false}).limit(opts.limit||60);
  if(opts.rayon)q=q.eq('rayon_slug',opts.rayon);
  if(opts.sub)q=q.eq('category_slug',opts.sub);
  if(opts.shop)q=q.eq('shop_slug',opts.shop);
  if(opts.text)q=q.or('title.ilike.%'+opts.text+'%,description.ilike.%'+opts.text+'%');
  if(opts.city)q=q.eq('shop_city',opts.city);
  if(opts.inStock)q=q.gt('total_stock',0);
  if(opts.maxPrice)q=q.lte('min_price_cents',opts.maxPrice);
  const {data,error}=await q;
  if(error){fail(error,'Catalogue');return [];}
  return data||[];
}

function adQuoteLocal(tier,hours){

function adErrorText(err){
  const m=String((err&&err.message)||'');
  if(m.includes('niveau_publicite_inconnu'))return 'Choisissez Standard ou Premium.';
  if(m.includes('duree_publicite_inconnue'))return 'Choisissez une durée proposée.';
  if(m.includes('titre_publicite_trop_court'))return 'Le titre doit faire au moins 3 caractères.';
  if(m.includes('lien_publicite_invalide'))return 'Le lien doit commencer par / et rester dans le site.';
  if(m.includes('image_publicite_requise')||m.includes('image_publicite_invalide'))return 'Ajoutez une image valide (product-images/, shop-logos/ ou https://).';
  if(m.includes('boutique_invalide'))return 'Boutique introuvable.';
  if(/solde|insuffisant/i.test(m))return 'Votre compte publicitaire n\'a pas assez de fonds.';
  if(/ad_purchase|function|schema cache|does not exist|PGRST202/i.test(m))return 'La publicité n\'est pas encore activée sur le serveur. Aucun montant n\'a été débité.';
  return m||'La réservation a échoué.';
}

  /* ---------- FICHE PRODUIT ---------- */
  async product(id){
    topbar('back',{title:'Produit'});
    this.set('<div class="sk" style="aspect-ratio:1;border-radius:12px"></div><div class="sk sk-line" style="width:70%;margin-top:14px;height:22px"></div><div class="sk sk-line" style="width:40%"></div>');
    const {data:p,error}=await sb.from('products')
      .select('*, shops(*), categories!products_category_id_fkey(*), product_variants(*), product_images(*)')
      .eq('id',id).maybeSingle();
    if(error||!p){fail(error||new Error('Produit introuvable'),'Produit');go('#/');return;}
    const shop=p.shops||{}, cat=p.categories||{};
    const variants=(p.product_variants||[]).sort((a,b)=>a.position-b.position);
    const images=(p.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.position-b.position));
    const prof=profOf(cat);
    let sel=variants.find(v=>v.stock>0)||variants[0]||null;

    const {data:del}=await sb.from('shop_delivery').select('*').eq('shop_id',shop.id).maybeSingle();
    const {data:pay}=await sb.from('shop_payment').select('*').eq('shop_id',shop.id).maybeSingle();
    const dText=del?({included:'Livraison incluse dans le prix',separate:'Livraison en supplément : '+gds(del.fee_cents),
      pickup:'Retrait sur place uniquement',zones:'Frais selon la zone, à partir de '+gds(del.fee_cents)})[del.mode]:'À convenir avec le vendeur';
    const pays=[]; if(pay){ if(pay.cash_on_delivery)pays.push('Espèces à la livraison'); if(pay.moncash)pays.push('MonCash'); if(pay.bank_transfer)pays.push('Virement'); }
    const sizes=[...new Set(variants.map(v=>v.size).filter(Boolean))];
    const colors=[...new Set(variants.map(v=>v.color).filter(Boolean))];

    const render=()=>{
      const stock=sel?sel.stock:0;
      const price=sel?sel.price_cents:p.base_price_cents;
      const mes=sel&&sel.measures?sel.measures:{};
      const rows=prof.fields.filter(([k])=>mes[k]).map(([k,l,u])=>'<tr><td>'+l+'</td><td>'+esc(mes[k])+' '+u+'</td></tr>').join('');
      this.set(
        '<div class="gal enter"><div class="gal__main" id="galMain">'+
        (images[0]?'<img src="'+attr(prodImg(images[0].storage_path))+'" alt="">':ico('box'))+'</div>'+
        (images.length>1?'<div class="gal__thumbs">'+images.map((im,i)=>
          '<button class="'+(i===0?'on':'')+'" data-i="'+attr(i)+'"><img src="'+attr(prodImg(im.storage_path))+'" alt=""></button>').join('')+'</div>':'')+'</div>'+

        '<h1 class="t-h1 enter" style="margin-top:16px;animation-delay:.05s">'+esc(p.title)+'</h1>'+
        '<p class="enter" style="margin-top:8px;animation-delay:.07s"><span class="price" style="font-size:26px">'+gds(price)+'</span>'+
        (p.compare_at_cents?'<span class="was" style="font-size:15px">'+gds(p.compare_at_cents)+'</span>':'')+'</p>'+
        '<div class="enter" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;animation-delay:.09s">'+
        '<span class="badge badge--draft">'+esc(p.condition)+'</span>'+
        '<span class="badge badge--draft">'+esc(cat.label||'')+'</span>'+
        (stock>0?'<span class="badge badge--live"><span class="dot"></span>'+stock+' disponible'+(stock>1?'s':'')+'</span>':'<span class="badge badge--out">Épuisé</span>')+'</div>'+

        (sizes.length?'<div class="enter" style="margin-top:16px"><strong class="t-h3">Taille</strong><div class="vpick" id="vSize">'+
          sizes.map(s=>{const av=variants.some(v=>v.size===s&&v.stock>0);
            return '<button data-size="'+attr(s)+'"'+(sel&&sel.size===s?' class="on"':'')+(av?'':' disabled')+'>'+esc(s)+'</button>';}).join('')+'</div></div>':'')+
        (colors.length?'<div class="enter" style="margin-top:14px"><strong class="t-h3">Couleur</strong><div class="vpick" id="vColor">'+
          colors.map(c=>{const av=variants.some(v=>v.color===c&&v.stock>0);
            return '<button data-color="'+attr(c)+'"'+(sel&&sel.color===c?' class="on"':'')+(av?'':' disabled')+'>'+esc(c)+'</button>';}).join('')+'</div></div>':'')+

        (p.description?'<p class="enter" style="margin-top:16px;font-size:14.5px;color:var(--ink-2);line-height:1.65;max-width:62ch">'+esc(p.description)+'</p>':'')+

        (rows?'<div class="card enter" style="margin-top:18px"><div class="card__h">'+ico('ruler')+'<h3>Mesures réelles de l\'article</h3></div>'+
          '<div class="card__b"><table class="measure-tab">'+rows+'</table>'+
          '<p class="t-small" style="margin-top:10px">Mesuré à plat par le vendeur. Comparez avec un vêtement que vous possédez déjà.</p></div></div>':'')+

        '<div class="card enter" style="margin-top:14px"><div class="card__h">'+ico('truck')+'<h3>Livraison et paiement</h3></div>'+
        '<div class="card__b"><table class="measure-tab">'+
        '<tr><td>Livraison</td><td>'+esc(dText)+'</td></tr>'+
        (del&&del.delay_label?'<tr><td>Délai annoncé</td><td>'+esc(del.delay_label)+'</td></tr>':'')+
        (del&&del.zones?'<tr><td>Zones</td><td>'+esc(del.zones)+'</td></tr>':'')+
        (pays.length?'<tr><td>Paiement</td><td>'+esc(pays.join(', '))+'</td></tr>':'')+
        '</table><p class="t-small" style="margin-top:10px">VAlex Boutique ne livre pas et n\'encaisse pas. Tout se règle directement avec le vendeur.</p></div></div>'+

        '<div style="margin-top:14px" class="enter"><a class="shopline" href="#/boutique/'+attr(shop.slug||'')+'">'+
        '<span class="av">'+(shopImg(shop.logo_url)?'<img src="'+attr(shopImg(shop.logo_url))+'" alt="">':esc((shop.name||'B')[0]))+'</span>'+
        '<span style="flex:1;min-width:0"><strong style="display:block;font-size:14.5px">'+esc(shop.name||'')+'</strong>'+
        '<span class="t-small">'+esc(shop.city||'')+' · voir la boutique</span></span>'+
        '<span style="color:var(--ink-3);transform:rotate(180deg)">'+ico('back',2.2)+'</span></a></div>'+

        '<div class="btn-row" style="margin-top:14px">'+
        '<button class="btn btn--sm" id="favBtn">'+ico('heart')+'Favori</button>'+
        '<button class="btn btn--sm btn--ghost" id="repBtn">'+ico('flag')+'Signaler</button></div>'+

        '<div class="buybar"><div class="p"><div class="price" style="font-size:18px">'+gds(price)+'</div>'+
        '<div class="t-small">'+(stock>0?'Vendu par '+esc(shop.name||''):'Article épuisé')+'</div></div>'+
        '<button class="btn btn--mango btn--lg" id="addCart"'+(stock>0?'':' disabled')+'>Ajouter au panier</button></div>');

      $$('.gal__thumbs button').forEach(b=>b.onclick=()=>{
        $('#galMain').innerHTML='<img src="'+attr(prodImg(images[b.dataset.i].storage_path))+'" alt="">';
        $$('.gal__thumbs button').forEach(x=>x.classList.toggle('on',x===b));});
      $$('#vSize button').forEach(b=>b.onclick=()=>{
        const nv=variants.find(v=>v.size===b.dataset.size&&(!sel||!sel.color||v.color===sel.color)&&v.stock>0)
              ||variants.find(v=>v.size===b.dataset.size&&v.stock>0);
        if(nv){sel=nv;render();}});
      $$('#vColor button').forEach(b=>b.onclick=()=>{
        const nv=variants.find(v=>v.color===b.dataset.color&&(!sel||!sel.size||v.size===sel.size)&&v.stock>0)
              ||variants.find(v=>v.color===b.dataset.color&&v.stock>0);
        if(nv){sel=nv;render();}});
      const ac=$('#addCart'); if(ac)ac.onclick=()=>{
        if(!sel)return toast('Choisissez une variante.');
        const line=S.cart.find(x=>x.variantId===sel.id);
        if(line&&line.qty>=sel.stock)return toast('Stock maximum atteint.');
        cartAdd(sel.id,1); topbar('back',{title:'Produit'}); toast('Ajouté au panier.');};
      $('#favBtn').onclick=async ()=>{
        if(!S.user)return toast('Connectez-vous pour garder vos favoris.');
        const {error}=await sb.from('favorites').upsert({user_id:S.user.id,product_id:p.id});
        if(error)return fail(error,'Favori');
        toast('Ajouté à vos favoris.');};
      $('#repBtn').onclick=()=>reportDialog('product',p.id);
    };
    render();
  },

  /* ---------- PANIER ---------- */
  async cart(){
    topbar('back',{title:'Panier'});
    if(!S.cart.length){
      this.set('<div class="card enter"><div class="empty"><div class="empty__ic">'+ico('cart')+'</div>'+
        '<h3>Votre panier est vide</h3><p>Parcourez les rayons et ajoutez ce qui vous plaît. Aucun compte n\'est nécessaire pour regarder.</p>'+
        '<a class="btn btn--pri" href="#/explorer">Voir les articles</a></div></div>');
      return;
    }
    this.set(skeleton(2));
    const ids=S.cart.map(l=>l.variantId);
    const {data:vs,error}=await sb.from('product_variants')
      .select('*, products(id,title,status,shop_id, shops(id,name,slug,city), product_images(storage_path,is_primary,position))')
      .in('id',ids);
    if(error){fail(error,'Panier');return;}
    /* On retire silencieusement les lignes dont le produit a été
       dépublié ou supprimé entre-temps. */
    const valid=(vs||[]).filter(v=>v.products&&v.products.status==='published');
    if(valid.length!==S.cart.length){
      S.cart=S.cart.filter(l=>valid.some(v=>v.id===l.variantId)); saveCart(); paintTabbar();
    }
    if(!S.cart.length){ this.cart(); return; }

    const groups={};
    valid.forEach(v=>{
      const sh=v.products.shops;
      (groups[sh.id]=groups[sh.id]||{shop:sh,items:[]}).items.push(v);
    });
    const shopIds=Object.keys(groups);
    const {data:dels}=await sb.from('shop_delivery').select('*').in('shop_id',shopIds);
    let sub=0, ship=0;
    Object.values(groups).forEach(g=>{
      g.items.forEach(v=>{ const q=S.cart.find(x=>x.variantId===v.id).qty; sub+=v.price_cents*q; });
      const d=(dels||[]).find(x=>x.shop_id===g.shop.id);
      g.ship=(d&&(d.mode==='separate'||d.mode==='zones'))?d.fee_cents:0;
      g.mode=d?d.mode:'separate';
      ship+=g.ship;
    });

    this.set('<h1 class="t-h1 enter">Panier</h1>'+
      '<p class="t-sub enter" style="margin-top:4px">'+valid.length+' article'+(valid.length>1?'s':'')+' chez '+shopIds.length+' vendeur'+(shopIds.length>1?'s':'')+'</p>'+
      Object.values(groups).map((g,gi)=>{
        return '<div class="card enter" style="margin-top:14px;animation-delay:'+(.05+gi*.05)+'s">'+
        '<div class="card__h"><h3>'+esc(g.shop.name)+'</h3><span class="t-small" style="margin-left:auto">'+esc(g.shop.city)+'</span></div>'+
        '<div class="card__b" style="display:grid;gap:10px">'+
        g.items.map(v=>{
          const q=S.cart.find(x=>x.variantId===v.id).qty;
          const im=(v.products.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.position-b.position))[0];
          const label=[v.size,v.color].filter(Boolean).join(' · ');
          return '<div class="citem"><span class="citem__img">'+(im?'<img src="'+attr(prodImg(im.storage_path))+'" alt="">':'')+'</span>'+
          '<span class="citem__b"><strong>'+esc(v.products.title)+'</strong>'+
          (label?'<span class="t-small">'+esc(label)+'</span>':'')+
          '<span class="t-small">'+gds(v.price_cents)+' · stock '+v.stock+'</span></span>'+
          '<span class="qty"><button data-m="'+attr(v.id)+'">−</button><span>'+q+'</span><button data-pl="'+attr(v.id)+'" data-max="'+attr(v.stock)+'">+</button></span></div>';
        }).join('')+'</div>'+
        '<div class="card__f"><span class="t-small">Livraison : '+(g.ship?gds(g.ship):(g.mode==='pickup'?'retrait sur place':'incluse'))+'</span></div></div>';
      }).join('')+
      '<div class="card enter" style="margin-top:14px"><div class="card__b">'+
      '<div class="sumline"><span>Articles</span><span>'+gds(sub)+'</span></div>'+
      '<div class="sumline"><span>Livraison estimée</span><span>'+gds(ship)+'</span></div>'+
      '<div class="sumline total"><span>Total</span><b>'+gds(sub+ship)+'</b></div>'+
      '<button class="btn btn--mango btn--wide btn--lg" id="checkout" style="margin-top:14px">Passer la commande</button>'+
      '<p class="t-small" style="margin-top:10px;text-align:center">Chaque vendeur livre et encaisse sa propre commande.</p></div></div>');

    $$('[data-pl]').forEach(b=>b.onclick=()=>{
      const l=S.cart.find(x=>x.variantId===b.dataset.pl);
      if(l.qty>=Number(b.dataset.max))return toast('Stock maximum atteint.');
      l.qty++; saveCart(); paintTabbar(); this.cart();});
    $$('[data-m]').forEach(b=>b.onclick=()=>{
      const l=S.cart.find(x=>x.variantId===b.dataset.m);
      l.qty--; if(l.qty<=0)S.cart=S.cart.filter(x=>x.variantId!==b.dataset.m);
      saveCart(); paintTabbar(); this.cart();});
    $('#checkout').onclick=async ()=>{
      if(!S.user){
        if(await ask({title:'Connectez-vous pour commander',
          body:'<p>Vous pouvez regarder librement, mais un compte est nécessaire pour envoyer une commande à un vendeur.</p>',
          ok:'Créer un compte',cancel:'Plus tard'}))go('#/compte');
        return;
      }
      go('#/commander');
    };
  },

  async dash(){
    const {data:ps}=await sb.from('products').select('id,status,title').eq('shop_id',S.shop.id);
    const {data:vs}=await sb.from('product_variants').select('stock,price_cents,product_id');
    const mine=(ps||[]).map(p=>p.id);
    const myVars=(vs||[]).filter(v=>mine.includes(v.product_id));
    const live=(ps||[]).filter(p=>p.status==='published');
    const out=mine.filter(id=>{const g=myVars.filter(v=>v.product_id===id);return g.length&&g.every(v=>v.stock===0);});
    const val=myVars.reduce((t,v)=>t+v.price_cents*v.stock,0);
    const {data:free}=await sb.rpc('shop_free_status',{p_shop:S.shop.id});
    const {data:del}=await sb.from('shop_delivery').select('*').eq('shop_id',S.shop.id).maybeSingle();
    const {data:pay}=await sb.from('shop_payment').select('*').eq('shop_id',S.shop.id).maybeSingle();
    const tasks=[
      {d:!!S.shop.logo_url,t:'Ajouter le logo de la boutique',x:'Une boutique sans image inspire moins confiance.',g:'#/ma-boutique'},
      {d:(ps||[]).length>0,t:'Publier un premier produit',x:'Sans produit, votre page publique est vide.',g:'#/produits/nouveau'},
      {d:(ps||[]).length>=5,t:'Atteindre 5 produits',x:'En dessous de cinq articles, les visiteurs repartent.',g:'#/produits/nouveau'},
      {d:!!del,t:'Régler vos conditions de livraison',x:'Chaque produit en hérite.',g:'#/livraison'},
      {d:!!(pay&&(pay.cash_on_delivery||pay.moncash||pay.bank_transfer)),t:'Choisir vos moyens de paiement',x:'Les acheteurs veulent savoir comment payer.',g:'#/paiement'}];
    const rest=tasks.filter(t=>!t.d).length;
    this.set('<div class="phead enter"><div class="phead__t"><h1>Bonjour '+esc((S.profile||{}).first_name||'')+'</h1>'+
      '<p>'+(rest?'Il reste '+rest+' chose'+(rest>1?'s':'')+' à régler.':'Votre boutique est complète. Faites-la connaître.')+'</p></div>'+
      '<a class="btn btn--pri" href="#/produits/nouveau">Ajouter un produit</a></div>'+
      '<div class="stats enter">'+
      '<div class="stat accent"><b data-count="'+(ps||[]).length+'">0</b><span>Produits enregistrés</span></div>'+
      '<div class="stat"><b data-count="'+attr(live.length)+'">0</b><span>Visibles par les clients</span></div>'+
      '<div class="stat"><b data-count="'+attr(out.length)+'">0</b><span>En rupture</span></div>'+
      '<div class="stat"><b data-money="'+attr(val)+'">0</b><span>Valeur du stock</span></div></div>'+
      '<div class="card enter" style="margin-top:16px"><div class="card__h"><h3>Mise en route</h3>'+
      '<span class="badge '+(rest?'badge--warn':'badge--live')+'">'+(tasks.length-rest)+' sur '+tasks.length+'</span></div>'+
      tasks.map(t=>'<a class="task '+(t.d?'done':'')+'" href="'+attr(t.g)+'">'+
        '<span class="task__box"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>'+
        '<span class="task__t"><strong>'+esc(t.t)+'</strong><span>'+esc(t.x)+'</span></span></a>').join('')+'</div>'+
      (free?'<div class="card enter" style="margin-top:16px"><div class="card__b">'+
        '<span class="badge badge--live"><span class="dot"></span>'+(free.is_free?'Gratuit jusqu\'au 31 décembre 2026 inclus':'Période de gratuité terminée')+'</span>'+
        '<p class="t-sub" style="margin-top:10px">'+(free.is_free?'Il reste '+free.days_left+' jours. Aucune carte demandée, aucun prélèvement automatique.':'La date est passée. Aucun prélèvement et aucune suspension automatiques : votre boutique reste en ligne jusqu\'à une décision annoncée à l\'avance.')+' Aucune commission sur vos ventes.</p></div></div>':'')+
      '<div class="card enter" style="margin-top:16px"><div class="card__b">'+
      '<p class="t-small" style="margin-bottom:12px">Page publique : <strong>/'+esc(S.shop.slug)+'</strong></p>'+
      '<a class="btn btn--pri btn--sm" href="#/boutique/'+attr(S.shop.slug)+'">Voir ma boutique comme un client</a></div></div>');
    countUp();
  },
