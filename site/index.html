  const lines=o.lines||[{k:'y',c:'#FF6A00'}];
  const max=Math.max(1,...pts.flatMap(p=>lines.map(l=>+p[l.k]||0)));
  const X=i=>L+(n<2?0:i*(W-L-R)/(n-1)), Y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  [0,.5,1].forEach(f=>{const y=Y(max*f); g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#EEE"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="#999">'+kfmt(max*f)+'</text>';});
  lines.forEach((l,li)=>{
    const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(+p[l.k]||0).toFixed(1)).join(' ');
    if(li===0)g+='<path d="'+d+' L'+X(n-1)+' '+(H-B)+' L'+L+' '+(H-B)+'Z" fill="url(#gr_'+id+')"/>';
    g+='<path d="'+d+'" fill="none" stroke="'+l.c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"'+(l.dash?' stroke-dasharray="4 3"':'')+'/>';
  });
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i&&v>=0).forEach(i=>{g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'" font-size="9" fill="#999">'+esc(pts[i].x)+'</text>';});
  g+='<line id="cur_'+id+'" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="#111" stroke-width="1" opacity="0"/>';
  return '<div class="chart" id="ch_'+id+'"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img"><defs><linearGradient id="gr_'+id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+lines[0].c+'" stop-opacity=".22"/><stop offset="1" stop-color="'+lines[0].c+'" stop-opacity="0"/></linearGradient></defs>'+g+'</svg>'+
    '<div class="chart__tip" id="tip_'+id+'">Touchez le graphique pour voir un jour précis.</div></div>';
}
function bindChart(id,pts,fmt){
  const box=$('#ch_'+id); if(!box)return; const svg=box.querySelector('svg'), n=pts.length;
  const pick=e=>{const r=svg.getBoundingClientRect(), x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*320;
    const i=Math.max(0,Math.min(n-1,Math.round((x-34)/((320-42)/Math.max(1,n-1)))));
    const c=$('#cur_'+id); c.setAttribute('x1',34+i*(320-42)/Math.max(1,n-1)); c.setAttribute('x2',c.getAttribute('x1')); c.setAttribute('opacity','.35');
    $('#tip_'+id).innerHTML=fmt(pts[i]);};
  svg.addEventListener('click',pick); svg.addEventListener('touchmove',pick,{passive:true});
}
function barChart(vals,labels,hi){
  const max=Math.max(1,...vals);
  return '<div class="bars">'+vals.map((v,i)=>'<div class="bars__c'+(i===hi?' hi':'')+'"><i style="height:'+Math.max(3,Math.round(v/max*100))+'%"></i><span>'+esc(labels[i]||'')+'</span></div>').join('')+'</div>';
}
function hbars(list){ const max=Math.max(1,...list.map(x=>x.n));
  return '<div class="hbars">'+list.map(x=>'<div><span>'+esc(x.k)+'</span><i><b style="width:'+Math.round(x.n/max*100)+'%"></b></i><em>'+x.n+'</em></div>').join('')+'</div>'; }
const delta=(a,b)=>{ if(!b)return a?'<span class="up">nouveau</span>':'<span>—</span>'; const p=Math.round((a-b)/b*100); return '<span class="'+(p>=0?'up':'down')+'">'+(p>=0?'+':'')+p+' %</span>'; };

(function(){
const _h=builderHtml, _b=bindBuilder;
builderHtml=function(d,sizes){
  const sz=[...new Set(d.vars.map(v=>v.size).filter(Boolean))], co=[...new Set(d.vars.map(v=>v.color).filter(Boolean))];
  let x='';
  if(sz.length>1)x+='<div class="vbuild vprice"><strong>3. Prix par taille <span class="opt">— facultatif</span></strong><p class="t-small">Une grande taille coûte plus cher ? Mettez son prix ici : il s\'applique à toutes ses couleurs. Laissez vide pour garder le prix de base.</p>'+
    '<div class="pgridin">'+sz.map(s=>{const v=d.vars.find(y=>y.size===s); return '<label><span>'+esc(s)+'</span><input type="number" inputmode="decimal" min="0" step="25" data-psz="'+esc(s)+'" value="'+esc(v&&v.price||'')+'" placeholder="'+esc(d.price||'Prix')+'"></label>';}).join('')+'</div></div>';
  if(co.length>1)x+='<div class="vbuild vprice"><strong>'+(sz.length>1?'4':'3')+'. Une couleur coûte plus cher ? <span class="opt">— facultatif</span></strong>'+
    '<div class="pgridin">'+co.map(c=>'<label><span>'+esc(c)+'</span><input type="number" inputmode="decimal" step="25" data-pco="'+esc(c)+'" placeholder="+ 0"></label>').join('')+'</div><p class="t-small">Montant ajouté au prix de la taille, ex. + 250 pour le rouge.</p></div>';
  return _h(d,sizes)+x;
};
bindBuilder=function(d,paint,collect){
  _b(d,paint,collect);
  $$('[data-psz]').forEach(i=>i.addEventListener('change',()=>{ collect(); d.vars.filter(v=>v.size===i.dataset.psz).forEach(v=>{v.price=i.value||d.price||'';v._base=v.price;}); paint(); toast('Prix '+i.dataset.psz+' appliqué à toutes ses couleurs.'); }));
  $$('[data-pco]').forEach(i=>i.addEventListener('change',()=>{ collect(); const add=+i.value||0; let miss=0; d.vars.filter(v=>v.color===i.dataset.pco).forEach(v=>{const b=+(v._base||v.price||d.price||0); if(!b){miss++;return;} v._base=b; v.price=String(b+add);}); paint(); toast(miss?'Mettez d\'abord le prix de base (onglet L\'article) ou le prix par taille.':'Prix de la couleur '+i.dataset.pco+' mis à jour.'); }));
};
})();

    a.onclick=e=>{e.preventDefault(); startChat(txt);};
  });
}

async function startChat(draft){
  if(!S.user){ if(await ask({title:'Écrire au vendeur',body:'<p>Créez un compte gratuit (une minute) pour écrire aux vendeurs. Vos conversations restent privées.</p>',ok:'Créer un compte',cancel:'Plus tard'}))go('#/compte'); return; }
  const h=location.hash.replace('#/',''), [seg,a]=h.split('/'); const id=String(a||'').split('?')[0];
  let shop=null, product=null, order=null;
  try{
    if(seg==='produit'){ const {data}=await sb.from('products').select('id,shop_id').eq('id',id).maybeSingle(); if(data){shop=data.shop_id;product=data.id;} }
    else if(seg==='boutique'){ const {data}=await sb.from('shops').select('id').eq('slug',id).maybeSingle(); if(data)shop=data.id; }
    else if(seg==='commande'){ const {data}=await sb.from('orders').select('id,shop_id').eq('id',id).maybeSingle(); if(data){shop=data.shop_id;order=data.id;} }
    else if(seg==='merci'){ const {data}=await sb.from('orders').select('id,shop_id').eq('buyer_id',S.user.id).order('created_at',{ascending:false}).limit(1); if(data&&data[0]){shop=data[0].shop_id;order=data[0].id;} }
    if(!shop)return toast('Ouvrez la page de la boutique pour lui écrire.');
    const {data:cid,error}=await sb.rpc('open_conversation',{p_shop:shop,p_product:product,p_order:order}); if(error)throw error;
    if(draft)sessionStorage.setItem('valex_draft_'+cid,draft);
    go('#/messages/'+cid);
  }catch(e){ fail(e,'Message'); }
}

        const nm=asSeller?(c.buyer_name||'Client'):(s.name||'Boutique'), lg=!asSeller&&s.logo_url?shopImg(s.logo_url):null;
        return '<a class="crow'+(un?' un':'')+'" href="#/messages/'+c.id+'"><span class="av">'+(lg?'<img src="'+lg+'" alt="">':esc(nm[0]||'?'))+'</span><span class="crow__b"><strong>'+esc(nm)+(asSeller?' <em class="tagsel">ma boutique</em>':'')+'</strong><span>'+esc(c.last_text||'Nouvelle conversation')+'</span></span><span class="crow__t">'+fdt(c.last_at)+(un?'<b>'+un+'</b>':'')+'</span></a>';}).join('')+'</div>'
       :'<div class="card"><div class="empty"><div class="empty__ic">'+ico('chat')+'</div><h3>Aucun message</h3><p>Sur un article ou une boutique, touchez « Écrire au vendeur ». La réponse arrive ici et la cloche vous prévient.</p></div></div>');
  } else {

    (mine||[]).forEach(o=>ev.push({t:o.updated_at||o.created_at,h:'#/commande/'+o.id,i:o.status==='cancelled'?'x':o.status==='delivered'?'star':'pkg',x:'Votre commande <b>'+esc(o.number)+'</b> : '+esc(ORDER_LABEL[o.status]||o.status)}));
    if(S.shop){ const {data:so}=await sb.from('orders').select('id,number,status,created_at,accept_by').eq('shop_id',S.shop.id).eq('status','pending');
      (so||[]).forEach(o=>ev.push({t:o.created_at,h:'#/commandes?t=pending',i:'cart',x:'Nouvelle commande <b>'+esc(o.number)+'</b> à accepter avant le '+fdt(o.accept_by),hot:1})); }
    const {data:pr}=await sb.from('pro_requests').select('*').eq('user_id',S.user.id).neq('status','pending');
    (pr||[]).forEach(r=>ev.push({t:r.decided_at||r.created_at,h:'#/pro',i:'crown',x:r.status==='approved'?'VAlex Pro est activé. Merci !':'Demande Pro refusée'+(r.note?' : '+esc(r.note):'.')}));

V.chat=async function(cid){
  topbar('back',{title:'Conversation'});
  const {data:c,error}=await sb.from('conversations').select('*').eq('id',cid).maybeSingle();
  if(error||!c){ this.set('<div class="card"><div class="empty"><h3>Conversation introuvable</h3><p>Elle est privée : seuls ses deux participants peuvent l\'ouvrir.</p></div></div>'); return; }
  const asSeller=S.shop&&c.shop_id===S.shop.id;
  const {data:s}=await sb.from('shops').select('name,slug,logo_url').eq('id',c.shop_id).maybeSingle();
  const nm=asSeller?(c.buyer_name||'Client'):((s||{}).name||'Boutique');
  topbar('back',{title:nm});
  let pc='';
  if(c.product_id){ const l=await fetchCatalog({limit:80}); const p=l.find(x=>x.id===c.product_id); if(p)pc='<a class="chatprod" href="#/produit/'+p.id+'"><img src="'+(prodImg(p.cover_path)||'')+'" alt=""><span><strong>'+esc(p.title)+'</strong><b>'+gds(p.min_price_cents||p.base_price_cents)+'</b></span>'+ico('chev',2)+'</a>'; }
  this.set('<div class="chat"><div class="privnote">'+ico('lock',2)+'<span>Privé : seuls vous et '+esc(nm)+' lisez cette conversation. Ne payez jamais en dehors d\'une commande VAlex.</span></div>'+pc+
    '<div class="msgs" id="msgs"><div class="spin" style="margin:20px auto"></div></div>'+
    '<div class="quick" id="quick">'+(asSeller?['Oui, disponible.','Je vous livre demain.','Quelle taille voulez-vous ?','Merci pour votre commande !']:['Est-ce disponible ?','Quelles tailles avez-vous ?','Vous livrez où ?','Prix pour 3 ?']).map(q=>'<button>'+esc(q)+'</button>').join('')+'</div>'+
    '<div class="composer"><textarea id="mIn" rows="1" maxlength="2000" placeholder="Votre message…"></textarea><button id="mGo" aria-label="Envoyer">'+ico('send',2.2)+'</button></div></div>');
  document.body.classList.add('inchat');
  const d=sessionStorage.getItem('valex_draft_'+cid); if(d){$('#mIn').value=d; sessionStorage.removeItem('valex_draft_'+cid);}
  let last=0; const box=$('#msgs');
  const paint=(rows)=>{ if(!last)box.innerHTML='';
    if(!rows.length){ if(!last)box.innerHTML='<p class="t-small" style="text-align:center;padding:20px">Écrivez le premier message.</p>'; return; }
    const ph=box.querySelector('p.t-small'); if(ph)ph.remove();
    rows.forEach(m=>{ if(m.id<=last)return; last=m.id; box.insertAdjacentHTML('beforeend','<div class="msg'+(m.sender_id===S.user.id?' me':'')+'"><span>'+esc(m.body).replace(/\n/g,'<br>')+'</span><em>'+fdt(m.created_at)+'</em></div>'); });
    box.scrollTop=box.scrollHeight; window.scrollTo(0,document.body.scrollHeight); };
  const load=async ()=>{ const {data:m}=await sb.from('messages').select('*').eq('conversation_id',cid).gt('id',last).order('id'); paint(m||[]); sb.rpc('mark_read',{p_conv:cid}).then(()=>{}); };
  await load();
  let ch=null, poll=null;
  if(sb.channel){ try{ ch=sb.channel('c'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+cid},()=>load()).subscribe(); }catch(e){ch=null;} }
  poll=setInterval(()=>{ if(!document.hidden)load(); },ch?20000:6000);
  const stop=()=>{ clearInterval(poll); if(ch&&sb.removeChannel)sb.removeChannel(ch); document.body.classList.remove('inchat'); removeEventListener('hashchange',stop); };
  addEventListener('hashchange',stop);
  $$('#quick button').forEach(b=>b.onclick=()=>{ $('#mIn').value=b.textContent; $('#mIn').focus(); });
  const inp=$('#mIn'); inp.addEventListener('input',()=>{inp.style.height='auto'; inp.style.height=Math.min(120,inp.scrollHeight)+'px';});
  $('#mGo').onclick=async ()=>{ const t=inp.value.trim(); if(!t)return;
    if(/(\d[\s.-]?){8,}|wa\.me|whats ?app|moncash\s*\d/i.test(t)&&!await ask({title:'Prudence',body:'<p>Vous partagez un numéro ou un autre moyen de contact. Les arnaqueurs demandent souvent de payer en dehors de VAlex : dans ce cas, aucune protection, pas de code de réception, pas d\'avis vérifié.</p>',ok:'Envoyer quand même',cancel:'Modifier'}))return;
    $('#mGo').disabled=true; const {error}=await sb.from('messages').insert({conversation_id:cid,sender_id:S.user.id,body:t,ref_product:c.product_id||null}); $('#mGo').disabled=false;
    if(error)return fail(error,'Message'); inp.value=''; inp.style.height='auto'; load(); };
};

  '<h3>Où sont les données</h3><p>Chez notre hébergeur de base de données (Supabase), sur des serveurs sécurisés hors d\'Haïti, avec des règles d\'accès ligne par ligne. Le site lui-même est servi par Cloudflare. Les numéros de paiement des vendeurs ne sont visibles que par des personnes connectées.</p>'+

function fileToB64(file,max){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const r=Math.min(1,(max||512)/Math.max(im.width,im.height));
  const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.78).split(',')[1]); }; im.onerror=()=>res(null); im.src=fr.result; }; fr.onerror=()=>res(null); fr.readAsDataURL(file); }); }

/* ---------- 3. Recherche qui pardonne les fautes et les accents ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function lev(a,b){ if(Math.abs(a.length-b.length)>2)return 9; const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
const SYN={soulye:'chaussure',sapat:'sandale',rad:'vetement',wob:'robe',sak:'sac',telefon:'telephone',bijou:'bijou',cheve:'cheveux',pantalon:'pantalon',chemiz:'chemise',jip:'jupe',bebe:'bebe',jwet:'jouet',manje:'alimentation',kreyon:'crayon',liv:'livre',solè:'solaire',panno:'panneau'};
(function(){
const _f=fetchCatalog;
fetchCatalog=async function(opts){
  const l=await _f(opts);
  if(!opts||!opts.text||l.length)return l;
  const all=await _f(Object.assign({},opts,{text:null,limit:300}));
  const words=norm(opts.text).split(/[^a-z0-9]+/).filter(w=>w.length>1).map(w=>SYN[w]||w);
  if(!words.length)return [];
  const score=p=>{ const toks=norm(p.title+' '+(p.category_label||'')+' '+(p.rayon_label||'')+' '+(p.description||'')).split(/[^a-z0-9]+/);
    return words.reduce((s,w)=>s+(toks.some(t=>t.startsWith(w)||w.startsWith(t)&&t.length>3||(w.length>3&&lev(w,t)<=(w.length>6?2:1)))?1:0),0); };
  return all.map(p=>[p,score(p)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,opts.limit||60).map(x=>x[0]);
};
})();

async function statusImage(p,shop){
  const W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#111'; x.fillRect(0,0,W,H); x.fillStyle='#FF6A00'; x.fillRect(0,0,W,14);
  const src=prodImg(p.cover_path||(p.image_paths||[])[0]);
  if(src){ try{ const im=await loadImage(src); const s=Math.max(W/im.width,1150/im.height); const w=im.width*s,h=im.height*s; x.save(); x.beginPath(); if(x.roundRect)x.roundRect(60,120,W-120,1150,40); else x.rect(60,120,W-120,1150); x.clip(); x.drawImage(im,(W-w)/2,120+(1150-h)/2,w,h); x.restore(); }catch(e){} }
  x.fillStyle='#fff'; x.font='700 64px system-ui,sans-serif'; const t=String(p.title||''); const words=t.split(' '); let line='',y=1360;
  for(const w of words){ if(x.measureText(line+w).width>W-140){ x.fillText(line.trim(),70,y); y+=76; line=''; if(y>1440)break; } line+=w+' '; } if(y<=1440)x.fillText(line.trim(),70,y);
  x.fillStyle='#FF6A00'; x.font='800 104px system-ui,sans-serif'; x.fillText(gds(p.min_price_cents||p.base_price_cents),70,y+130);
  x.fillStyle='#ddd'; x.font='500 40px system-ui,sans-serif'; x.fillText((shop||p.shop_name||'')+' · VAlex Boutique',70,y+200);
  try{ await loadQR(); const q=qrcode(0,'M'); q.addData(prodLink(p.id)); q.make(); const n=q.getModuleCount(), sz=300, cs=sz/n, qx=W-70-sz, qy=H-70-sz;
    x.fillStyle='#fff'; x.fillRect(qx-20,qy-20,sz+40,sz+40); x.fillStyle='#111'; for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(qx+k*cs,qy+r*cs,Math.ceil(cs),Math.ceil(cs));
    x.fillStyle='#fff'; x.font='600 36px system-ui,sans-serif'; x.fillText('Scannez pour commander',70,H-120); }catch(e){ x.fillStyle='#fff'; x.font='600 36px system-ui,sans-serif'; x.fillText(prodLink(p.id).replace(/^https?:\/\//,''),70,H-120); }
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}

    this.role=role||'seller'; this.step=1; this.dir=1;
    if(role==='shop-only'&&S.profile){
      this.d.user={firstName:S.profile.first_name,lastName:S.profile.last_name,age:S.profile.age,
        phone:S.profile.phone||'',department:S.profile.department||''};
      this.d.shop.department=S.profile.department||'';
    }
    $('#wiz').classList.add('on'); document.body.style.overflow='hidden'; this.render();
  },
  close(){$('#wiz').classList.remove('on');document.body.style.overflow='';},
  go(n){this.dir=n>this.step?1:-1;this.step=n;this.render();},
  render(){
    const seq=this.seq(), t=seq.length-1;
    const name=seq[this.step-1]||'fin';
    $('#wizCount').textContent=name==='fin'?'Terminé':'Étape '+this.step+' sur '+t;
    $('#wizBar').style.width=Math.min(100,(this.step-1)/t*100)+'%';
    const c=$('#wizCard'); c.className='wiz__card '+(this.dir>0?'slide-in-r':'slide-in-l');
    c.innerHTML=this['v_'+name]();
    this['b_'+name]&&this['b_'+name]();
    $('#wizQuit').classList.toggle('hidden',name==='fin');
    $('#wiz').scrollTo({top:0,behavior:'smooth'});
  },

  v_perso(){const d=this.d.user;return `
    <div class="wiz__head"><h2>Qui êtes-vous&nbsp;?</h2>
      <p>${this.role==='buyer'?'Ces informations servent à vous joindre pour vos commandes. Elles ne sont pas publiques.':'Ces informations restent privées. Vos clients ne les verront jamais.'}</p></div>
    <div class="row2">
      <div class="field"><label for="f_fn">Prénom <span class="req">*</span></label><input type="text" id="f_fn" value="${esc(d.firstName)}"><div class="err">Indiquez votre prénom.</div></div>
      <div class="field"><label for="f_ln">Nom <span class="req">*</span></label><input type="text" id="f_ln" value="${esc(d.lastName)}"><div class="err">Indiquez votre nom.</div></div></div>
    <div class="field"><label for="f_age">Âge <span class="req">*</span></label>
      <input type="number" id="f_age" min="18" max="110" value="${esc(d.age)}" inputmode="numeric" placeholder="25"><div class="err">Vous devez avoir 18 ans ou plus.</div></div>
    <div class="field"><label for="f_ph">Téléphone <span class="req">*</span></label>
      <div class="tel"><span>+509</span><input type="tel" id="f_ph" maxlength="8" inputmode="numeric" value="${esc(d.phone)}"></div>
      <div class="err">Un numéro haïtien compte 8 chiffres.</div></div>
    <div class="field"><label for="f_dep">Département <span class="req">*</span></label>${selDept('f_dep',d.department)}<div class="err">Choisissez votre département.</div></div>
    <div class="field" style="margin-bottom:0"><label>Pays</label><input type="text" value="Haïti" disabled style="opacity:.72">
      <div class="hint">VAlex Boutique n'accepte que des comptes situés en Haïti.</div></div>
    <div class="btn-row btn-row--split" style="margin-top:20px"><span></span><button class="btn btn--pri" id="nx">Continuer</button></div>`;},
  b_perso(){ telOnly('#f_ph');
    $('#nx').onclick=()=>{const d=this.d.user;let ok=true;
      ok=req('#f_fn',v=>v.trim().length>=2)&&ok; ok=req('#f_ln',v=>v.trim().length>=2)&&ok;
      ok=req('#f_age',v=>+v>=18&&+v<=110)&&ok; ok=req('#f_ph',v=>/^\d{8}$/.test(v))&&ok; ok=req('#f_dep',v=>!!v)&&ok;
      if(!ok)return toast('Corrigez les champs en rouge.');
      d.firstName=$('#f_fn').value.trim();d.lastName=$('#f_ln').value.trim();d.age=$('#f_age').value.trim();
      d.phone=$('#f_ph').value;d.department=$('#f_dep').value;
      if(!this.d.shop.department)this.d.shop.department=d.department;
      this.go(2);};},

  v_boutique(){const s=this.d.shop;const first=this.role==='shop-only';return `
    <div class="wiz__head"><h2>Votre boutique</h2><p>Tout ce que vous écrivez ici sera visible par vos acheteurs.</p></div>
    <div class="field"><label>Logo <span class="opt">— facultatif</span></label>
      <label class="logo-drop" for="f_lg" style="cursor:pointer">
        <div class="logo-drop__img" id="lgP">${s.logoPath?`<img src="${shopImg(s.logoPath)}" alt="">`:'Aucune<br>image'}</div>
        <div class="logo-drop__txt"><strong>${s.logoPath?"Changer l'image":"Ajouter une image"}</strong><span>${S.user?'Envoyée sur le serveur.':'Vous pourrez l\'ajouter juste après.'}</span></div>
      </label>${S.user?'<input type="file" id="f_lg" accept="image/*" class="sr">':''}</div>
    <div class="field"><label for="f_sn">Nom de la boutique <span class="req">*</span></label>
      <input type="text" id="f_sn" value="${esc(s.name)}" placeholder="Boutique Marie"><div class="err">Donnez un nom.</div>
      <div class="hint" id="slugH"></div></div>
    <div class="field"><label for="f_ac">Que vendez-vous&nbsp;? <span class="req">*</span></label>
      <input type="text" id="f_ac" value="${esc(s.activity)}" placeholder="Des vêtements pour femmes et enfants"><div class="err">Décrivez en une phrase.</div>
      <div class="hint">Écrivez-le avec vos mots. Pas de liste à choisir.</div></div>
    <div class="field"><label for="f_ds">Présentation <span class="opt">— facultatif</span></label>
      <textarea id="f_ds">${esc(s.description)}</textarea></div>
    <div class="row2">
      <div class="field"><label for="f_sd">Département <span class="req">*</span></label>${selDept('f_sd',s.department)}<div class="err">Champ obligatoire.</div></div>
      <div class="field"><label for="f_sc">Ville <span class="req">*</span></label><select id="f_sc"></select><div class="err">Champ obligatoire.</div></div></div>
    <div class="field" style="margin-bottom:0"><label for="f_sp">Numéro affiché aux clients <span class="req">*</span></label>
      <div class="tel"><span>+509</span><input type="tel" id="f_sp" maxlength="8" inputmode="numeric" value="${esc(s.phone)}"></div>
      <div class="err">8 chiffres attendus.</div>
      <label class="check" style="margin-top:9px"><input type="checkbox" id="f_same"> <span>Utiliser mon numéro personnel</span></label></div>
    <div class="btn-row btn-row--split" style="margin-top:20px">
      ${first?'<span></span>':'<button class="btn btn--ghost" id="pv">Retour</button>'}
      <button class="btn ${first?'btn--mango':'btn--pri'}" id="nx">${first?'Ouvrir ma boutique':'Continuer'}</button></div>`;},
  b_boutique(){const s=this.d.shop;
    telOnly('#f_sp'); bindCity('#f_sd','#f_sc',s.city);
    $('#f_sn').addEventListener('input',e=>{$('#slugH').textContent=e.target.value.trim()?'Adresse : /'+slugify(e.target.value):'';});
    $('#f_sn').dispatchEvent(new Event('input'));
    $('#f_same').onchange=e=>{if(e.target.checked)$('#f_sp').value=this.d.user.phone;};
    const lg=$('#f_lg'); if(lg)lg.onchange=async e=>{
      const f=e.target.files[0]; if(!f)return;
      try{ toast('Envoi…'); s.logoPath=await upload('shop-logos',f,400,.82);
        $('#lgP').innerHTML='<img src="'+shopImg(s.logoPath)+'" alt="">'; toast('Image envoyée.'); }
      catch(err){ fail(err,'Logo'); }};
    const pv=$('#pv'); if(pv)pv.onclick=()=>this.go(1);
    $('#nx').onclick=()=>{let ok=true;
      ok=req('#f_sn',v=>v.trim().length>=2)&&ok; ok=req('#f_ac',v=>v.trim().length>=4)&&ok;
      ok=req('#f_sd',v=>!!v)&&ok; ok=req('#f_sc',v=>!!v)&&ok; ok=req('#f_sp',v=>/^\d{8}$/.test(v))&&ok;
      if(!ok)return toast('Corrigez les champs en rouge.');
      s.name=$('#f_sn').value.trim();s.activity=$('#f_ac').value.trim();s.description=$('#f_ds').value.trim();
      s.department=$('#f_sd').value;s.city=$('#f_sc').value;s.phone=$('#f_sp').value;
      if(this.role==='shop-only')this.finish(); else this.go(this.step+1);};},

  v_compte(){return `
    <div class="wiz__head"><h2>Sécurisez votre compte</h2>
      <p>Cet email vous servira à vous connecter et à récupérer votre compte si vous changez de téléphone.</p></div>
    <div class="field"><label for="f_em">Email <span class="req">*</span></label>
      <input type="email" id="f_em" value="${esc(this.d.acc.email)}" autocomplete="email"><div class="err" id="emE">Cet email n'est pas valide.</div></div>
    <div class="field"><label for="f_pw">Mot de passe <span class="req">*</span></label>
      <input type="password" id="f_pw" autocomplete="new-password" placeholder="8 caractères minimum"><div class="err">Choisissez un mot de passe plus solide.</div>
      <div class="pw-meter" id="pwm"><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="lab" id="pwL">Faible</span></div>
      <ul class="pw-rules" id="pwR">${['Au moins 8 caractères','Une lettre majuscule','Une lettre minuscule','Un chiffre','Un caractère spécial']
        .map(t=>`<li><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>${t}</li>`).join('')}</ul>
      <div class="hint" id="pwW" style="margin-top:7px"></div></div>
    <div class="field"><label for="f_pw2">Confirmez <span class="req">*</span></label>
      <input type="password" id="f_pw2" autocomplete="new-password"><div class="err">Les deux mots de passe sont différents.</div></div>
    <label class="check" style="margin-top:4px"><input type="checkbox" id="f_tc">
      <span>J'accepte les <a href="#/conditions" target="_blank">conditions d'utilisation</a> et la <a href="#/confidentialite" target="_blank">politique de confidentialité</a>.</span></label>
    <div class="err" id="tcE" style="display:none;margin-top:8px">Vous devez accepter les conditions.</div>
    <div class="btn-row btn-row--split" style="margin-top:20px">
      <button class="btn btn--ghost" id="pv">Retour</button><button class="btn btn--mango" id="nx">Créer mon compte</button></div>`;},
  b_compte(){
    const pw=$('#f_pw'), m=$('#pwm'), rl=$$('#pwR li');
    pw.addEventListener('input',()=>{const v=pw.value;
      const c=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v)];
      const sc=c.filter(Boolean).length;
      $$('#pwm .seg').forEach((s,i)=>s.classList.toggle('on',i<sc));
      m.className='pw-meter lv'+sc;
      $('#pwL').textContent=sc>=5?'Excellent':sc>=4?'Fort':sc===3?'Moyen':'Faible';
      rl.forEach((li,i)=>li.classList.toggle('ok',c[i]));
      const weak=/^(12345678|password|motdepasse|azerty|qwerty|00000000|haiti123)$/i.test(v);
      $('#pwW').textContent=weak?'Ce mot de passe figure dans toutes les listes des pirates.':(sc<3&&v?'Mélangez majuscules, chiffres et symboles.':'');});
    $('#pv').onclick=()=>this.go(this.step-1);
    $('#nx').onclick=async ()=>{
      let ok=true; const em=$('#f_em').value.trim();
      const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
      ok=req('#f_em',()=>valid)&&ok;
      const v=pw.value, sc=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;
      ok=req('#f_pw',()=>v.length>=8&&sc>=3)&&ok; ok=req('#f_pw2',x=>x===v&&x.length>0)&&ok;
      if(!$('#f_tc').checked){$('#tcE').style.display='block';ok=false;}
      if(!ok)return toast('Corrigez les champs en rouge.');
      this.d.acc.email=em; this.d.acc.pw=v;
      this.finish();};},

  async finish(){
    const d=this.d, role=this.role==='buyer'?'buyer':'seller';
    busy('#nx',true,'Création…');
    try{
      if(!S.user){
        const {data,error}=await sb.auth.signUp({email:d.acc.email,password:d.acc.pw,
          options:{emailRedirectTo:location.origin+location.pathname,data:{role:role,first_name:d.user.firstName,last_name:d.user.lastName,
            phone:d.user.phone,department:d.user.department}}});
        if(error)throw error;
        if(!data.session){
          busy('#nx',false);
          return ask({title:'Confirmation par email requise',
            body:"<p>Votre compte est créé. Ouvrez l'email de confirmation envoyé à <b>"+esc(d.acc.email)+"</b>, touchez le lien, puis revenez vous connecter"+(role==='seller'?' pour ouvrir votre boutique':'')+".</p><p style=\"margin-top:9px\">Regardez aussi dans les spams.</p>",
            ok:'Compris',cancel:false});
        }
        await loadSession();
        /* Le déclencheur crée le profil ; on complète l'âge, qui
           ne fait pas partie des métadonnées d'inscription. */
        if(d.user.age)await sb.from('profiles').update({age:Number(d.user.age)}).eq('id',S.user.id);
        await loadSession();
      }
      if(role==='seller'||this.role==='shop-only'){
        let base=slugify(d.shop.name), slug=base, n=2;
        for(;;){
          const {data:ex}=await sb.from('shops').select('id').eq('slug',slug).maybeSingle();
          if(!ex)break; slug=base+'-'+n; n++;
          if(n>50){slug=base+'-'+Math.random().toString(36).slice(2,6);break;}
        }
        const {error}=await sb.from('shops').insert({owner_id:S.user.id,name:d.shop.name,slug:slug,
          activity:d.shop.activity,description:d.shop.description,department:d.shop.department,
          city:d.shop.city,phone:d.shop.phone,whatsapp:d.shop.phone,logo_url:d.shop.logoPath});
        if(error)throw error;
        /* Le rôle 'buyer' d'un acheteur qui ouvre une boutique
           doit suivre. Le verrou SQL n'autorise pas ce passage
           depuis le navigateur : on le signalera à l'admin. */
        await loadSession();
      }
      busy('#nx',false);
      this.step=99; this.dir=1; this.render();
    }catch(err){ busy('#nx',false); fail(err,'Inscription'); }
  },

  v_fin(){
    const buyer=this.role==='buyer';
    return `<div class="done">
      <div class="done__ring"><svg viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" cx="50" cy="50" r="42"/>
        <path class="tick" d="M32 51l12 12 24-26"/></svg></div>
      <h2 class="t-h1">${buyer?'Bienvenue sur VAlex':esc(this.d.shop.name)+' est créée'}</h2>
      <p class="t-sub" style="margin-top:8px;max-width:36ch;margin-left:auto;margin-right:auto">
        ${buyer?'Votre compte est prêt. Parcourez les rayons et remplissez votre panier.'
               :"Nous la vérifions (environ 24 h) avant de la rendre visible. Ajoutez vos produits dès maintenant : ils apparaîtront dès la validation."}</p>
      <div class="btn-row" style="justify-content:center;margin-top:20px">
        <button class="btn btn--mango" id="fin">${buyer?'Découvrir les articles':'Ajouter mon premier produit'}</button></div></div>`;},
  b_fin(){ $('#fin').onclick=()=>{const b=this.role==='buyer'; this.close(); go(b?(S.cart.length?'#/panier':'#/'):'#/produits/nouveau');}; }
};

/* ==========================================================
   13. DÉMARRAGE
   ========================================================== */
function bootFail(title,detail){
  $('#boot').style.backgroundImage='none';
  $('#boot').innerHTML='<div style="max-width:38ch">'+
    '<div class="empty__ic" style="background:var(--red-soft);color:var(--red)">'+ico('alert')+'</div>'+
    '<h2 class="t-h2" style="margin-top:12px">'+esc(title)+'</h2>'+
    '<p class="t-small" style="margin-top:10px;line-height:1.65">'+detail+'</p></div>';
}

/* Chrome refuse d'envoyer une requête vers un serveur externe
   depuis une page ouverte en file:// ou content:// (ouverture
   directe d'un téléchargement). Ce n'est réparable par aucun
   code : la page doit être servie depuis une vraie adresse
   http/https. On le détecte AVANT d'essayer Supabase, pour ne
   jamais montrer une erreur générique à la place de la vraie
   cause. */
function bootNeedsHosting(){
  $('#boot').style.backgroundImage='none';
  $('#boot').innerHTML=
    '<div style="max-width:400px;text-align:left">'+
    '<div class="empty__ic" style="background:var(--mango-soft);color:#B84A00;margin:0 auto 14px">'+ico('alert')+'</div>'+
    '<h2 class="t-h2" style="text-align:center">Ouvrez VAlex depuis son adresse</h2>'+
    '<p class="t-small" style="margin-top:10px;line-height:1.65;text-align:center">'+
    "Ce fichier a besoin de l'adresse du site pour joindre la base. Pour regarder sans internet, ouvrez le fichier « aperçu ».</p>"+
    '</div>';
}

async function start(){
  $('#boot').style.backgroundImage='none'; $('#boot').innerHTML='<div class="splash"><img src="'+IMG.icone+'" alt=""><span class="brand">VAlex<i>.</i></span></div>';
  const t0=Date.now();
  if(!window.supabase||!window.supabase.createClient){
    return bootFail('Bibliothèque non chargée',
      "Le fichier a besoin d'Internet au premier chargement pour récupérer la bibliothèque Supabase. Vérifiez votre connexion et rouvrez la page.");
  }
  if(location.protocol!=='http:'&&location.protocol!=='https:'){
    return bootNeedsHosting();
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

  const cats=await loadCategories();
  if(!cats){
    return bootFail('Connexion impossible',
      "Le site n'arrive pas à joindre le serveur. Vérifiez votre connexion internet, puis rouvrez la page.");
  }
  NET_OK=true;
  await loadSession();
  loadCart();

  /* Ce bandeau reste visible tant que Google et la vérification
     par email n'ont pas été configurés côté Supabase — une étape
     séparée de l'hébergement, qui suit une fois l'adresse connue. */
  if(!ADVANCED_AUTH_READY){
    $('#netbar').className='netbar';
    $('#netbar').innerHTML=ico('alert',2)+
      "<span>Google, la vérification email et le mot de passe oublié restent à configurer.</span>";
  }

  await new Promise(r=>setTimeout(r,Math.max(0,1100-(Date.now()-t0))));
  $('#boot').classList.add('hidden');
  $('#shell').classList.remove('hidden');
  $('#tabbar').classList.remove('hidden');

  sb.auth.onAuthStateChange(async (ev)=>{ await loadSession(); paintTabbar();
    if(ev==='PASSWORD_RECOVERY'){
      const ok=await ask({title:'Nouveau mot de passe',body:'<div class="field" style="margin:0"><input type="password" id="npw" placeholder="8 caractères minimum" autocomplete="new-password"></div>',ok:'Enregistrer',cancel:false});
      const v=($('#npw')||{}).value||'';
      if(ok&&v.length>=8){ const {error}=await sb.auth.updateUser({password:v}); if(error)fail(error,'Mot de passe'); else toast('Mot de passe changé.'); }
      else toast('Mot de passe trop court : recommencez avec « Mot de passe oublié ».');
    }});
  if(/[#&](access_token|error_description)=/.test(location.hash)){ history.replaceState(null,'',location.pathname+'#/compte'); }
  window.addEventListener('hashchange',()=>{ if($('#wiz').classList.contains('on'))wiz.close(); route(); });
  $('#scrim').onclick=closeNav;
  $('#wizQuit').onclick=()=>{wiz.close();route();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNav();$('#modal').classList.remove('on');}});

  if(!location.hash||location.hash==='#')location.hash='#/';
  route();
}
start();

})();
</script>
