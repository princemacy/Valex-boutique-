/* Google Identity Services : bouton officiel et jeton verifie par Supabase.
   Le flux OAuth reste le repli si le script Google ne se charge pas. */
const GOOGLE_CLIENT_ID='1074165667592-mc1u6j829s6sfg731vb8dnkl499m68bj.apps.googleusercontent.com';
const GIS_SRC='https://accounts.google.com/gsi/client?hl=fr';
let gisPromise=null;
function loadGis(){
  if(window.google&&google.accounts&&google.accounts.id)return Promise.resolve(true);
  if(gisPromise)return gisPromise;
  gisPromise=new Promise(resolve=>{
    let done=false;
    const finish=ok=>{ if(done)return; done=true; resolve(ok); };
    const sc=document.createElement('script');
    sc.src=GIS_SRC; sc.async=true; sc.defer=true;
    sc.onload=()=>finish(!!(window.google&&google.accounts&&google.accounts.id));
    sc.onerror=()=>finish(false);
    document.head.appendChild(sc);
    setTimeout(()=>finish(!!(window.google&&google.accounts&&google.accounts.id)),8000);
  });
  return gisPromise;
}
function b64url(bytes){let t='';bytes.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function gisNonce(){
  const raw=b64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
  const hex=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
  return {raw,hex};
}
async function gisSignIn(res,rawNonce){
  if(!res||!res.credential)return;
  busy('#gIn',true,'Connexion…');
  const {error}=await sb.auth.signInWithIdToken({provider:'google',token:res.credential,nonce:rawNonce});
  busy('#gIn',false);
  if(error)return fail(error,'Google');
  await loadSession(); go('#/compte');
  toast('Bonjour '+((S.profile&&S.profile.first_name)||'')+'.');
}
async function mountGis(box){
  let ready=false;
  try{ ready=await loadGis(); }catch(e){ ready=false; }
  if(!ready||!box||!box.isConnected)return;
  let nonce;
  try{ nonce=await gisNonce(); }catch(e){ return; }
  const {raw,hex}=nonce;
  try{
    google.accounts.id.initialize({
      client_id:GOOGLE_CLIENT_ID,
      nonce:hex,
      use_fedcm_for_prompt:false,
      callback:r=>{ gisSignIn(r,raw); }
    });
    google.accounts.id.renderButton(box,{type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:Math.min(336,Math.max(210,box.clientWidth||320))});
    box.hidden=false;
    const fb=$('#gIn'); if(fb)fb.hidden=true;
  }catch(e){ console.error('[VAlex] Google GIS indisponible'); }
}
async function googleIn(){
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error){ if(/provider|enabled|unsupported/i.test(error.message||''))return ask({title:'Google pas encore branché',body:'<p>La connexion Google sera active dès que VAlex aura relié son compte Google. En attendant, créez votre compte avec votre email : ça prend une minute.</p>',ok:'Compris',cancel:false});
    fail(error,'Google'); }
}

(function(){
const _h=builderHtml, _b=bindBuilder;
builderHtml=function(d,sizes){
  const sz=[...new Set(d.vars.map(v=>v.size).filter(Boolean))], co=[...new Set(d.vars.map(v=>v.color).filter(Boolean))];
  let x='';
  if(sz.length>1)x+='<div class="vbuild vprice"><strong>3. Prix par taille <span class="opt">— facultatif</span></strong><p class="t-small">Une grande taille coûte plus cher ? Mettez son prix ici : il s\'applique à toutes ses couleurs. Laissez vide pour garder le prix de base.</p>'+
    '<div class="pgridin">'+sz.map(s=>{const v=d.vars.find(y=>y.size===s); return '<label><span>'+esc(s)+'</span><input type="number" inputmode="decimal" min="0" step="25" data-psz="'+attr(s)+'" value="'+esc(v&&v.price||'')+'" placeholder="'+esc(d.price||'Prix')+'"></label>';}).join('')+'</div></div>';
  if(co.length>1)x+='<div class="vbuild vprice"><strong>'+(sz.length>1?'4':'3')+'. Une couleur coûte plus cher ? <span class="opt">— facultatif</span></strong>'+
    '<div class="pgridin">'+co.map(c=>'<label><span>'+esc(c)+'</span><input type="number" inputmode="decimal" step="25" data-pco="'+attr(c)+'" placeholder="+ 0"></label>').join('')+'</div><p class="t-small">Montant ajouté au prix de la taille, ex. + 250 pour le rouge.</p></div>';
  return _h(d,sizes)+x;
};
bindBuilder=function(d,paint,collect){
  _b(d,paint,collect);
  $$('[data-psz]').forEach(i=>i.addEventListener('change',()=>{ collect(); d.vars.filter(v=>v.size===i.dataset.psz).forEach(v=>{v.price=i.value||d.price||'';v._base=v.price;}); paint(); toast('Prix '+i.dataset.psz+' appliqué à toutes ses couleurs.'); }));
  $$('[data-pco]').forEach(i=>i.addEventListener('change',()=>{ collect(); const add=+i.value||0; let miss=0; d.vars.filter(v=>v.color===i.dataset.pco).forEach(v=>{const b=+(v._base||v.price||d.price||0); if(!b){miss++;return;} v._base=b; v.price=String(b+add);}); paint(); toast(miss?'Mettez d\'abord le prix de base (onglet L\'article) ou le prix par taille.':'Prix de la couleur '+i.dataset.pco+' mis à jour.'); }));
};
})();

/* Tout bouton WhatsApp du site devient « Écrire » dans la messagerie VAlex */
function chatify(){
  $$('#view a[href^="https://wa.me/"]').forEach(a=>{
    const txt=decodeURIComponent((a.getAttribute('href').split('?text=')[1]||'').replace(/\+/g,' '));
    a.removeAttribute('target'); a.dataset.draft=txt; a.setAttribute('href','#'); a.classList.remove('btn--wa'); a.classList.add('btn--chat');
    if(a.classList.contains('btn')){ const lbl=(a.textContent||'').trim(); a.innerHTML=ico('chat',2)+(/client/i.test(lbl)?'Écrire au client':/question/i.test(lbl)?'Question':'Écrire au vendeur'); }
    a.onclick=e=>{e.preventDefault(); startChat(txt);};
  });
}
new MutationObserver(()=>{clearTimeout(chatify._t); chatify._t=setTimeout(chatify,60);}).observe(document.getElementById('view'),{childList:true,subtree:true});
async function startChat(draft){
  if(!S.user){ if(await ask({title:'Écrire au vendeur',body:'<p>Créez un compte gratuit (une minute) pour écrire aux vendeurs. Vos conversations restent privées.</p>',ok:'Créer un compte',cancel:'Plus tard'}))go('#/compte'); return; }
  const h=location.hash.replace('#/',''), [seg,a]=h.split('/'); const id=String(a||'').split('?')[0];
  let shop=null, product=null, order=null;
  try{
    if(seg==='produit'){ const {data}=await sb.from('products').select('id,shop_id').eq('id',id).maybeSingle(); if(data){shop=data.shop_id;product=data.id;} }
    else if(seg==='boutique'){ const {data}=await sb.from('shops').select('id').eq('slug',id).maybeSingle(); if(data)shop=data.id; }
    else if(seg==='commande'){ const {data}=await sb.from('orders').select('id,shop_id').eq('id',id).maybeSingle(); if(data){shop=data.shop_id;order=data.id;} }
    else if(seg==='merci'){ const {data}=await sb.from('orders').select('id,shop_id').eq('buyer_id',S.user.id).order('created_at',{ascending:false}).limit(1); if(data&&data[0]){shop=data[0].shop_id;order=data[0].id;} }
    if(!shop)return toast('Ouvrez la page de la boutique pour lui écrire.');
    const {data:cid,error}=await sb.rpc('open_conversation',{p_shop:shop,p_product:product,p_order:order}); if(error)throw error;
    if(draft)sessionStorage.setItem('valex_draft_'+cid,draft);
    go('#/messages/'+cid);
  }catch(e){ fail(e,'Message'); }
}

async function notifModule(){
  for(let i=0;i<20;i++){
    if(window.VAlexNotifications)return window.VAlexNotifications;
    await new Promise(r=>setTimeout(r,50));
  }
  return window.VAlexNotifications||null;
}

    '<div class="composer"><textarea id="mIn" rows="1" maxlength="2000" placeholder="Votre message…"></textarea><button id="mGo" aria-label="Envoyer">'+ico('send',2.2)+'</button></div></div>');

async function callAI(task,payload){
  if(!S.user){ if(await ask({title:'Assistant VAlex',body:'<p>Créez un compte gratuit pour utiliser l\'assistant : ça protège le service contre les abus.</p>',ok:'Créer un compte',cancel:'Plus tard'}))go('#/compte'); return null; }
  try{
    const {data,error}=await sb.functions.invoke('valex-ai',{body:Object.assign({task},payload||{})});
    if(error){
      let m='L\'assistant est momentanément indisponible. Réessayez dans quelques minutes.';
      try{ const b=await error.context.json(); if(b&&b.code==='unavailable')m='L\'assistant est momentanément indisponible. Réessayez dans quelques minutes.'; else if(b&&b.error)m=b.error; }catch(e){}
      toast(m); return null;
    }
    if(data&&data.code==='unavailable'){ toast('L\'assistant est momentanément indisponible. Réessayez dans quelques minutes.'); return null; }
    if(data&&data.error){ toast(data.error); return null; }
    return data;
  }catch(e){ toast('L\'assistant est momentanément indisponible. Réessayez dans quelques minutes.'); return null; }
}
function fileToB64(file,max){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const r=Math.min(1,(max||512)/Math.max(im.width,im.height));
  const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.78).split(',')[1]); }; im.onerror=()=>res(null); im.src=fr.result; }; fr.onerror=()=>res(null); fr.readAsDataURL(file); }); }

function gpsFor(input){

    navigator.geolocation.getCurrentPosition(p=>{ const g=' · GPS '+p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5);
      input.value=input.value.replace(/ · GPS [-\d.,]+/,'')+g; b.disabled=false; b.lastChild.textContent='Position ajoutée ✓'; toast('Le livreur verra votre point exact sur la carte.'); },
      ()=>{ b.disabled=false; b.lastChild.textContent='Je suis ici (GPS)'; toast('Position refusée : activez la localisation du téléphone.'); },{enableHighAccuracy:true,timeout:15000}); };
}

/* ---------- 3. Recherche qui pardonne les fautes et les accents ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function lev(a,b){ if(Math.abs(a.length-b.length)>2)return 9; const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
const SYN={soulye:'chaussure',sapat:'sandale',rad:'vetement',wob:'robe',sak:'sac',telefon:'telephone',bijou:'bijou',cheve:'cheveux',pantalon:'pantalon',chemiz:'chemise',jip:'jupe',bebe:'bebe',jwet:'jouet',manje:'alimentation',kreyon:'crayon',liv:'livre',solè:'solaire',panno:'panneau'};
(function(){
const _f=fetchCatalog;
fetchCatalog=async function(opts){
  const l=await _f(opts);
  if(!opts||!opts.text||l.length)return l;
  const all=await _f(Object.assign({},opts,{text:null,limit:300}));
  const words=norm(opts.text).split(/[^a-z0-9]+/).filter(w=>w.length>1).map(w=>SYN[w]||w);
  if(!words.length)return [];
  const score=p=>{ const toks=norm(p.title+' '+(p.category_label||'')+' '+(p.rayon_label||'')+' '+(p.description||'')).split(/[^a-z0-9]+/);
    return words.reduce((s,w)=>s+(toks.some(t=>t.startsWith(w)||w.startsWith(t)&&t.length>3||(w.length>3&&lev(w,t)<=(w.length>6?2:1)))?1:0),0); };
  return all.map(p=>[p,score(p)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,opts.limit||60).map(x=>x[0]);
};
})();

/* ---------- 3. Image pour le statut WhatsApp ---------- */
function loadQR(){ return window.qrcode?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function statusImage(p,shop){
  const W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#111'; x.fillRect(0,0,W,H); x.fillStyle='#FF6A00'; x.fillRect(0,0,W,14);
  const src=prodImg(p.cover_path||(p.image_paths||[])[0]);
  if(src){ try{ const im=await loadImage(src); const s=Math.max(W/im.width,1150/im.height); const w=im.width*s,h=im.height*s; x.save(); x.beginPath(); if(x.roundRect)x.roundRect(60,120,W-120,1150,40); else x.rect(60,120,W-120,1150); x.clip(); x.drawImage(im,(W-w)/2,120+(1150-h)/2,w,h); x.restore(); }catch(e){} }
  x.fillStyle='#fff'; x.font='700 64px system-ui,sans-serif'; const t=String(p.title||''); const words=t.split(' '); let line='',y=1360;
  for(const w of words){ if(x.measureText(line+w).width>W-140){ x.fillText(line.trim(),70,y); y+=76; line=''; if(y>1440)break; } line+=w+' '; } if(y<=1440)x.fillText(line.trim(),70,y);
  x.fillStyle='#FF6A00'; x.font='800 104px system-ui,sans-serif'; x.fillText(gds(p.min_price_cents||p.base_price_cents),70,y+130);
  x.fillStyle='#ddd'; x.font='500 40px system-ui,sans-serif'; x.fillText((shop||p.shop_name||'')+' · VAlex Boutique',70,y+200);
  try{ await loadQR(); const q=qrcode(0,'M'); q.addData(prodLink(p.id)); q.make(); const n=q.getModuleCount(), sz=300, cs=sz/n, qx=W-70-sz, qy=H-70-sz;
    x.fillStyle='#fff'; x.fillRect(qx-20,qy-20,sz+40,sz+40); x.fillStyle='#111'; for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(qx+k*cs,qy+r*cs,Math.ceil(cs),Math.ceil(cs));
    x.fillStyle='#fff'; x.font='600 36px system-ui,sans-serif'; x.fillText('Scannez pour commander',70,H-120); }catch(e){ x.fillStyle='#fff'; x.font='600 36px system-ui,sans-serif'; x.fillText(prodLink(p.id).replace(/^https?:\/\//,''),70,H-120); }
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}
async function shareStatus(pid){
  toast('Préparation de l\'image…');
  const l=await fetchCatalog({limit:200}); const p=l.find(x=>x.id===pid); if(!p)return toast('Article introuvable.');
  const blob=await statusImage(p,p.shop_name); if(!blob)return toast('Image impossible.');
  const f=new File([blob],'valex-'+pid.slice(0,6)+'.jpg',{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],text:p.title+' — '+gds(p.min_price_cents||p.base_price_cents)+' sur VAlex : '+prodLink(p.id)}); return; }catch(e){ if(e&&e.name==='AbortError')return; } }

function shipFor(items,d,dep){
  d=d||{}; const def=items.some(v=>!v.products.ship_mode);

/* =========================================================
   PHASE 1j (1/11) — Localisation : produits près de chez moi
   La position reste sur le téléphone (localStorage). Si l'utilisateur est connecté,
   on garde seulement une position arrondie (≈100 m), la ville et le département dans
   son profil, que lui seul (et le QG) peut lire.
   ========================================================= */
let LOC=null; try{ LOC=JSON.parse(localStorage.getItem('valex_loc')||'null'); }catch(e){}
const lnorm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function matchDept(t){ const n=lnorm(t); return Object.keys(DEPTS).find(d=>n.includes(lnorm(d)))||null; }
function matchCity(dep,t){ const l=dep?DEPTS[dep]:[].concat(...Object.values(DEPTS)); const n=lnorm(t); return (l||[]).find(c=>n&&(lnorm(c)===n||n.includes(lnorm(c))||lnorm(c).includes(n)))||null; }
function saveLoc(l){
  LOC=l; try{ localStorage.setItem('valex_loc',JSON.stringify(l)); localStorage.setItem('valex_loc_asked','1'); }catch(e){}
  if(S.user&&sb){ sb.from('profiles').update({city:l.city||null,department:l.dep||undefined,geo_lat:l.lat!=null?Math.round(l.lat*1000)/1000:null,geo_lng:l.lng!=null?Math.round(l.lng*1000)/1000:null}).eq('id',S.user.id).then(()=>{},()=>{}); }
  paintLoc(); toast('Produits près de '+(l.city||l.dep)+' en premier.'); if(location.hash===''||location.hash==='#/')route();
}
async function geoLocate(){
  if(!navigator.geolocation)return toast('Votre téléphone ne donne pas sa position. Choisissez votre ville.');
  toast('Recherche de votre position…');
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude; let dep=null, city=null;
    try{ const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=fr&lat='+lat+'&lon='+lng);
      const d=await r.json(); const a=d.address||{}; dep=matchDept(a.state||a.region||''); city=matchCity(dep,a.city||a.town||a.village||a.municipality||a.county||'')||a.city||a.town||a.village||null; }catch(e){}
    if(!dep&&!city)return locPick('Nous n\'avons pas reconnu votre ville. Choisissez-la :');
    saveLoc({lat,lng,dep,city,src:'gps'});
  },()=>locPick('Position refusée. Vous pouvez choisir votre ville :'),{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
}

/* ---------------------------------------------------------
   p47 : parcours de remise (OTP, preuves, litiges)
   Ce bloc s'applique apres tous les wrappers precedents de
   V.orderDetail et V.orders. Si p47 est absente (colonne ou
   fonction manquante), il ne touche a rien : l'ancien flux
   reste exactement tel quel.
   --------------------------------------------------------- */
(function(){
async function ordersModule(){
  for(let i=0;i<20;i++){
    if(window.VAlexOrders)return window.VAlexOrders;
    await new Promise(r=>setTimeout(r,50));
  }
  return window.VAlexOrders||null;
}
function p47Badge(state){
  if(state==='confirmed_received'||state==='refunded')return 'badge--live';
  if(state==='cancelled'||state==='expired'||state==='dispute_open')return 'badge--out';
  if(state==='refund_pending'||state==='delivered_pending_confirmation')return 'badge--warn';
  return 'badge--soon';
}
function p47Date(iso){
  if(!iso)return '';
  const d=new Date(iso);
  return Number.isNaN(d.getTime())?'':d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function p47Error(err){
  const m=String((err&&err.message)||'');
  if(m.includes('code_reception_invalide')||/Code de confirmation invalide/i.test(m))return 'Entrez les 6 chiffres du code.';
  if(/expire/i.test(m))return 'Ce code a expiré. Demandez-en un nouveau.';
  if(/Trop de tentatives/i.test(m))return 'Trop de tentatives. Demandez un nouveau code.';
  if(/deja ete utilise|déjà été utilisé/i.test(m))return 'Ce code a déjà été utilisé.';
  if(/pas encore prete|ne peut pas etre confirmee/i.test(m))return 'La commande n\'est pas encore prête pour la confirmation.';
  if(/Transition impossible|reservee/i.test(m))return 'Cette action n\'est pas possible à cette étape.';
  if(/Motif de litige/i.test(m))return 'Écrivez un motif d\'au moins 3 caractères.';
  if(/litige ne peut pas/i.test(m))return 'Un litige ne peut pas être ouvert dans cet état.';
  if(/preuve|note est requise/i.test(m))return 'Ajoutez une note.';
  if(/function|schema cache|does not exist|PGRST202/i.test(m))return 'Le suivi avancé n\'est pas encore activé sur le serveur.';
  return m||'L\'action a échoué.';
}

const _od=V.orderDetail;
V.orderDetail=async function(id){
  await _od.apply(this,arguments);
  const oid=String(id||'').split('?')[0];
  const O=await ordersModule();
  if(!O)return;
  let st;
  try{ st=await O.loadState(oid); }catch(_){ return; }
  if(!st||!st.available||!st.order)return;          /* p47 absente : ancien flux intact */
  const o=st.order;
  const anchor=$('#view .phead');
  if(!anchor)return;

  /* p47 presente : retirer l'ancien code statique et le bouton "recu"
     qui contourneraient l'OTP. */
  const legacy=$('#view .codebox'); if(legacy)legacy.remove();
  const got=$('#gotIt'); if(got)got.remove();

  const steps=O.progressSteps(o.deliveryMode), idx=O.progressIndex(o.state,o.deliveryMode);
  const bar=idx>=0?'<div class="p47steps">'+steps.map(([k,l],i)=>
    '<span class="'+(i<=idx?'on':'')+'"><i></i>'+esc(l)+'</span>').join('')+'</div>':'';
  anchor.insertAdjacentHTML('afterend',
    '<div class="card enter p47card" id="p47card">'+
      '<div class="card__h">'+ico('pkg',2)+'<h3>Suivi de la remise</h3>'+
        '<span class="badge '+p47Badge(o.state)+'" style="margin-left:auto">'+esc(o.stateLabel)+'</span></div>'+
      '<div class="card__b">'+bar+
        '<div id="p47est" class="t-small"></div>'+
        '<div id="p47otp"></div><div id="p47dispute"></div><div id="p47proofs"></div>'+
      '</div></div>');

  /* Delais indicatifs : le serveur reste la source. */
  (async()=>{
    const est=$('#p47est'); if(!est)return;
    const rows=await Promise.all(['same','near','far'].map(s=>O.estimate(s).catch(()=>null)));
    const labels=rows.map(O.estimateLabel).filter(Boolean);
    if(est.isConnected)est.innerHTML=labels.map(l=>'<span class="p47est">'+esc(l)+'</span>').join('');
  })();

  /* OTP de reception. */
  const otp=$('#p47otp');
  const paintOtp=()=>{
    if(o.state==='confirmed_received'){
      otp.innerHTML='<div class="p47note ok">'+ico('check',2)+'<span>Réception confirmée. Cette confirmation n\'a prélevé aucune commission supplémentaire.</span></div>';
      return;
    }
    if(!o.canIssueReceipt){ otp.innerHTML=''; return; }
    otp.innerHTML='<div class="p47note">'+ico('shield',2)+'<span>Le code de réception protège votre colis. Ne le donnez qu\'au moment où l\'article est dans vos mains, jamais avant.</span></div>'+
      '<button class="btn btn--pri" id="p47issue">Obtenir mon code de réception</button>'+
      '<div id="p47codeBox"></div>';
    $('#p47issue').onclick=async()=>{
      busy('#p47issue',true,'Envoi…');
      try{
        const code=await O.issueReceiptCode(o.id);
        const box=$('#p47codeBox'); if(!box)return;
        box.innerHTML='<div class="codebox p47code" style="margin-top:12px"><span>Votre code de réception</span><b>'+esc(code)+'</b>'+
            '<p>Il expire dans 30 minutes. Ne le donnez qu\'à la remise du colis.</p></div>'+
          '<div class="field" style="margin-top:10px"><label for="p47in">Saisir le code une fois l\'article reçu</label>'+
            '<input type="text" id="p47in" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:6px;text-align:center"></div>'+
          '<button class="btn btn--pri btn--wide" id="p47confirm">Confirmer la réception</button>'+
          '<p class="t-small" id="p47msg" style="margin-top:8px"></p>';
        const input=$('#p47in');
        input.addEventListener('input',()=>{input.value=O.normalizeCode(input.value);});
        $('#p47confirm').onclick=async()=>{
          const msg=$('#p47msg');
          busy('#p47confirm',true,'Vérification…');
          try{
            const res=await O.confirmReceipt(o.id,input.value);
            busy('#p47confirm',false);
            if(res.ok){ toast('Réception confirmée.'); V.orderDetail(id); return; }
            if(msg){ msg.className='t-small '+(res.incorrect?'p47bad':'p47bad'); msg.textContent=res.message; }
            /* 'incorrect' n'est pas une erreur technique : le compteur
               d'essais est conserve cote serveur. On ne recharge pas la
               page et on laisse le champ pret pour un nouvel essai. */
            input.value=''; input.focus();
          }catch(err){
            busy('#p47confirm',false);
            if(msg){ msg.className='t-small p47bad'; msg.textContent=p47Error(err); }
            else toast(p47Error(err));
          }
        };
        busy('#p47issue',false);
        $('#p47issue').textContent='Obtenir un nouveau code';
      }catch(err){ busy('#p47issue',false); toast(p47Error(err)); }
    };
  };
  paintOtp();

  /* Litige : jamais de remboursement automatique. */
  const disp=$('#p47dispute');
  if(o.canDispute){
    disp.innerHTML='<button class="btn btn--danger btn--sm" id="p47disp" style="margin-top:10px">'+ico('flag')+'Signaler un problème</button><div id="p47dispBox"></div>';
    $('#p47disp').onclick=async()=>{
      const ok=await ask({title:'Signaler un problème',
        body:'<div class="field"><label for="p47r">Motif</label><select id="p47r">'+
          ['Article non reçu','Article différent de la photo','Article abîmé','Paiement non reconnu','Vendeur injoignable','Autre']
            .map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
          '<div class="field" style="margin-bottom:0"><label for="p47d">Précisions <span class="opt">— facultatif</span></label>'+
          '<textarea id="p47d" maxlength="2000" placeholder="Décrivez la situation…"></textarea></div>'+
          '<p class="t-small" style="margin-top:10px">Le vendeur et l\'équipe VAlex verront ce signalement. Aucun remboursement n\'est automatique.</p>',
        ok:'Envoyer',danger:true});
      if(!ok)return;
      try{
        await O.openDispute(o.id,{reason:($('#p47r')||{}).value,description:($('#p47d')||{}).value});
        toast('Litige ouvert. L\'équipe VAlex va examiner le dossier.'); V.orderDetail(id);
      }catch(err){ toast(p47Error(err)); }
    };
  }
  (async()=>{
    const d=await O.loadDispute(o.id).catch(()=>null);
    if(!d||!disp||!disp.isConnected)return;
    disp.insertAdjacentHTML('beforeend','<div class="p47note warn" style="margin-top:10px">'+ico('alert',2)+
      '<span><b>Litige '+esc(d.statusLabel.toLowerCase())+'.</b> '+esc(d.reason)+
      (d.decisionNote?'<br>'+esc(d.decisionNote):'')+'</span></div>');
  })();

  /* Preuves : note seulement, aucun fichier invente. */
  const pf=$('#p47proofs');
  (async()=>{
    const list=await O.loadProofs(o.id).catch(()=>[]);
    if(!pf||!pf.isConnected)return;
    if(!list.length&&!o.canDispute)return;
    pf.innerHTML=(list.length?'<div class="p47proofs"><strong class="t-small">Preuves et précisions</strong>'+
      list.map(x=>'<div class="p47proof"><span>'+esc(x.kindLabel)+' · '+esc(p47Date(x.createdAt))+'</span>'+
        (x.note?'<span class="t-small">'+esc(x.note)+'</span>':'')+'</div>').join('')+'</div>':'')+
      '<button class="btn btn--ghost btn--sm" id="p47proofAdd">Ajouter une précision</button>';
    $('#p47proofAdd').onclick=async()=>{
      const ok=await ask({title:'Ajouter une précision',
        body:'<div class="field" style="margin-bottom:0"><label for="p47pn">Votre précision</label>'+
          '<textarea id="p47pn" maxlength="2000" placeholder="Ce que vous constatez, sans rien inventer…"></textarea></div>',
        ok:'Enregistrer'});
      if(!ok)return;
      const note=($('#p47pn')||{}).value||'';
      try{
        await O.addProof(o.id,{kind:'buyer_claim',note});
        toast('Précision enregistrée.'); V.orderDetail(id);
      }catch(err){ toast(p47Error(err)); }
    };
  })();
};

}

    const box=$('#finledger'); if(!box)return;

    try{ list=await F.loadLedger(); }catch(_){ list=[]; }
    if(!list.length){
      box.innerHTML='<div class="p47note">'+ico('alert',2)+'<span>Aucune écriture pour l\'instant. Un grand livre vide est un état honnête : aucun mouvement n\'est inventé.</span></div>';
      return;
    }
    box.innerHTML='<div class="finledger">'+list.map(t=>{
      const noLines=!t.lines.length;
      return '<div class="fintx">'+
        '<div class="fintx__h"><b>'+esc(t.kindLabel)+'</b>'+
        '<span class="badge '+(t.balanced?'badge--live':noLines?'badge--warn':'badge--out')+'">'+(t.balanced?'Équilibré':noLines?'Lignes non lisibles':'Déséquilibré')+'</span>'+
        '<span class="fintx__v">'+esc(finMoney(t.amountCents))+'</span></div>'+
        '<div class="fintx__m">'+esc(finWhen(t.createdAt))+(t.orderId?' · commande '+esc(t.orderId.slice(0,8)):'')+(t.memo?' · '+esc(t.memo):'')+'</div>'+
        (noLines?'<div class="fintx__m">Aucune ligne lisible pour cette écriture.</div>':
          '<div class="finlines">'+t.lines.map(l=>
            '<div class="finline"><span>'+esc(l.accountLabel)+'</span><span class="finline__b">'+esc(l.bucketLabel)+'</span>'+
            '<span class="finline__a '+(l.amountCents>0?'in':'out')+'">'+esc(finSigned(l.amountCents))+'</span></div>').join('')+'</div>')+
        (!t.balanced&&!noLines?'<div class="finwarn">Somme des lignes : '+esc(finSigned(t.totalCents))+' — une transaction valide doit sommer à zéro.</div>':'')+
      '</div>';
    }).join('')+'</div>';
  };
  const rf=$('#finreload'); if(rf)rf.onclick=()=>{ rf.disabled=true; paintLedger().finally(()=>{ rf.disabled=false; }); };
  await paintLedger();
};
})();

/* ---------------------------------------------------------
   p51 : remboursements - console proprietaire avec double verification.
   Chaque decision est humaine. L'execution demande une confirmation
   explicite et deplacet de l'argent reel. Aucune action automatique.
   --------------------------------------------------------- */
(function(){
async function refundsModule(){
  for(let i=0;i<20;i++){
    if(window.VAlexRefunds)return window.VAlexRefunds;
    await new Promise(r=>setTimeout(r,50));
  }
  return window.VAlexRefunds||null;
}
function rfWhen(iso){ return iso?fdt(iso):'—'; }
function rfOrder(id){ return id?'commande '+id.slice(0,8):'commande inconnue'; }
function rfMoney(c){ try{ return window.VAlexRefunds.formatCents(c); }catch(_){ return String(c)+' GDS'; } }
V.refunds=async function(){
  topbar('back',{title:'Remboursements'});
  if(!S.user){ go('#/compte'); return; }
  this.set('<div class="phead enter"><div class="phead__t"><h1>Remboursements</h1>'+
    '<p>Décisions humaines, double vérification et exécution explicite. Aucune action automatique.</p></div></div>'+
    '<div id="rfbody">'+skeleton(2)+'</div>');
  const body=$('#rfbody'); if(!body)return;
  const R=await refundsModule();
  if(!R){
    body.innerHTML='<div class="card enter"><div class="card__b"><div class="p47note bad">'+ico('alert',2)+
      '<span>Le module de remboursements n\'est pas chargé. Vérifiez votre connexion puis rechargez la page.</span></div></div></div>';
    return;
  }
  let st;
  try{ st=await R.loadAccess(); }
  catch(err){
    body.innerHTML='<div class="card enter"><div class="card__b"><div class="p47note bad">'+ico('alert',2)+
      '<span>'+esc((err&&err.message)||'Lecture impossible.')+'</span></div></div></div>';
    return;
  }
  if(!st.access.ok){
    const mfa=st.access.reason==='mfa_required';
    body.innerHTML='<div class="card enter"><div class="card__h">'+ico('lock',2)+'<h3>'+esc(st.access.title)+'</h3></div>'+
      '<div class="card__b"><div class="p47note '+(mfa?'warn':'bad')+'">'+ico('shield',2)+
      '<span>'+esc(st.access.message)+'</span></div>'+
      (mfa?'<a class="btn btn--pri btn--sm" href="#/qg">Activer la double vérification</a>':
        '<a class="btn btn--ghost btn--sm" href="#/compte">Retour au compte</a>')+'</div></div>';
    return;
  }

  let refunds=[];
  try{ refunds=await R.loadRefunds(); }catch(_){ refunds=[]; }
  let intents=[];
  try{ intents=await R.loadPaidIntents(); }catch(_){ intents=[]; }
  const sm=R.sumRefunds(refunds);

  body.innerHTML='';
  body.insertAdjacentHTML('beforeend',
    '<div class="card enter"><div class="card__h">'+ico('shield',2)+'<h3>Règles de sécurité</h3>'+
      '<span class="badge badge--live" style="margin-left:auto">Propriétaire · aal2</span></div>'+
      '<div class="card__b"><div class="p47note warn">'+ico('lock',2)+
      '<span>Exécuter un remboursement déplace de l\'argent réel. Le serveur exige le rôle propriétaire et la double vérification. La page ne décide jamais seule.</span></div>'+
      '<div class="rfsum">'+
        '<div class="fincard"><span class="fincard__l">À décider</span><strong class="fincard__v">'+esc(String(sm.toDecide))+'</strong><span class="fincard__n">Demandes en attente</span></div>'+
        '<div class="fincard"><span class="fincard__l">Approuvés</span><strong class="fincard__v">'+esc(String(sm.approved))+'</strong><span class="fincard__n">Prêts à exécuter</span></div>'+
        '<div class="fincard"><span class="fincard__l">Terminés</span><strong class="fincard__v">'+esc(String(sm.completed))+'</strong><span class="fincard__n">'+esc(rfMoney(sm.completedCents))+' remboursés</span></div>'+
        '<div class="fincard"><span class="fincard__l">Total</span><strong class="fincard__v">'+esc(String(sm.count))+'</strong><span class="fincard__n">Demandes visibles</span></div>'+
      '</div></div></div>');

  const listCard=document.createElement('div');
  listCard.className='card enter';
  body.appendChild(listCard);
  listCard.innerHTML='<div class="card__h">'+ico('ret',2)+'<h3>Demandes</h3><span class="badge badge--soon" style="margin-left:auto">'+esc(String(refunds.length))+'</span></div>'+
    '<div class="card__b">'+(refunds.length?'<div class="rflist">'+refunds.map(r=>{
      const tone=r.status==='completed'?'badge--live':r.status==='approved'?'badge--warn':r.status==='rejected'||r.status==='failed'?'badge--out':'badge--soon';
      const actions=(r.canDecide?
          '<div class="rfacts"><button class="btn btn--pri btn--sm" data-rfdecide="approve" data-rfid="'+attr(r.id)+'">Approuver</button>'+
          '<button class="btn btn--ghost btn--sm" data-rfdecide="reject" data-rfid="'+attr(r.id)+'">Refuser</button></div>':
        r.canComplete?
          '<div class="rfacts"><button class="btn btn--pri btn--sm" data-rfcomplete="'+attr(r.id)+'">'+ico('lock')+'Exécuter le remboursement</button></div>':
        r.status==='approved'?
          '<div class="p47note bad">'+ico('alert',2)+'<span>Exécution indisponible : le paiement ou le montant ne permet pas un remboursement intégral automatique. Arbitrage manuel requis.</span></div>':'');
      return '<div class="rfitem">'+
        '<div class="rfitem__h"><b>'+esc(rfMoney(r.amountCents))+'</b>'+
        '<span class="badge '+tone+'" style="margin-left:auto">'+esc(r.statusLabel)+'</span></div>'+
        '<div class="rfitem__m">'+esc(rfOrder(r.orderId))+(r.intent?' · '+esc(r.intent.providerLabel):'')+' · demandé le '+esc(rfWhen(r.requestedAt))+'</div>'+
        (r.reason?'<div class="rfitem__r">'+esc(r.reason)+'</div>':'')+
        '<div class="rfitem__m">Frais retenus : '+esc(rfMoney(r.feeCents))+' · net client : '+esc(rfMoney(r.netCents))+
          (r.completedAt?' · terminé le '+esc(rfWhen(r.completedAt)):'')+'</div>'+
        actions+
      '</div>';
    }).join('')+'</div>':
      '<div class="p47note">'+ico('alert',2)+'<span>Aucune demande de remboursement. Aucun remboursement n\'est inventé.</span></div>')+'</div>';

  const busyIntents=new Set(refunds.filter(r=>['requested','under_review','approved','processing','completed'].includes(r.status)).map(r=>r.intentId));
  const available=intents.filter(i=>!busyIntents.has(i.id));
  const reqCard=document.createElement('div');
  reqCard.className='card enter';
  body.appendChild(reqCard);
  if(!available.length){
    reqCard.innerHTML='<div class="card__h">'+ico('plus',2)+'<h3>Créer une demande</h3></div>'+
      '<div class="card__b"><div class="p47note">'+ico('alert',2)+'<span>Aucun paiement encaissé sans remboursement en cours. Une demande ne peut être créée que sur un paiement réellement encaissé.</span></div></div>';
  } else {
    reqCard.innerHTML='<div class="card__h">'+ico('plus',2)+'<h3>Créer une demande</h3></div>'+
      '<div class="card__b">'+
        '<div class="field"><label for="rfintent">Paiement encaissé</label><select id="rfintent">'+
          available.map(i=>'<option value="'+attr(i.id)+'" data-amount="'+attr(i.amountCents)+'">'+esc(rfOrder(i.orderId))+' · '+esc(i.providerLabel)+' · '+esc(rfMoney(i.amountCents))+'</option>').join('')+
        '</select></div>'+
        '<div id="rfquote" class="rfquote"><div class="sk sk-line" style="width:60%"></div></div>'+
        '<div class="field"><label for="rfreason">Motif du remboursement <span class="req">*</span></label><textarea id="rfreason" rows="3" maxlength="500" placeholder="Article non reçu, article non conforme…"></textarea><div class="hint">5 caractères minimum. Ce motif est conservé et journalisé.</div></div>'+
        '<button class="btn btn--pri btn--wide" id="rfreq" disabled>Créer la demande</button>'+
        '<p class="t-small">Aucun argent ne bouge à cette étape. La demande devra ensuite être approuvée, puis exécutée séparément.</p>'+
      '</div>';
    let currentIntent=null, currentQuote=null;
    const sel=$('#rfintent'), quoteBox=$('#rfquote'), reqBtn=$('#rfreq');
    const resetQuote=async()=>{
      const id=sel.value, found=available.find(i=>i.id===id);
      currentIntent=found||null; currentQuote=null; reqBtn.disabled=true;
      if(!found){ quoteBox.innerHTML=''; return; }
      quoteBox.innerHTML='<div class="sk sk-line" style="width:60%"></div>';
      try{
        const q=await R.quote(found.id,found.amountCents);
        if(sel.value!==id)return;
        currentQuote=q;
        quoteBox.innerHTML='<div class="rfquote__row"><span>Montant intégral</span><b>'+esc(rfMoney(q.amountCents))+'</b></div>'+
          '<div class="rfquote__row"><span>Frais retenus par le serveur</span><b>'+esc(rfMoney(q.feeCents))+'</b></div>'+
          '<div class="rfquote__row"><span>Net rendu au client</span><b>'+esc(rfMoney(q.netCents))+'</b></div>'+
          '<div class="rfquote__row"><span>Déjà remboursé</span><b>'+esc(rfMoney(q.alreadyRefundedCents))+'</b></div>'+
          '<p class="t-small">Remboursement intégral uniquement. Un remboursement partiel exige un arbitrage manuel hors de cette page.</p>';
        reqBtn.disabled=false;
      }catch(err){
        if(sel.value!==id)return;
        quoteBox.innerHTML='<div class="p47note bad">'+ico('alert',2)+'<span>'+esc(R.errorText(err))+'</span></div>';
        reqBtn.disabled=true;
      }
    };
    sel.onchange=resetQuote;
    resetQuote();
    reqBtn.onclick=async()=>{
      const guard=R.validateRequest({intent:currentIntent,quote:currentQuote,reason:($('#rfreason')||{}).value||''});
      if(!guard.ok){ toast(guard.error); return; }
      const ok=await ask({title:'Créer la demande de remboursement ?',
        body:'<p>'+esc(rfMoney(guard.amountCents))+' · '+esc(rfOrder(currentIntent.orderId))+'</p>'+
          '<p class="t-small">Aucun argent ne bouge maintenant. La demande sera ensuite approuvée ou refusée, puis exécutée séparément.</p>',
        ok:'Créer la demande'});
      if(!ok)return;
      busy(reqBtn,true,'Création…');
      try{
        await R.requestRefund({intentId:currentIntent.id,amountCents:guard.amountCents,reason:guard.reason,key:R.newIdempotencyKey()});
        toast('Demande créée. Elle doit être approuvée.');
        V.refunds();
      }catch(err){ busy(reqBtn,false); toast(R.errorText(err)); }
    };
  }

  $$('[data-rfdecide]').forEach(b=>b.onclick=async()=>{
    const r=refunds.find(x=>x.id===b.dataset.rfid); if(!r)return;
    const decision=b.dataset.rfdecide;
    const approve=decision==='approve';
    const ok=await ask({title:approve?'Approuver ce remboursement ?':'Refuser ce remboursement ?',
      body:'<p>'+esc(rfMoney(r.amountCents))+' · '+esc(rfOrder(r.orderId))+'</p>'+
        '<div class="field"><label for="rfdnote">Justification <span class="req">*</span></label><textarea id="rfdnote" rows="3" maxlength="500" placeholder="Décision écrite, conservée au journal"></textarea><div class="hint">10 caractères minimum.</div></div>'+
        (approve?'<p class="t-small">Approuver ne déplace pas encore l\'argent. L\'exécution est une étape séparée.</p>':''),
      ok:approve?'Approuver':'Refuser',danger:!approve});
    if(!ok)return;
    const guard=R.validateDecision({refund:r,decision,note:($('#rfdnote')||{}).value||''});
    if(!guard.ok){ toast(guard.error); return; }
    busy(b,true,'…');
    try{
      await R.decideRefund({refundId:r.id,decision,note:guard.note});
      toast(approve?'Remboursement approuvé.':'Remboursement refusé.');
      V.refunds();
    }catch(err){ busy(b,false); toast(R.errorText(err)); }
  });

  $$('[data-rfcomplete]').forEach(b=>b.onclick=async()=>{
    const r=refunds.find(x=>x.id===b.dataset.rfcomplete); if(!r)return;
    const ok=await ask({title:'Exécuter le remboursement ?',
      body:'<div class="p47note bad">'+ico('alert',2)+'<span>Cette action déplace de l\'argent réel et ne peut pas être annulée depuis cette page.</span></div>'+
        '<p>'+esc(rfMoney(r.amountCents))+' seront rendus au client. La commande passera à « remboursée ».</p>'+
        '<div class="field"><label for="rfpref">Référence prestataire <span class="opt">— facultatif</span></label><input type="text" id="rfpref" maxlength="80" placeholder="Référence du remboursement"></div>'+
        '<label class="rfcheck"><input type="checkbox" id="rfvalex"> Restituer la commission VAlex initiale</label>'+

/* ---------------------------------------------------------
   p50 : moderation des medias - staff avec double verification.
   Chaque decision est humaine. Refuser retire le media et rend son quota.
   Le navigateur ne supprime aucun fichier.
   --------------------------------------------------------- */
(function(){
async function moderationModule(){
  for(let i=0;i<20;i++){
    if(window.VAlexModeration)return window.VAlexModeration;
    await new Promise(r=>setTimeout(r,50));
  }
  return window.VAlexModeration||null;
}
const MOD_ROLE_LABELS={owner:'Propriétaire',admin:'Administrateur',moderator:'Modérateur'};
function modWhen(iso){ return iso?fdt(iso):'—'; }
function modTone(status){
  if(status==='approved')return 'badge--live';
  if(status==='rejected'||status==='deleted')return 'badge--out';
  if(status==='quarantined')return 'badge--warn';
  return 'badge--soon';
}
function modMedia(m,canPreview){
  const shop=m.shopName||(m.shopId?'boutique '+m.shopId.slice(0,8):'boutique inconnue');
  const thumb=canPreview?'<div class="modthumb"><img src="'+attr(imgUrl(m.bucket,m.path))+'" alt="" loading="lazy"></div>':'';
  return '<div class="moditem">'+thumb+
    '<div class="moditem__b"><div class="moditem__h"><b>'+esc(m.bucketLabel)+'</b>'+
      '<span class="badge '+modTone(m.status)+'" style="margin-left:auto">'+esc(m.statusLabel)+'</span></div>'+
      '<div class="moditem__m">'+esc(shop)+' · '+esc(m.kindLabel)+' · '+esc(m.sizeLabel)+' · '+esc(modWhen(m.createdAt))+'</div>'+
      '<div class="moditem__p" title="'+attr(m.path)+'">'+esc(m.path)+'</div>'+
      (m.note?'<div class="moditem__n">Motif : '+esc(m.note)+'</div>':'')+
    '</div></div>';
}
V.moderation=async function(){
  topbar('back',{title:'Modération des médias'});
  if(!S.user){ go('#/compte'); return; }
  this.set('<div class="phead enter"><div class="phead__t"><h1>Modération des médias</h1>'+
    '<p>Examiner les photos, vidéos et documents envoyés. Décision humaine, double vérification.</p></div></div>'+
    '<div id="modbody">'+skeleton(2)+'</div>');
  const body=$('#modbody'); if(!body)return;
  const M=await moderationModule();
  if(!M){
    body.innerHTML='<div class="card enter"><div class="card__b"><div class="p47note bad">'+ico('alert',2)+
      '<span>Le module de modération n\'est pas chargé. Vérifiez votre connexion puis rechargez la page.</span></div></div></div>';
    return;
  }
  let st;
  try{ st=await M.loadAccess(); }
  catch(err){
    body.innerHTML='<div class="card enter"><div class="card__b"><div class="p47note bad">'+ico('alert',2)+
      '<span>'+esc((err&&err.message)||'Lecture impossible.')+'</span></div></div></div>';
    return;
  }
  if(!st.access.ok){
    const mfa=st.access.reason==='mfa_required';
    body.innerHTML='<div class="card enter"><div class="card__h">'+ico('lock',2)+'<h3>'+esc(st.access.title)+'</h3></div>'+
      '<div class="card__b"><div class="p47note '+(mfa?'warn':'bad')+'">'+ico('shield',2)+
      '<span>'+esc(st.access.message)+'</span></div>'+
      (mfa?'<a class="btn btn--pri btn--sm" href="#/qg">Activer la double vérification</a>':
        '<a class="btn btn--ghost btn--sm" href="#/compte">Retour au compte</a>')+'</div></div>';
    return;
  }

  let queue=[], reviewed=[];
  try{ queue=await M.loadQueue(); }catch(_){ queue=[]; }
  try{ reviewed=await M.loadReviewed(); }catch(_){ reviewed=[]; }
  const sm=M.summarizeMedia(queue);

  body.innerHTML='';
  body.insertAdjacentHTML('beforeend',
    '<div class="card enter"><div class="card__h">'+ico('shield',2)+'<h3>File de modération</h3>'+
      '<span class="badge badge--soon" style="margin-left:auto">'+esc(MOD_ROLE_LABELS[st.role]||'Équipe')+' · aal2</span></div>'+
      '<div class="card__b"><div class="p47note">'+ico('check',2)+
      '<span>Approuver rend le média visible. Mettre en quarantaine le masque sans le retirer. Refuser le retire et rend son quota. Aucune décision n\'est automatique.</span></div>'+
      '<div class="finlist" style="flex-direction:row;flex-wrap:wrap;gap:10px;margin-top:10px">'+
        '<div class="fincard"><span class="fincard__l">En attente</span><strong class="fincard__v">'+esc(String(sm.pending))+'</strong><span class="fincard__n">À examiner</span></div>'+
        '<div class="fincard"><span class="fincard__l">Quarantaine</span><strong class="fincard__v">'+esc(String(sm.quarantined))+'</strong><span class="fincard__n">Masqués</span></div>'+
        '<div class="fincard"><span class="fincard__l">Volume de la file</span><strong class="fincard__v">'+esc(M.formatBytes(sm.bytes))+'</strong><span class="fincard__n">'+esc(String(sm.count))+' média(s)</span></div>'+
      '</div></div></div>');

  const queueCard=document.createElement('div');
  queueCard.className='card enter';
  body.appendChild(queueCard);
  if(!queue.length){
    queueCard.innerHTML='<div class="card__h">'+ico('image',2)+'<h3>À examiner</h3></div>'+
      '<div class="card__b"><div class="p47note">'+ico('alert',2)+
      '<span>Aucun média en attente. Rien n\'est inventé.</span></div></div>';
  } else {
    queueCard.innerHTML='<div class="card__h">'+ico('image',2)+'<h3>À examiner</h3><span class="badge badge--soon" style="margin-left:auto">'+esc(String(queue.length))+'</span></div>'+
      '<div class="card__b"><div class="modlist">'+queue.map(m=>{
        const actions='<div class="modacts">'+
          '<button class="btn btn--pri btn--sm" data-modok="'+attr(m.id)+'">Approuver</button>'+
          '<button class="btn btn--ghost btn--sm" data-modq="'+attr(m.id)+'">Quarantaine</button>'+
          '<button class="btn btn--danger btn--sm" data-modno="'+attr(m.id)+'">Refuser</button>'+
        '</div>';
        return '<div class="modcard">'+modMedia(m,M.canPreview&&M.canPreview(m))+actions+'</div>';
      }).join('')+'</div></div>';

    const find=id=>queue.find(x=>x.id===id);
    const run=async(btn,media,status)=>{
      const isReject=status==='rejected';
      const label=M.reviewActionLabel(status);
      const ok=await ask({title:label+' ?',
        body:'<p>'+esc(media.bucketLabel)+' · '+esc(media.shopName||'boutique')+'</p>'+
          (isReject?'<div class="p47note bad">'+ico('alert',2)+'<span>Le média sera retiré et son quota rendu. Le fichier reste tracé côté serveur.</span></div>':'')+
          '<div class="field"><label for="modnote">Motif '+(isReject?'<span class="req">*</span>':'<span class="opt">— facultatif</span>')+'</label>'+
          '<textarea id="modnote" rows="3" maxlength="300" placeholder="'+(isReject?'Photo floue, article interdit…':'Note interne facultative')+'"></textarea>'+
          (isReject?'<div class="hint">5 caractères minimum.</div>':'')+'</div>',
        ok:label,danger:isReject});
      if(!ok)return;
      const guard=M.validateReview({media,status,note:($('#modnote')||{}).value||''});
      if(!guard.ok){ toast(guard.error); return; }
      busy(btn,true,'…');
      try{
        await M.reviewMedia({assetId:media.id,status:guard.status,note:guard.note});
        toast(status==='approved'?'Média approuvé.':status==='quarantined'?'Média mis en quarantaine.':'Média refusé et retiré.');
        V.moderation();
      }catch(err){ busy(btn,false); toast(M.errorText(err)); }
    };
    $$('[data-modok]').forEach(b=>b.onclick=()=>{ const m=find(b.dataset.modok); if(m)run(b,m,'approved'); });
    $$('[data-modq]').forEach(b=>b.onclick=()=>{ const m=find(b.dataset.modq); if(m)run(b,m,'quarantined'); });
    $$('[data-modno]').forEach(b=>b.onclick=()=>{ const m=find(b.dataset.modno); if(m)run(b,m,'rejected'); });
  }

  const doneCard=document.createElement('div');
  doneCard.className='card enter';
  body.appendChild(doneCard);
  doneCard.innerHTML='<div class="card__h">'+ico('doc',2)+'<h3>Derniers traitements</h3><span class="badge badge--soon" style="margin-left:auto">'+esc(String(reviewed.length))+'</span></div>'+
    '<div class="card__b">'+(reviewed.length?'<div class="modlist">'+reviewed.map(m=>modMedia(m,false)).join('')+'</div>':
      '<div class="p47note">'+ico('alert',2)+'<span>Aucun média traité pour l\'instant.</span></div>')+'</div>';
};
})();

/* ---------------------------------------------------------

(function(){
async function supportStaffModule(){

  return 'badge--soon';
}

      '<div class="card__b"><div class="p47note '+(mfa?'warn':'bad')+'">'+ico('shield',2)+

      (mfa?'<a class="btn btn--pri btn--sm" href="#/qg">Activer la double vérification</a>':
        '<a class="btn btn--ghost btn--sm" href="#/compte">Retour au compte</a>')+'</div></div>';
    return;
  }

  let filter='open', tickets=[], agents=[], selected=null, thread=null;
  try{ agents=await X.loadAgents(); }catch(_){ agents=[]; }
  const canAssign=X.canAssignRole(st.role);

  async function reload(){
    try{ tickets=await X.loadTickets({status:'all',limit:100}); }catch(_){ tickets=[]; }
    if(selected){
      try{ thread=await X.loadThread(selected,st.meId); }
      catch(_){ selected=null; thread=null; }
    }
    paint();
  }

  function ticketCard(t){
    return '<div class="sstitem">'+
      '<div class="sstitem__h"><b>'+esc(t.subject)+'</b>'+
        '<span class="badge '+sstTone(t.status)+'" style="margin-left:auto">'+esc(t.statusLabel)+'</span></div>'+

    '</div>';

      '</div></div>';

    const sm=X.summarizeTickets(tickets,st.meId);
    const list=X.filterTickets(tickets,filter);
    const chips=SST_FILTERS.map(([key,label])=>
      '<button class="btn '+(filter===key?'btn--pri':'btn--ghost')+' btn--sm" data-stfilter="'+attr(key)+'">'+esc(label)+'</button>').join('');

    const chip=e.target.closest('[data-stfilter]');
    if(chip){ filter=chip.dataset.stfilter; paint(); return; }
    const open=e.target.closest('[data-stopen]');
    if(open){ selected=open.dataset.stopen; await reload(); return; }
    const close=e.target.closest('[data-stclose]');
    if(close){ selected=null; thread=null; paint(); return; }
    const assign=e.target.closest('[data-stassign]');
    if(assign){ await doAssign(); return; }
    const status=e.target.closest('[data-ststatus]');
    if(status){ await doStatus(status.dataset.ststatus); return; }
    const reply=e.target.closest('[data-streply]');
    if(reply){ await doReply(); return; }
  };

  async function doAssign(){
    if(!thread)return;
    const sel=$('#stagent');
    const agentId=sel?sel.value:'';
    const guard=X.validateAssign({ticket:thread.ticket,agentId,role:st.role,meId:st.meId});
    if(!guard.ok){ toast(guard.error); return; }
    const found=agents.find(x=>x.id===agentId);
    const label=found&&found.name?found.name:'cet agent';
    const ok=await ask({title:'Attribuer la demande ?',
      body:'<p>La demande sera attribuée à <b>'+esc(label)+'</b> et passera « en cours » si elle était ouverte.</p>',
      ok:'Attribuer'});
    if(!ok)return;
    try{ await X.assignTicket(thread.ticket.id,agentId); toast('Demande attribuée.'); await reload(); }
    catch(err){ toast(X.errorText(err)); }
  }

  async function doStatus(status){
    if(!thread)return;
    const t=thread.ticket;
    const closing=status==='resolved'||status==='closed';
    const label=X.statusActionLabel(status);
    const ok=await ask({title:label+' ?',
      body:'<p>'+esc(t.subject)+'</p>'+
        '<div class="field"><label for="stnote">Note '+(closing?'<span class="req">*</span>':'<span class="opt">— facultative</span>')+'</label>'+
        '<textarea id="stnote" rows="3" maxlength="2000" placeholder="'+(closing?'Ce qui a été fait pour le demandeur…':'Note interne facultative')+'"></textarea>'+
        (closing?'<div class="hint">5 caractères minimum. Le demandeur reçoit une notification.</div>':'')+'</div>',
      ok:label,danger:closing&&status==='closed'});
    if(!ok)return;
    const note=($('#stnote')||{}).value||'';
    const guard=X.validateStatus({ticket:t,status,note});
    if(!guard.ok){ toast(guard.error); return; }
    try{ await X.setStatus(t.id,guard.status,guard.note); toast('Statut mis à jour.'); await reload(); }
    catch(err){ toast(X.errorText(err)); }
  }

  async function doReply(){
    if(!thread)return;
    const ta=$('#streply');
    const box=$('#stinternal');
    const guard=X.validateStaffReply({body:ta?ta.value:'',internal:Boolean(box&&box.checked)});
    if(!guard.ok){ toast(guard.error); return; }
    try{
      await X.replyStaff(thread.ticket.id,guard.body,guard.internal);
      toast(guard.internal?'Note interne ajoutée.':'Réponse envoyée au demandeur.');
      await reload();
    }catch(err){ toast(X.errorText(err)); }
  }

  await reload();
};
})();

          (isReject?

/* ---------------------------------------------------------
   p47 : litiges - staff avec double verification.
   Liberer les fonds est la seule decision qui deplace de
   l'argent : elle exige le mot LIBERER. Transmettre au
   remboursement ne rend rien ici. Aucune decision automatique.
   --------------------------------------------------------- */
(function(){
async function disputeModule(){
  for(let i=0;i<20;i++){
    if(window.VAlexDisputes)return window.VAlexDisputes;
    await new Promise(r=>setTimeout(r,50));
  }
  return window.VAlexDisputes||null;
}
const DSP_ROLES={owner:'Propriétaire',admin:'Administrateur',moderator:'Modérateur'};
function dspWhen(iso){ return iso?fdt(iso):'—'; }
function dspTone(status){
  if(status==='resolved')return 'badge--live';
  if(status==='rejected')return 'badge--out';
  if(status==='under_review')return 'badge--warn';
  return 'badge--soon';
}
function dspToneDecision(decision){
  if(decision==='release')return 'btn--danger';
  return 'btn--ghost';
}
function dspCard(d,actions){
  return '<div class="dspitem">'+
    '<div class="dspitem__h"><b>'+esc(d.orderNumber||('commande '+d.orderId.slice(0,8)))+'</b>'+
      '<span class="badge '+dspTone(d.status)+'" style="margin-left:auto">'+esc(d.statusLabel)+'</span></div>'+
    '<div class="dspmeta"><span>'+esc(d.orderTotalLabel)+'</span><span>'+esc(d.shopName||('boutique '+String(d.shopId||'').slice(0,8)))+'</span><span>'+esc(d.orderState?DSP_ORDER(d.orderState):'état inconnu')+'</span></div>'+
    '<div class="dspmeta"><span>Ouvert '+esc(dspWhen(d.createdAt))+'</span><span>'+esc(d.assignedTo?'attribué':'non attribué')+'</span>'+(d.decidedAt?'<span>Décidé '+esc(dspWhen(d.decidedAt))+'</span>':'')+'</div>'+
    '<div class="dspitem__r">Motif : '+esc(d.reason||'non précisé')+'</div>'+
    (d.description?'<div class="dspitem__n">'+esc(d.description)+'</div>':'')+
    (d.decision?'<div class="dspitem__n">Décision : '+esc(d.decisionLabel||d.decision)+(d.decisionNote?' — '+esc(d.decisionNote):'')+'</div>':'')+
    (actions?'<div class="dspacts">'+actions+'</div>':'')+
  '</div>';
}
function DSP_ORDER(state){ return (window.VAlexDisputes&&window.VAlexDisputes.orderStateLabel)?window.VAlexDisputes.orderStateLabel(state):state; }
V.disputes=async function(){
  topbar('back',{title:'Litiges · équipe'});
  if(!S.user){ go('#/compte'); return; }
  this.set('<div class="phead enter"><div class="phead__t"><h1>Litiges · équipe</h1>'+
    '<p>Prendre un litige, écouter les deux parties, puis trancher par écrit.</p></div></div>'+
    '<div id="dspbody">'+skeleton(2)+'</div>');
  const body=$('#dspbody'); if(!body)return;
  const D=await disputeModule();
  if(!D){
    body.innerHTML='<div class="card enter"><div class="card__b"><div class="p47note bad">'+ico('alert',2)+
      '<span>Le module de litiges n\'est pas chargé. Vérifiez votre connexion puis rechargez la page.</span></div></div></div>';
    return;
  }
  let st;
  try{ st=await D.loadAccess(); }
  catch(err){
    body.innerHTML='<div class="card enter"><div class="card__b"><div class="p47note bad">'+ico('alert',2)+
      '<span>'+esc((err&&err.message)||'Lecture impossible.')+'</span></div></div></div>';
    return;
  }
  if(!st.access.ok){
    const mfa=st.access.reason==='mfa_required';
    body.innerHTML='<div class="card enter"><div class="card__h">'+ico('lock',2)+'<h3>'+esc(st.access.title)+'</h3></div>'+
      '<div class="card__b"><div class="p47note '+(mfa?'warn':'bad')+'">'+ico('shield',2)+
      '<span>'+esc(st.access.message)+'</span></div>'+
      (mfa?'<a class="btn btn--pri btn--sm" href="#/qg">Activer la double vérification</a>':
        '<a class="btn btn--ghost btn--sm" href="#/compte">Retour au compte</a>')+'</div></div>';
    return;
  }

  let queue=[], recent=[];
  try{ queue=await D.loadQueue(); }catch(_){ queue=[]; }
  try{ recent=await D.loadRecent(); }catch(_){ recent=[]; }
  const sm=D.summarizeDisputes(queue);

  body.innerHTML=
    '<div class="card enter"><div class="card__h">'+ico('shield',2)+'<h3>Litiges</h3>'+
      '<span class="badge badge--soon" style="margin-left:auto">'+esc(DSP_ROLES[st.role]||'Équipe')+' · aal2</span></div>'+
      '<div class="card__b">'+
        '<div class="p47note">'+ico('check',2)+
        '<span>Trancher un litige est une décision humaine et écrite. Libérer les fonds est la seule décision qui déplace de l\'argent : elle exige le mot '+esc(D.CONFIRM_RELEASE)+'. Transmettre au remboursement ne rend rien ici. Aucune décision n\'est automatique.</span></div>'+
        '<div class="finlist" style="flex-direction:row;flex-wrap:wrap;gap:10px;margin-top:10px">'+
          '<div class="fincard"><span class="fincard__l">En attente</span><strong class="fincard__v">'+esc(String(sm.pending))+'</strong><span class="fincard__n">À instruire</span></div>'+
          '<div class="fincard"><span class="fincard__l">Non attribués</span><strong class="fincard__v">'+esc(String(sm.unassigned))+'</strong><span class="fincard__n">Sans agent</span></div>'+
          '<div class="fincard"><span class="fincard__l">En examen</span><strong class="fincard__v">'+esc(String(sm.under_review))+'</strong><span class="fincard__n">Pris en charge</span></div>'+
          '<div class="fincard"><span class="fincard__l">Résolus</span><strong class="fincard__v">'+esc(String(sm.resolved))+'</strong><span class="fincard__n">Clos par décision</span></div>'+
        '</div></div></div>';

  const queueCard=document.createElement('div');
  queueCard.className='card enter';
  body.appendChild(queueCard);
  if(!queue.length){
    queueCard.innerHTML='<div class="card__h">'+ico('doc',2)+'<h3>Litiges à instruire</h3></div>'+
      '<div class="card__b"><div class="p47note">'+ico('alert',2)+
      '<span>Aucun litige ouvert. Rien n\'est inventé.</span></div></div>';
  } else {
    queueCard.innerHTML='<div class="card__h">'+ico('doc',2)+'<h3>Litiges à instruire</h3><span class="badge badge--soon" style="margin-left:auto">'+esc(String(queue.length))+'</span></div>'+
      '<div class="card__b"><div class="dsplist">'+queue.map(d=>{
        const canClaim=D.canClaim(d,st.meId);
        const claimBtn=canClaim?'<button class="btn btn--ghost btn--sm" data-dspclaim="'+attr(d.id)+'">Prendre le litige</button>':'';
        const decisions=D.nextDecisions(d).map(dec=>
          '<button class="btn '+dspToneDecision(dec)+' btn--sm" data-dspdec="'+attr(dec)+'" data-dspid="'+attr(d.id)+'">'+esc(D.decisionLabel(dec))+'</button>').join('');
        return '<div class="dspcard">'+dspCard(d,claimBtn+decisions)+'</div>';
      }).join('')+'</div></div>';

    const find=id=>queue.find(x=>x.id===id);

    async function doClaim(id){
      const d=find(id); if(!d)return;
      const guard=D.validateClaim({dispute:d,meId:st.meId});
      if(!guard.ok){ toast(guard.error); return; }
      const ok=await ask({title:'Prendre ce litige ?',
        body:'<p>'+esc(d.orderNumber||'commande')+' · '+esc(d.reason||'motif non précisé')+'</p>'+
          '<div class="p47note">'+ico('check',2)+'<span>Le litige vous sera attribué et passera « en examen ». Aucun argent ne bouge.</span></div>',
        ok:'Prendre le litige'});
      if(!ok)return;
      try{ await D.claim(d.id); toast('Litige pris en charge.'); V.disputes(); }
      catch(err){ toast(D.errorText(err)); }
    }

    async function doDecide(id,decision){
      const d=find(id); if(!d)return;
      const moves=D.movesMoney(decision);
      const label=D.decisionLabel(decision);
      const ok=await ask({title:label+' ?',
        body:'<p>'+esc(d.orderNumber||'commande')+' · '+esc(d.orderTotalLabel)+' · '+esc(d.shopName||'boutique')+'</p>'+
          '<div class="p47note '+(moves?'bad':'')+'">'+ico(moves?'alert':'check',2)+'<span>'+esc(D.decisionNotice(decision))+'</span></div>'+
          '<div class="field"><label for="dspnote">Justification <span class="req">*</span></label>'+
          '<textarea id="dspnote" rows="4" maxlength="2000" placeholder="Ce que montrent les preuves et les messages…"></textarea>'+
          '<div class="hint">10 caractères minimum. Cette note est journalisée.</div></div>'+
          (moves?'<div class="field"><label for="dspconfirm">Tapez '+esc(D.CONFIRM_RELEASE)+' pour confirmer la libération des fonds</label>'+
            '<input id="dspconfirm" autocomplete="off" placeholder="'+esc(D.CONFIRM_RELEASE)+'"></div>':''),
        ok:label,danger:moves});
      if(!ok)return;
      const note=($('#dspnote')||{}).value||'';
      const confirm=moves?(($('#dspconfirm')||{}).value||''):'';
      const guard=D.validateDecision({dispute:d,decision,note,confirm});
      if(!guard.ok){ toast(guard.error); return; }
      try{
        await D.decide(d.id,guard.decision,guard.note);
        toast(moves?'Litige tranché, fonds libérés au vendeur.':(decision==='refund'?'Litige transmis au remboursement.':'Litige renvoyé en confirmation.'));
        V.disputes();
      }catch(err){ toast(D.errorText(err)); }
    }

    body.onclick=function(e){
      const c=e.target.closest('[data-dspclaim]');
      if(c){ doClaim(c.dataset.dspclaim); return; }
      const b=e.target.closest('[data-dspdec]');
      if(b){ doDecide(b.dataset.dspid,b.dataset.dspdec); }
    };
  }

  const recentCard=document.createElement('div');
  recentCard.className='card enter';
  body.appendChild(recentCard);
  recentCard.innerHTML='<div class="card__h">'+ico('doc',2)+'<h3>Litiges clos</h3><span class="badge badge--soon" style="margin-left:auto">'+esc(String(recent.length))+'</span></div>'+
    '<div class="card__b">'+(recent.length?'<div class="dsplist">'+recent.map(d=>dspCard(d,'')).join('')+'</div>':
      '<div class="p47note">'+ico('alert',2)+'<span>Aucun litige clos pour l\'instant.</span></div>')+'</div>';
};
})();

async function npfModule(){

    if(dev.subscribed)return 'Cet appareil est abonné aux notifications push.';

      '<div class="card enter"><div class="card__h">'+ico('bell',2)+'<h3>Préférences</h3>'+

          '<div class="npflist" style="margin-top:10px">'+
            '<div class="npfrow npfrow--all">'+
              '<div class="npfrow__l"><b>'+esc(global.label)+'</b><span>Réglage de référence</span></div>'+
              '<div class="npfrow__c">'+npfCheck(global.kind,'inApp',global.inApp,'Site')+npfCheck(global.kind,'push',global.push,'Push')+'</div>'+
            '</div>'+

          '</div>'+
          '<div class="npfsum">'+
            '<span>'+(sm.overrides?esc(String(sm.overrides))+' réglage(s) propre(s)':'Aucun réglage propre')+'</span>'+
            '<span>'+esc(String(sm.pushOff))+' ligne(s) sans push</span>'+
            '<span>'+esc(String(sm.inAppOff))+' ligne(s) sans site</span>'+
          '</div>'+
        '</div></div>'+
      '<div class="card enter"><div class="card__h">'+ico('doc',2)+'<h3>Types qui suivent le global</h3></div>'+
        '<div class="card__b"><div class="npffam">'+
          P.DYNAMIC_FAMILIES.map(f=>'<div class="npffam__i"><b>'+esc(f.label)+'</b><span>'+esc(f.note)+'</span></div>').join('')+
        '</div>'+
        '<div class="p47note" style="margin-top:10px">'+ico('alert',2)+
        '<span>Ces types portent le nom du statut. Les couper un par un demanderait de connaître chaque statut à l\'avance : le réglage global est la seule commande honnête.</span></div>'+
        '</div></div>'+
      '<div class="card enter"><div class="card__h">'+ico('phone',2)+'<h3>Cet appareil</h3></div>'+
        '<div class="card__b"><p class="t-small" style="margin:0">'+esc(deviceLine())+'</p>'+
        '<a class="btn btn--ghost btn--sm" style="margin-top:10px" href="#/reglages">Gérer l\'abonnement de cet appareil</a></div></div>';

    body.onchange=async function(e){
      const input=e.target.closest('[data-npf-kind]');
      if(!input)return;
      const kind=input.dataset.npfKind;
      const field=input.dataset.npfField;
      const guard=P.validateToggle({kind,field});
      if(!guard.ok){ toast(guard.error); input.checked=!input.checked; return; }
      const previous=input.checked;
      let next;
      try{ next=P.toggle(prefs,kind,field,previous); }
      catch(err){ toast(err.message||'Réglage impossible.'); input.checked=!previous; return; }
      const value=next.get(kind);
      input.disabled=true;
      try{
        await P.set(kind,value.inApp,value.push);
        prefs=next;
        toast('Préférence enregistrée.');
        render();
      }catch(err){
        input.checked=!previous;
        input.disabled=false;
        toast(P.errorText(err));
      }
    };
  }
  render();
};

async function shrink(file,max){ try{ const img=await createImageBitmap(file); const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,'image/jpeg',.8)); }catch(e){ return file; } }

    $('#pv').onclick=()=>this.go(this.step-1);
    $('#nx').onclick=async ()=>{
      let ok=true; const em=$('#f_em').value.trim();
      const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
      ok=req('#f_em',()=>valid)&&ok;
      const v=pw.value, sc=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;
      ok=req('#f_pw',()=>v.length>=8&&sc>=3)&&ok; ok=req('#f_pw2',x=>x===v&&x.length>0)&&ok;
      if(!$('#f_tc').checked){$('#tcE').style.display='block';ok=false;}
      if(!ok)return toast('Corrigez les champs en rouge.');
      this.d.acc.email=em; this.d.acc.pw=v;
      this.finish();};},

  async finish(){
    const d=this.d, role=this.role==='buyer'?'buyer':'seller';
    busy('#nx',true,'Création…');
    try{
      if(!S.user){
        const {data,error}=await sb.auth.signUp({email:d.acc.email,password:d.acc.pw,
          options:{emailRedirectTo:location.origin+location.pathname,data:{role:role,first_name:d.user.firstName,last_name:d.user.lastName,
            phone:d.user.phone,department:d.user.department,username:d.user.username||null}}});
        if(error)throw error;
        if(!data.session){
          busy('#nx',false);
          return ask({title:'Confirmation par email requise',
            body:"<p>Votre compte est créé. Ouvrez l'email de confirmation envoyé à <b>"+esc(d.acc.email)+"</b>, touchez le lien, puis revenez vous connecter"+(role==='seller'?' pour ouvrir votre boutique':'')+".</p><p style=\"margin-top:9px\">Regardez aussi dans les spams.</p>",
            ok:'Compris',cancel:false});
        }
        await loadSession();
        /* Le déclencheur crée le profil ; on complète l'âge, qui
           ne fait pas partie des métadonnées d'inscription. */
        if(d.user.age)await sb.from('profiles').update({age:Number(d.user.age)}).eq('id',S.user.id);
        /* p60 : le nom d'utilisateur est posé par la RPC, jamais par une
           écriture directe du navigateur. Si la migration n'est pas encore
           appliquée, l'inscription reste valide et le nom se choisit depuis
           le profil. */
        if(d.user.username){
          const {error:unErr}=await sb.rpc('set_username',{p_username:d.user.username});
          if(unErr&&!rpcMissing(unErr)){
            if(/déjà pris|deja pris/i.test(String(unErr.message||'')))toast('Ce nom vient d\'être pris. Choisissez-en un autre dans Mon profil.');
            else toast(unErr.message||'Le nom d\'utilisateur sera à confirmer dans Mon profil.');
          }
        }
        await loadSession();
      }
      if(role==='seller'||this.role==='shop-only'){
        /* La boutique et l'attribution de parrainage sont creees par le
           serveur dans la meme transaction. Le navigateur ne fabrique
           jamais l'attribution et ne peut pas la modifier ensuite. */
        const {data:shopRes,error}=await sb.rpc('create_shop',{
          p_name:d.shop.name, p_activity:d.shop.activity,
          p_description:d.shop.description||null, p_department:d.shop.department,
          p_city:d.shop.city, p_phone:d.shop.phone,
          p_logo_url:d.shop.logoPath||null, p_referral_code:d.shop.ref||null});
        if(error)throw error;
        this.refError=(shopRes&&shopRes.referral_error)||'';
        this.refOk=!!(shopRes&&shopRes.referral_attached);
        try{LS.set('valex_ref','');}catch(_){}
        /* Le rôle 'buyer' d'un acheteur qui ouvre une boutique
           doit suivre. Le verrou SQL n'autorise pas ce passage
           depuis le navigateur : on le signalera à l'admin. */
        await loadSession();
      }
      busy('#nx',false);
      this.step=99; this.dir=1; this.render();
    }catch(err){ busy('#nx',false); fail(err,'Inscription'); }
  },

  v_fin(){
    const buyer=this.role==='buyer';
    return `<div class="done">
      <div class="done__ring"><svg viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="46"/><circle class="ring" cx="50" cy="50" r="42"/>
        <path class="tick" d="M32 51l12 12 24-26"/></svg></div>
      <h2 class="t-h1">${buyer?'Bienvenue sur VAlex':esc(this.d.shop.name)+' est créée'}</h2>
      <p class="t-sub" style="margin-top:8px;max-width:36ch;margin-left:auto;margin-right:auto">
        ${buyer?'Votre compte est prêt. Parcourez les rayons et remplissez votre panier.'
               :"Nous la vérifions (environ 24 h) avant de la rendre visible. Ajoutez vos produits dès maintenant : ils apparaîtront dès la validation."}</p>
      ${!buyer&&this.refOk?'<div class="p47note ok" style="margin-top:12px;text-align:left">'+ico('check',2)+'<span>Votre parrain a bien été enregistré. Il touchera sa commission après vos livraisons confirmées.</span></div>':''}
      ${!buyer&&this.refError?'<div class="p47note warn" style="margin-top:12px;text-align:left">'+ico('alert',2)+'<span>'+esc(this.refError)+' Votre boutique est bien créée, sans parrain.</span></div>':''}
      <div class="btn-row" style="justify-content:center;margin-top:20px">
        <button class="btn btn--mango" id="fin">${buyer?'Découvrir les articles':'Ajouter mon premier produit'}</button></div></div>`;},
  b_fin(){ $('#fin').onclick=()=>{const b=this.role==='buyer'; this.close(); go(b?(S.cart.length?'#/panier':'#/'):'#/produits/nouveau');}; }
};

/* ==========================================================
   13. DÉMARRAGE
   ========================================================== */
function bootFail(title,detail){
  $('#boot').style.backgroundImage='none';
  $('#boot').innerHTML='<div style="max-width:38ch">'+
    '<div class="empty__ic" style="background:var(--red-soft);color:var(--red)">'+ico('alert')+'</div>'+
    '<h2 class="t-h2" style="margin-top:12px">'+esc(title)+'</h2>'+
    '<p class="t-small" style="margin-top:10px;line-height:1.65">'+detail+'</p></div>';
}

/* Chrome refuse d'envoyer une requête vers un serveur externe
   depuis une page ouverte en file:// ou content:// (ouverture
   directe d'un téléchargement). Ce n'est réparable par aucun
   code : la page doit être servie depuis une vraie adresse
   http/https. On le détecte AVANT d'essayer Supabase, pour ne
   jamais montrer une erreur générique à la place de la vraie
   cause. */
function bootNeedsHosting(){
  $('#boot').style.backgroundImage='none';
  $('#boot').innerHTML=
    '<div style="max-width:400px;text-align:left">'+
    '<div class="empty__ic" style="background:var(--mango-soft);color:#B84A00;margin:0 auto 14px">'+ico('alert')+'</div>'+
    '<h2 class="t-h2" style="text-align:center">Ouvrez VAlex depuis son adresse</h2>'+
    '<p class="t-small" style="margin-top:10px;line-height:1.65;text-align:center">'+
    "Ce fichier a besoin de l'adresse du site pour joindre la base. Pour regarder sans internet, ouvrez le fichier « aperçu ».</p>"+
    '</div>';
}

async function start(){
  $('#boot').style.backgroundImage='none'; $('#boot').innerHTML='<div class="splash"><img src="'+IMG.icone+'" alt=""><span class="brand">VAlex<i>.</i></span></div>';
  const t0=Date.now();
  if(!window.supabase||!window.supabase.createClient){
    return bootFail('Bibliothèque non chargée',
      "Le fichier a besoin d'Internet au premier chargement pour récupérer la bibliothèque Supabase. Vérifiez votre connexion et rouvrez la page.");
  }
  if(location.protocol!=='http:'&&location.protocol!=='https:'){
    return bootNeedsHosting();
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  window.sb=sb;

  const cats=await loadCategories();
  if(!cats){
    return bootFail('Connexion impossible',
      "Le site n'arrive pas à joindre le serveur. Vérifiez votre connexion internet, puis rouvrez la page.");
  }
  NET_OK=true;
  await loadSession();
  loadCart();

  /* Ce bandeau reste visible tant que Google et la vérification
     par email n'ont pas été configurés côté Supabase — une étape
     séparée de l'hébergement, qui suit une fois l'adresse connue. */
  if(!ADVANCED_AUTH_READY){
    $('#netbar').className='netbar';
    $('#netbar').innerHTML=ico('alert',2)+
      "<span>Google, la vérification email et le mot de passe oublié restent à configurer.</span>";
  }

  await new Promise(r=>setTimeout(r,Math.max(0,1100-(Date.now()-t0))));
  $('#boot').classList.add('hidden');
  $('#shell').classList.remove('hidden');
  $('#tabbar').classList.remove('hidden');

  sb.auth.onAuthStateChange(async (ev)=>{ await loadSession(); paintTabbar();
    if(ev==='PASSWORD_RECOVERY'){
      const ok=await ask({title:'Nouveau mot de passe',body:'<div class="field" style="margin:0"><input type="password" id="npw" placeholder="8 caractères minimum" autocomplete="new-password"></div>',ok:'Enregistrer',cancel:false});
      const v=($('#npw')||{}).value||'';
      if(ok&&v.length>=8){ const {error}=await sb.auth.updateUser({password:v}); if(error)fail(error,'Mot de passe'); else toast('Mot de passe changé.'); }
      else toast('Mot de passe trop court : recommencez avec « Mot de passe oublié ».');
    }});
  if(/[#&](access_token|error_description)=/.test(location.hash)){ history.replaceState(null,'',location.pathname+'#/compte'); }
  window.addEventListener('hashchange',()=>{ if($('#wiz').classList.contains('on'))wiz.close(); route(); });
  $('#scrim').onclick=closeNav;
  $('#wizQuit').onclick=()=>{wiz.close();route();};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNav();$('#modal').classList.remove('on');}});

  if(!location.hash||location.hash==='#')location.hash='#/';
  route();
}
start();

})();
