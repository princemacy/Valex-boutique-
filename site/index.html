<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VAlex Boutique — La marketplace haïtienne</title>
<meta property="og:title" content="VAlex Boutique">
<meta property="og:description" content="Achetez local en Haïti : boutiques vérifiées, paiement à la livraison.">
<meta name="description" content="Achetez et vendez en Haïti. Boutiques vérifiées, paiement à la livraison.">
<meta name="theme-color" content="#FF6A00">
<link rel="icon" id="favi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#FF6A00;--pine-2:#E85F00;--pine-3:#C24F00;--pine-soft:#FFF1E6;--pine-line:#FFD2B0;
  --mango:#111111;--mango-2:#000000;--mango-soft:#F2F2F2;--mango-ink:#FFFFFF;
  --ink:#111111;--ink-2:#3D3D3D;--ink-3:#767676;--ink-4:#A3A3A3;
  --app:#FFFFFF;--card:#FFFFFF;--sunk:#F6F6F6;--line:#E8E8E8;--line-2:#F1F1F1;
  --red:#D93025;--red-soft:#FDECEA;--blue:#1F5F8B;--blue-soft:#E9F1F7;
  --ff-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --ff-b:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-xs:5px;--r-s:8px;--r-m:12px;--r-l:18px;--r-full:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.05);
  --sh-2:0 2px 4px rgba(0,0,0,.04),0 12px 28px -14px rgba(0,0,0,.2);
  --sh-3:0 24px 60px -18px rgba(0,0,0,.35);
  --nav-w:246px;--tab-h:60px;
  --ease:cubic-bezier(.22,1,.36,1);--ease-back:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--app);color:var(--ink);font-family:var(--ff-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{font-family:var(--ff-d);font-weight:700;letter-spacing:-.022em;margin:0;line-height:1.14}
p{margin:0}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none !important}
.t-h1{font-family:var(--ff-d);font-size:26px;font-weight:800;letter-spacing:-.03em}
.t-h2{font-family:var(--ff-d);font-size:19px;font-weight:700;letter-spacing:-.025em}
.t-h3{font-family:var(--ff-d);font-size:16px;font-weight:700;letter-spacing:-.02em}
.t-sub{color:var(--ink-3);font-size:14px}
.t-small{font-size:13px;color:var(--ink-3)}
.stack>*+*{margin-top:14px}
.brand{display:flex;align-items:baseline;gap:1px;font-family:var(--ff-d);font-weight:800;letter-spacing:-.05em;color:var(--pine);font-size:24px}
.brand i{color:var(--mango);font-style:normal}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 17px;border-radius:var(--r-s);font-size:14.5px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:transform .12s var(--ease),background .18s;position:relative;overflow:hidden}
.btn:active{transform:scale(.972)}
.btn:hover{background:var(--sunk)}
.btn--pri{background:var(--pine);border-color:var(--pine);color:#fff}
.btn--pri:hover{background:var(--pine-2)}
.btn--mango{background:var(--mango);border-color:var(--mango);color:var(--mango-ink)}
.btn--mango:hover{background:var(--mango-2)}
.btn--ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn--ghost:hover{background:var(--line-2)}
.btn--danger{color:var(--red);border-color:#E9C6C1}
.btn--danger:hover{background:var(--red-soft)}
.btn--wide{width:100%}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn--sm{padding:7px 13px;font-size:13.5px}
.btn--lg{padding:13px 22px;font-size:15.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important}
.btn.is-saved{background:var(--pine) !important;border-color:var(--pine) !important;color:#fff !important}
.btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.42);transform:scale(0);animation:ripple .58s var(--ease) forwards;pointer-events:none}
.btn:not(.btn--pri):not(.btn--mango) .ripple{background:rgba(0,0,0,.11)}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.btn-row--split{justify-content:space-between}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn:not(.btn--pri):not(.btn--mango) .spin{border-color:rgba(0,0,0,.2);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}

.field{margin-bottom:15px}
.field>label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.field .req{color:var(--red)}
.field .opt{color:var(--ink-4);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;font-family:var(--ff-b);font-size:15px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);transition:border-color .18s,background .18s,box-shadow .18s}
.field textarea{resize:vertical;min-height:78px;line-height:1.55}
.field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236D857B' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:34px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;background:var(--card);border-color:var(--pine);box-shadow:0 0 0 3px rgba(255,106,0,.13)}
.field .hint{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.field .err{font-size:12.5px;color:var(--red);margin-top:5px;display:none;font-weight:500}
.field.is-bad input,.field.is-bad select,.field.is-bad textarea,.field.is-bad .tel{border-color:var(--red);background:var(--red-soft)}
.field.is-bad .err{display:block;animation:shakeIn .34s var(--ease)}
@keyframes shakeIn{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.tel{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-s);background:var(--sunk);overflow:hidden;transition:border-color .18s,box-shadow .18s}
.tel:focus-within{border-color:var(--pine);box-shadow:0 0 0 3px rgba(255,106,0,.13);background:var(--card)}
.tel span{display:grid;place-items:center;padding:0 11px;font-weight:600;font-size:14.5px;color:var(--ink-2);background:var(--line-2);border-right:1px solid var(--line)}
.tel input{border:0 !important;background:transparent !important;box-shadow:none !important;border-radius:0}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5}
.check input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--pine);flex:0 0 auto;cursor:pointer}
.check a{color:var(--pine);font-weight:600;text-decoration:underline}
.pw-meter{display:flex;gap:5px;align-items:center;margin-top:8px}
.pw-meter .seg{height:5px;flex:1;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.pw-meter .seg::after{content:'';position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:var(--pine);transition:transform .38s var(--ease),background .28s}
.pw-meter .seg.on::after{transform:scaleX(1)}
.pw-meter.lv1 .seg.on::after,.pw-meter.lv2 .seg.on::after{background:var(--red)}
.pw-meter.lv3 .seg.on::after{background:var(--mango)}
.pw-meter .lab{font-size:12px;font-weight:700;min-width:44px;text-align:right}
.pw-rules{margin-top:8px;display:grid;gap:3px}
.pw-rules li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);transition:color .2s}
.pw-rules li.ok{color:var(--pine)}
.pw-rules .tick{width:14px;height:14px;flex:0 0 auto;transition:transform .3s var(--ease-back)}
.pw-rules li.ok .tick{transform:scale(1.18)}

.shell{min-height:100dvh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px)}
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px}
.topbar__sp{flex:1}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-s);color:var(--ink-2);position:relative;transition:background .18s}
.iconbtn:hover{background:var(--line-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .cnt{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:var(--r-full);background:var(--mango);color:var(--mango-ink);font-size:10.5px;font-weight:800;display:grid;place-items:center;animation:popIn .34s var(--ease-back)}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-full);padding:9px 14px;transition:border-color .18s,box-shadow .18s}
.search:focus-within{border-color:var(--pine);box-shadow:0 0 0 3px rgba(255,106,0,.12);background:var(--card)}
.search svg{width:17px;height:17px;color:var(--ink-3);flex:0 0 auto}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;min-width:0}
.main{padding:16px 14px 26px}
.page{max-width:980px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -6px 22px -14px rgba(0,0,0,.35)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);position:relative;transition:color .2s}
.tabbar a svg{width:21px;height:21px;transition:transform .3s var(--ease-back)}
.tabbar a.on{color:var(--pine)}
.tabbar a.on svg{transform:translateY(-2px) scale(1.1)}
.tabbar a .cnt{position:absolute;top:7px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-full);background:var(--mango);color:var(--mango-ink);font-size:10px;font-weight:800;display:grid;place-items:center}
.tabbar .mid{justify-content:flex-start;padding-top:5px}
.tabbar .mid .knob{width:46px;height:38px;border-radius:13px;background:var(--mango);color:var(--mango-ink);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(255,106,0,.85);transition:transform .28s var(--ease-back)}
.tabbar .mid:active .knob{transform:scale(.9)}
.tabbar .mid.on .knob{background:var(--pine);color:#fff}
.tabbar .mid span{margin-top:2px}

.trust{background:linear-gradient(140deg,var(--pine) 0%,var(--pine-3) 58%,#111111 100%);color:#EDEDED;border-radius:var(--r-l);padding:20px 18px;position:relative;overflow:hidden}
.trust::after{content:'';position:absolute;right:-58px;top:-58px;width:190px;height:190px;border-radius:50%;background:rgba(255,106,0,.16)}
.trust h1{color:#fff;font-size:24px;font-weight:800;letter-spacing:-.032em;position:relative;max-width:17ch}
.trust p{margin-top:8px;font-size:13.5px;line-height:1.6;max-width:40ch;position:relative}
.trust__pts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;position:relative}
.trust__pt{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:7px 12px;border-radius:var(--r-full);font-size:12.5px;font-weight:600;color:#fff;opacity:0;transform:translateY(9px);animation:enter .5s var(--ease) forwards}
.trust__pt svg{width:14px;height:14px;color:var(--mango);flex:0 0 auto}

.rail{display:flex;gap:9px;overflow-x:auto;padding:2px 14px 4px;margin:0 -14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-full);font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .18s var(--ease),background .18s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
.chip svg{width:16px;height:16px;opacity:.85}
.rayon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.rayon{display:flex;align-items:center;gap:11px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);text-align:left;transition:transform .2s var(--ease),box-shadow .2s}
.rayon:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.rayon .ic{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r-s);background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;overflow:hidden}
.rayon .ic svg{width:19px;height:19px}
.rayon .ic img{width:100%;height:100%;object-fit:cover}
.rayon strong{display:block;font-size:14px;font-weight:600;line-height:1.25}
.rayon span{font-size:12px;color:var(--ink-3)}

.sechead{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px}
.sechead h2{font-size:19px}
.sechead .more{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--pine)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sh-1);text-align:left;width:100%;opacity:0;animation:enter .48s var(--ease) forwards;transition:transform .2s var(--ease),box-shadow .2s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard__img{aspect-ratio:1;background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--ink-4)}
.pcard__img img{width:100%;height:100%;object-fit:cover}
.pcard__tags{position:absolute;left:7px;top:7px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pcard__b{padding:10px 11px 12px}
.pcard__b strong{display:block;font-size:13.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pcard__shop{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pcard__shop .dotav{width:14px;height:14px;border-radius:4px;background:var(--pine);color:#fff;font-size:8px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.pcard__shop .dotav img{width:100%;height:100%;object-fit:cover}
.price{font-family:var(--ff-d);font-weight:700;font-size:15px;letter-spacing:-.02em}
.was{font-size:12.5px;color:var(--ink-4);text-decoration:line-through;margin-left:6px}
@keyframes enter{to{opacity:1;transform:none}}
.enter{opacity:0;transform:translateY(14px);animation:enter .5s var(--ease) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.68)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-full);font-size:11.5px;font-weight:700}
.badge--live{background:var(--pine-soft);color:var(--pine)}
.badge--draft{background:var(--line-2);color:var(--ink-3)}
.badge--out{background:var(--red-soft);color:var(--red)}
.badge--soon{background:var(--blue-soft);color:var(--blue)}
.badge--warn{background:var(--mango-soft);color:#B84A00}
.badge--demo{background:var(--mango);color:var(--mango-ink)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1)}
.card__h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card__h h3{font-size:15.5px}
.card__h .btn{margin-left:auto}
.card__b{padding:16px}
.card__f{padding:12px 16px;border-top:1px solid var(--line-2);background:var(--sunk);border-radius:0 0 var(--r-m) var(--r-m);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:34px 20px}
.empty__ic{width:56px;height:56px;margin:0 auto 14px;border-radius:var(--r-m);background:var(--pine-soft);display:grid;place-items:center;color:var(--pine)}
.empty__ic svg{width:26px;height:26px}
.empty h3{font-size:17px;margin-bottom:6px}
.empty p{font-size:13.5px;color:var(--ink-3);max-width:38ch;margin:0 auto 16px;line-height:1.6}
.measure-tab{width:100%;border-collapse:collapse;font-size:13.5px}
.measure-tab td{padding:8px 0;border-bottom:1px solid var(--line-2)}
.measure-tab tr:last-child td{border-bottom:0}
.measure-tab td:first-child{color:var(--ink-3)}
.measure-tab td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* squelettes de chargement */
.sk{background:linear-gradient(90deg,var(--line-2) 25%,#F6F6F6 50%,var(--line-2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r-s)}
@keyframes shimmer{to{background-position:-200% 0}}
.sk-card{height:230px;border-radius:var(--r-m)}
.sk-line{height:13px;margin-top:8px}

.gal{border-radius:var(--r-m);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.gal__main{aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;color:var(--ink-4)}
.gal__main img{width:100%;height:100%;object-fit:cover;animation:fadeIn .3s var(--ease)}
.gal__thumbs{display:flex;gap:7px;padding:9px;overflow-x:auto;scrollbar-width:none}
.gal__thumbs::-webkit-scrollbar{display:none}
.gal__thumbs button{width:52px;height:52px;flex:0 0 auto;border-radius:var(--r-s);overflow:hidden;border:2px solid transparent;background:var(--sunk)}
.gal__thumbs button.on{border-color:var(--pine)}
.gal__thumbs img{width:100%;height:100%;object-fit:cover}
.buybar{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:11px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh-2);margin-top:16px}
.buybar .p{flex:1;min-width:0}
.shopline{display:flex;align-items:center;gap:11px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);width:100%;text-align:left}
.shopline .av{width:42px;height:42px;border-radius:var(--r-s);background:var(--pine);color:#fff;font-family:var(--ff-d);font-weight:800;font-size:17px;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.shopline .av img{width:100%;height:100%;object-fit:cover}

/* sélecteur de variante */
.vpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.vpick button{padding:9px 14px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--card);font-size:14px;font-weight:600;transition:border-color .18s,background .18s,transform .16s var(--ease)}
.vpick button:active{transform:scale(.96)}
.vpick button.on{border-color:var(--pine);background:var(--pine-soft);color:var(--pine)}
.vpick button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}

.citem{display:flex;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);align-items:center}
.citem__img{width:64px;height:64px;flex:0 0 auto;border-radius:var(--r-s);overflow:hidden;background:var(--sunk)}
.citem__img img{width:100%;height:100%;object-fit:cover}
.citem__b{flex:1;min-width:0}
.citem__b strong{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.qty button{width:30px;height:30px;display:grid;place-items:center;font-size:17px;color:var(--ink-2)}
.qty button:hover{background:var(--line-2)}
.qty span{min-width:26px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.sumline{display:flex;justify-content:space-between;font-size:14px;padding:7px 0}
.sumline.total{border-top:1px solid var(--line);margin-top:5px;padding-top:12px;font-size:17px}
.sumline.total b{font-family:var(--ff-d);font-size:21px;letter-spacing:-.03em}

.nav{position:fixed;top:0;bottom:0;left:0;width:var(--nav-w);z-index:60;background:var(--ink);color:#D6D6D6;padding:16px 12px;overflow-y:auto;transform:translateX(-100%);transition:transform .4s var(--ease);display:flex;flex-direction:column}
.nav.open{transform:none}
.nav__head{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.nav__head .brand{color:#fff}
.nav__close{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-s);color:#A3A3A3}
.nav__shop{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.07);border-radius:var(--r-m);margin-bottom:14px}
.nav__shop .av{width:36px;height:36px;border-radius:var(--r-s);overflow:hidden;background:var(--pine);display:grid;place-items:center;color:#fff;font-family:var(--ff-d);font-weight:800;font-size:15px;flex:0 0 auto}
.nav__shop .av img{width:100%;height:100%;object-fit:cover}
.nav__shop strong{display:block;font-size:13.5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav__shop span{font-size:11.5px;color:#A3A3A3}
.nav__group{padding:9px 8px 4px;font-size:11px;font-weight:700;color:#888888}
.nav a.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-s);font-size:14px;font-weight:500;color:#D6D6D6;position:relative;transition:background .18s,color .18s}
.nav a.item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.item.on{background:var(--pine);color:#fff;font-weight:600}
.nav a.item.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;background:var(--mango);border-radius:0 3px 3px 0}
.nav a.item svg{width:17px;height:17px;flex:0 0 auto;opacity:.9}
.nav a.item .tag{margin-left:auto;font-size:10.5px;padding:2px 7px;border-radius:var(--r-full);background:rgba(255,255,255,.12);color:#A3A3A3;font-weight:600}
.nav a.item .num{margin-left:auto;font-size:11.5px;color:#A3A3A3}
.nav__foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.scrim{position:fixed;inset:0;background:rgba(6,18,14,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.phead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead__t{min-width:0;flex:1}
.phead h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.phead p{margin-top:4px;font-size:13.5px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 15px;box-shadow:var(--sh-1)}
.stat b{display:block;font-family:var(--ff-d);font-size:28px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.05}
.stat span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:3px}
.stat.accent b{color:var(--pine)}
.task{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.task:last-child{border-bottom:0}
.task__box{width:21px;height:21px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;transition:all .3s var(--ease-back)}
.task.done .task__box{background:var(--pine);border-color:var(--pine)}
.task.done .task__box svg{stroke:#fff}
.task__box svg{width:11px;height:11px;stroke:transparent;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.task__t{flex:1;min-width:0}
.task__t strong{display:block;font-size:14px;font-weight:600}
.task.done .task__t strong{color:var(--ink-3);text-decoration:line-through}
.task__t span{font-size:12.5px;color:var(--ink-3)}
.plist{display:grid;gap:10px}
.pitem{display:flex;gap:12px;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1);align-items:center;text-align:left;width:100%;opacity:0;animation:enter .46s var(--ease) forwards}
.pitem__img{width:60px;height:60px;flex:0 0 auto;border-radius:var(--r-s);overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--ink-4)}
.pitem__img img{width:100%;height:100%;object-fit:cover}
.pitem__b{flex:1;min-width:0}
.pitem__b strong{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem__meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
.gauge{display:flex;align-items:center;gap:11px}
.gauge__track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.gauge__fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--pine),var(--mango));transition:width .7s var(--ease)}
.gauge__n{font-size:13px;font-weight:700;min-width:36px;text-align:right}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 13px;font-size:14px;font-weight:600;color:var(--ink-3);position:relative;white-space:nowrap}
.tabs button::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;background:var(--pine);border-radius:3px;transform:scaleX(0);transition:transform .32s var(--ease)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{transform:scaleX(1)}
.picks{display:grid;gap:9px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--card);cursor:pointer;transition:border-color .2s,background .2s}
.pick input{margin:2px 0 0;accent-color:var(--pine);width:17px;height:17px;flex:0 0 auto}
.pick strong{display:block;font-size:14px;font-weight:600}
.pick span{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.pick.on{border-color:var(--pine);background:var(--pine-soft)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.shot{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line);background:var(--sunk);animation:popIn .38s var(--ease-back)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.shot .main-tag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:var(--mango);color:var(--mango-ink);padding:2px 6px;border-radius:var(--r-full)}
.shot--add{display:grid;place-items:center;border:1.5px dashed var(--pine-line);background:var(--pine-soft);color:var(--pine);gap:3px;font-size:11.5px;font-weight:600;text-align:center;padding:6px}
.logo-drop{display:flex;align-items:center;gap:14px;padding:13px;border:1.5px dashed var(--pine-line);background:var(--pine-soft);border-radius:var(--r-m)}
.logo-drop__img{width:64px;height:64px;flex:0 0 auto;border-radius:var(--r-m);overflow:hidden;background:var(--card);border:1px solid var(--pine-line);display:grid;place-items:center;color:var(--ink-4);font-size:11px;text-align:center;padding:4px}
.logo-drop__img img{width:100%;height:100%;object-fit:cover;animation:popIn .42s var(--ease-back)}
.logo-drop__txt strong{display:block;font-size:14px}
.logo-drop__txt span{font-size:12.5px;color:var(--ink-3)}

/* lignes de variantes */
.vrow{border:1px solid var(--line);border-radius:var(--r-m);padding:11px;background:var(--card);margin-bottom:9px;animation:popIn .3s var(--ease-back)}
.vrow__top{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.vrow__num{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vrow .field{margin-bottom:0}
.vrow .field>label{font-size:12px;margin-bottom:3px}
.vrow .field input{padding:8px 10px;font-size:14px}
.vrow__x{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-s);color:var(--red);background:var(--red-soft)}
.vrow__more{margin-top:9px;font-size:12.5px;font-weight:600;color:var(--pine)}
.vrow__mes{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}

@media (min-width:900px){
  .nav{transform:none}
  .nav__close{display:none}
  .shell.vendor .main{margin-left:var(--nav-w)}
  .shell.vendor .topbar{padding-left:calc(var(--nav-w) + 14px)}
}

.wiz{position:fixed;inset:0;z-index:70;background:var(--app);overflow-y:auto;display:none}
.wiz.on{display:block}
.wiz__top{background:var(--card);border-bottom:1px solid var(--line);padding:13px 18px;position:sticky;top:0;z-index:5}
.wiz__topin{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.wiz__topin .brand{font-size:21px}
.wiz__count{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:600}
.wiz__bar{height:3px;background:var(--line-2);position:relative;overflow:hidden}
.wiz__bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pine),var(--mango));width:0;transition:width .62s var(--ease)}
.wiz__body{padding:24px 16px 60px}
.wiz__inner{max-width:620px;margin:0 auto}
.wiz__card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 18px;box-shadow:var(--sh-2)}
.wiz__head{margin-bottom:18px}
.wiz__head h2{font-size:23px;font-weight:800;letter-spacing:-.03em}
.wiz__head p{margin-top:6px;color:var(--ink-3);font-size:14px;line-height:1.55}
.slide-in-r{animation:slideR .46s var(--ease) both}
.slide-in-l{animation:slideL .46s var(--ease) both}
@keyframes slideR{from{opacity:0;transform:translateX(34px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-34px) scale(.985)}to{opacity:1;transform:none}}
.done{text-align:center}
.done__ring{width:88px;height:88px;margin:0 auto 18px}
.done__ring circle.bg{fill:var(--pine-soft)}
.done__ring circle.ring{fill:none;stroke:var(--pine);stroke-width:3;stroke-dasharray:264;stroke-dashoffset:264;animation:drawRing .8s var(--ease) .1s forwards}
.done__ring path.tick{fill:none;stroke:var(--pine);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:drawTick .5s var(--ease) .62s forwards}
@keyframes drawRing{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}

.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:18px}
.modal.on{display:grid}
.modal__bg{position:absolute;inset:0;background:rgba(6,18,14,.6);backdrop-filter:blur(3px);animation:fadeIn .3s var(--ease)}
.modal__box{position:relative;background:var(--card);border-radius:var(--r-l);width:100%;max-width:440px;box-shadow:var(--sh-3);overflow:hidden;animation:modalIn .4s var(--ease-back);max-height:88dvh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.modal__box h3{font-size:18px;padding:19px 20px 0}
.modal__box .body{padding:9px 20px 4px;font-size:14px;color:var(--ink-2);line-height:1.6}
.modal__box .foot{padding:16px 20px 20px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:100;transform:translate(-50%,190%);background:var(--ink);color:#fff;padding:11px 17px;border-radius:var(--r-full);font-size:14px;font-weight:500;box-shadow:var(--sh-3);max-width:calc(100vw - 32px);display:flex;align-items:center;gap:9px;transition:transform .48s var(--ease-back)}
.toast.on{transform:translate(-50%,0)}
.toast .ic{width:17px;height:17px;flex:0 0 auto;color:var(--mango)}

/* bandeau d'état de connexion */
.netbar{padding:9px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;background:var(--red-soft);color:var(--red)}
.netbar svg{width:15px;height:15px;flex:0 0 auto}
.boot{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
/* ===== V4 : logo, accueil, fil vidéo, commandes ===== */
.brand{align-items:center;gap:7px}
.brand__ic{width:28px;height:28px;border-radius:8px;flex:0 0 auto}
.brand i{margin-left:-6px}
.boot{background:#050506 center/cover no-repeat;align-items:end}
.boot__msg{color:#CCCCCC;padding-bottom:36px}
.btn--wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn--wa:hover{background:#178a45}
.btn.is-on{background:var(--pine-soft);border-color:var(--pine-line);color:var(--pine)}
.btn.is-on svg{fill:currentColor}
#favBtn.is-on{color:var(--red);background:var(--red-soft);border-color:#E9C6C1}

.hero{position:relative;border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-2)}
.hero__track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero__track::-webkit-scrollbar{display:none}
.hero__slide{flex:0 0 100%;scroll-snap-align:start;min-height:200px;padding:20px 18px 40px;background-size:cover;background-position:center right;display:flex;flex-direction:column;justify-content:center;color:#fff}
.hero__t{font-family:var(--ff-d);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:15ch}
.hero__t em{font-style:normal;color:var(--mango)}
.hero__p{font-size:13px;color:#EDEDED;margin-top:8px;max-width:26ch;line-height:1.5}
.hero__b{align-self:flex-start;margin-top:14px}
.hero__dots{position:absolute;left:18px;bottom:13px;display:flex;gap:6px}
.hero__dots button{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.45);transition:width .3s var(--ease),background .3s}
.hero__dots button.on{width:20px;background:var(--mango)}

.rays{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;margin-top:16px}
.ray{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;color:var(--ink-2)}
.ray__img{width:62px;height:62px;border-radius:50%;overflow:hidden;background:var(--pine-soft);display:grid;place-items:center;color:var(--pine);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--pine-line);transition:transform .2s var(--ease)}
.ray:active .ray__img{transform:scale(.94)}
.ray__img img{width:100%;height:100%;object-fit:cover}
.ray__img svg{width:24px;height:24px}

.vrail{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none}
.vrail::-webkit-scrollbar{display:none}
.vtile{flex:0 0 auto;width:128px;aspect-ratio:9/14;border-radius:var(--r-m);overflow:hidden;position:relative;background:var(--pine-3);color:#fff}
.vtile img{width:100%;height:100%;object-fit:cover}
.vtile::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,30,24,.85),transparent 55%)}
.vtile__play{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:1}
.vtile__play svg{width:13px;height:13px;margin-left:2px}
.vtile__b{position:absolute;left:8px;right:8px;bottom:8px;z-index:1;display:flex;flex-direction:column;gap:2px}
.vtile__b strong{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtile__b span{font-size:12px;font-weight:700;color:var(--mango)}

.shopchip{flex:0 0 auto;width:118px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m)}
.shopchip .av{width:48px;height:48px;border-radius:14px;background:var(--pine);color:#fff;font-family:var(--ff-d);font-weight:800;font-size:19px;display:grid;place-items:center;overflow:hidden;margin-bottom:7px}
.shopchip .av img{width:100%;height:100%;object-fit:cover}
.shopchip strong{font-size:13px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shopchip span{font-size:11.5px;color:var(--ink-3)}
.sellcard{display:flex;flex-direction:column;margin-top:22px;border-radius:var(--r-l);padding:20px 18px;background-size:cover;background-position:center right;color:#fff;min-height:150px;justify-content:center}
.sellcard strong{font-family:var(--ff-d);font-size:20px;max-width:16ch;line-height:1.15}
.sellcard span{font-size:13px;color:#EDEDED;max-width:28ch;margin-top:6px}

/* fil vidéo plein écran */
.shell.feedmode .topbar,.shell.feedmode #netbar{display:none}
.shell.feedmode .main{padding:0}
.shell.feedmode .page{max-width:none}
.feed{position:fixed;inset:0 0 calc(var(--tab-h) + env(safe-area-inset-bottom,0px)) 0;background:#000;z-index:20}
.feed__top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:10px 10px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.feed__home{color:#fff}
.feed__home:hover{background:rgba(255,255,255,.12)}
.feed__tabs{display:flex;gap:18px}
.feed__tabs button{color:rgba(255,255,255,.65);font-weight:700;font-size:15px;padding:6px 2px;border-bottom:2px solid transparent}
.feed__tabs button.on{color:#fff;border-color:#fff}
.feed__list{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed__list::-webkit-scrollbar{display:none}
.feed__item{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;overflow:hidden;background:#000}
.feed__vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feed__imgs{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.feed__imgs::-webkit-scrollbar{display:none}
.feed__imgs img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start;background:#111}
.feed__imgs>span{margin:auto}
.feed__count{position:absolute;top:58px;right:12px;z-index:2;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.feed__shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.15) 38%,transparent 60%);pointer-events:none}
.feed__sound{position:absolute;top:58px;left:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;opacity:.6}
.feed__sound.is-on{opacity:1;background:var(--mango);color:var(--mango-ink)}
.feed__sound svg{width:18px;height:18px}
.feed__side{position:absolute;right:8px;bottom:110px;z-index:2;display:flex;flex-direction:column;gap:16px}
.feed__btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.feed__btn span{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.38);display:grid;place-items:center;transition:transform .25s var(--ease-back)}
.feed__btn:active span{transform:scale(.88)}
.feed__btn svg{width:22px;height:22px}
.feed__btn.is-on svg{fill:#E2485C;stroke:#E2485C}
.feed__info{position:absolute;left:14px;right:76px;bottom:16px;z-index:2;color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.feed__shop{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.feed__shop .av{width:32px;height:32px;border-radius:9px;background:var(--pine);display:grid;place-items:center;font-family:var(--ff-d);font-weight:800;overflow:hidden;border:1.5px solid #fff}

.procta{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#111;color:#fff;margin-bottom:14px}
.procta>svg{width:26px;height:26px;color:#FF6A00;flex:0 0 auto}.procta strong{display:block;font-size:15px}.procta span span{font-size:12.5px;color:#ccc;line-height:1.4}
.procta>svg:last-child{width:18px;height:18px;color:#fff}
.probadge{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#FFF1E6;color:#7A3100;font-size:13.5px;margin:0 0 14px}
.probadge svg{width:18px;height:18px;color:#FF6A00}
.probadge-s{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;background:#111;color:#FF6A00;font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px}
.probadge-s svg{width:12px;height:12px}
/* Graphiques */
.chart svg{width:100%;height:150px;display:block;touch-action:pan-y}
.chart__tip{font-size:12.5px;color:var(--ink-2);margin-top:4px;min-height:18px}
.seg{display:flex;gap:6px;background:#F4F4F4;padding:4px;border-radius:12px;margin:0 0 12px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button svg{width:15px;height:15px}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpis--4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpis--4>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpis--4 b{display:block;font-family:var(--ff-d);font-size:19px;font-weight:800;letter-spacing:-.02em}
.kpis--4 span{display:block;font-size:12px;color:var(--ink-3)}
.kpis--4 .up{color:#0F7B3F;font-weight:700}.kpis--4 .down{color:#B42318;font-weight:700}
#sres .card,#qres .card{margin-bottom:12px}
.legend{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--ink-3)}.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-left:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-bottom:16px;position:relative}
.bars__c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bars__c i{display:block;width:100%;background:#FFD2B0;border-radius:3px 3px 0 0}.bars__c.hi i{background:#FF6A00}
.bars__c span{position:absolute;bottom:-16px;font-size:9px;color:#999}
.hbars>div{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin-bottom:7px}
.hbars>div>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars i{height:10px;background:#F4F4F4;border-radius:5px;overflow:hidden}.hbars b{display:block;height:100%;background:#FF6A00;border-radius:5px}
.hbars em{font-style:normal;font-weight:700;text-align:right}
.toplist a{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.toplist a:last-child{border:0}.toplist em{grid-row:span 2;font-style:normal;font-weight:800;color:#FF6A00}
.toplist span{font-size:14px;font-weight:600}.toplist b{font-size:12px;font-weight:500;color:var(--ink-3)}
.locked .blurbox{filter:blur(5px);opacity:.55;pointer-events:none;margin-bottom:10px;user-select:none}
/* Pro */
.prohero{text-align:center;padding:22px 14px 14px;border-radius:16px;background:#111;color:#fff;margin-bottom:12px}
.prohero svg{width:34px;height:34px;color:#FF6A00}.prohero h1{font-family:var(--ff-d);font-size:26px;margin:6px 0}.prohero p{font-size:13.5px;color:#ccc;line-height:1.5}
.plans{display:grid;gap:10px}
.plan{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.plan strong{display:block;font-size:14px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.plan>b{display:block;font-family:var(--ff-d);font-size:24px;font-weight:800;margin:2px 0}.plan>b small{font-size:13px;font-weight:600;color:var(--ink-3)}
.plan p{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-top:8px}
.plan--pro{border:2px solid #FF6A00}.plan--pro strong{color:#FF6A00}
.howsteps{padding-left:18px;font-size:13.5px;line-height:1.55;margin:6px 0 12px}.howsteps li{margin-bottom:5px}
/* Connexion */
.authbox{max-width:420px;margin:0 auto;padding-top:6px}
.authbox h1{font-family:var(--ff-d);font-size:26px;letter-spacing:-.02em}.authbox>p{font-size:14px;color:var(--ink-2);line-height:1.55;margin:6px 0 16px}
.gbtn{background:#fff;border:1.5px solid var(--line);color:var(--ink);display:flex;gap:10px;justify-content:center;font-weight:700}
.gbtn svg{width:20px;height:20px}
.orsep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-3);font-size:12.5px}
.orsep:before,.orsep:after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{display:block;margin:8px auto 0}
.newacc{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);text-align:center}.newacc>span{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.finish{margin-top:12px;border:2px solid #FF6A00}
/* Boutique */
.picbtn{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;z-index:2}
.picbtn svg{width:15px;height:15px}
.picbtn--logo{right:-6px;top:auto;bottom:-6px;padding:6px;background:#FF6A00;border:2px solid #fff}
.banpick{width:100%;height:92px;border-radius:12px;border:1.5px dashed var(--line);background:#F7F7F7 center/cover;display:flex;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.banpick[style*="url"]{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);border-style:solid}
.banpick svg{width:18px;height:18px}
/* Prix par taille */
.vprice{margin-top:10px}.pgridin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pgridin label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700}
.pgridin input{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:9px;font-size:14px}
/* Messagerie */
.bell{position:relative}
.privnote{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#F4F4F4;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-bottom:10px}
.privnote svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.clist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.crow:last-child{border:0}.crow .av{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}
.crow .av img{width:100%;height:100%;object-fit:cover}
.crow__b{min-width:0}.crow__b strong{display:block;font-size:14.5px}.crow__b>span{display:block;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow.un .crow__b>span{color:var(--ink);font-weight:600}
.crow__t{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.crow__t b{background:#FF6A00;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.tagsel{font-style:normal;font-size:10.5px;font-weight:700;background:#FFF1E6;color:#9A3D00;padding:1px 6px;border-radius:999px;margin-left:4px}
.nlist{display:grid;gap:8px}.nlist a{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.45}
.nlist a.nhot{border-color:#FF6A00;background:#FFF8F2}.nlist svg{width:18px;height:18px;flex:0 0 auto;color:#FF6A00}.nlist em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3)}
.chat{display:flex;flex-direction:column;min-height:calc(100dvh - 140px);padding-bottom:120px}
.chatprod{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.chatprod img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#F4F4F4}.chatprod strong{display:block;font-size:13.5px}.chatprod b{font-size:13px;color:#FF6A00}.chatprod svg{width:16px;height:16px}
.msgs{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.msg{max-width:80%;align-self:flex-start;display:flex;flex-direction:column;gap:2px}
.msg span{background:#F1F1F1;padding:9px 12px;border-radius:16px 16px 16px 4px;font-size:14.5px;line-height:1.4;word-break:break-word}
.msg em{font-style:normal;font-size:10.5px;color:var(--ink-3);padding:0 6px}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.me span{background:#FF6A00;color:#fff;border-radius:16px 16px 4px 16px}
.quick{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 58px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;padding:6px 12px;background:linear-gradient(0deg,#fff 70%,transparent);scrollbar-width:none;z-index:30}
.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;padding:8px 12px;background:#fff;border-top:1px solid var(--line);z-index:31}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;font-size:15px;max-height:120px}
.composer button{width:42px;height:42px;border-radius:50%;background:#FF6A00;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.composer button svg{width:19px;height:19px}
body.kb .composer{bottom:0}body.kb .quick{bottom:58px}
.btn--chat{background:#111 !important;color:#fff !important;border-color:#111 !important}
.btn--chat svg{width:15px;height:15px}
a.t-small.btn--chat{background:none !important;color:#FF6A00 !important;text-decoration:underline}
/* QG */
html.qgmode #tabbar{display:none !important}
.qgbrand{display:flex;align-items:center;gap:8px}.qgbrand b{background:#111;color:#FF6A00;font-size:12px;padding:3px 8px;border-radius:6px;letter-spacing:.06em}
.qgqr{display:grid;place-items:center;margin:10px auto;width:200px;height:200px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.qgqr svg,.qgqr img{width:100%;height:100%}
.funnel>div{display:grid;grid-template-columns:120px 1fr;gap:4px 8px;align-items:center;font-size:13px;margin-bottom:9px}
.funnel i{height:12px;background:#F4F4F4;border-radius:6px;overflow:hidden}.funnel b{display:block;height:100%;background:#FF6A00}
.funnel em{grid-column:2;font-style:normal;font-size:12px;color:var(--ink-3)}

html.catlock,html.catlock body{overflow:hidden;height:100%;overscroll-behavior:none}
/* ===== PHASE 1g ===== */
.betabar{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;gap:8px;align-items:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px));background:#111;color:#fff;font-size:12px;line-height:1.35}
.betabar b{color:#FF6A00;margin-right:4px}.betabar span{flex:1}.betabar button{color:#fff;font-size:22px;line-height:1;min-width:40px;min-height:34px;margin:-6px -8px -6px 0;display:grid;place-items:center}
body.hasbeta .shell{padding-top:34px}
body.hasbeta .topbar{top:34px}
.shell.feedmode~.betabar,html.qgmode .betabar,body.inchat .betabar{display:none}
.fbbtn{position:fixed;right:10px;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:6px;align-items:center;background:#FF6A00;color:#fff;font-weight:700;font-size:12.5px;padding:9px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(255,106,0,.35)}
.fbbtn svg{width:16px;height:16px}
body.inchat .fbbtn,body.kb .fbbtn,html.qgmode .fbbtn,body.nofb .fbbtn{display:none}
#fbS{margin-top:6px}#fbS button{color:#ddd}#fbS button.on{color:#FF6A00}
.micbtn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:#F4F4F4;display:grid;place-items:center;color:var(--ink)}
.micbtn svg{width:17px;height:17px}.micbtn.on{background:#FF6A00;color:#fff;animation:mp 1s infinite}
@keyframes mp{50%{box-shadow:0 0 0 6px rgba(255,106,0,.25)}}
.field:has(.micbtn){position:relative}.composer .micbtn{position:static;flex:0 0 auto;width:42px;height:42px}
.gpsbtn{margin-top:8px;display:inline-flex;gap:6px;align-items:center}.gpsbtn svg{width:15px;height:15px}
.gpslink{display:inline-flex;gap:4px;align-items:center;color:#FF6A00;font-weight:700}.gpslink svg{width:14px;height:14px}
.aibtn{display:inline-flex;gap:6px;align-items:center;margin:0 0 8px;background:#111;color:#fff;border-color:#111}.aibtn svg{width:15px;height:15px;color:#FF6A00}
.aiq{background:#FFF4EC;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}.aiq ul{margin:4px 0 0;padding-left:18px}
.aientry{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,#111,#2a1a0e);color:#fff;margin:10px 0 12px}
.aientry>svg{width:24px;height:24px;color:#FF6A00;flex:0 0 auto}.aientry strong{display:block;font-size:14.5px}.aientry span span{font-size:12.5px;color:#ddd}
.aientry>svg:last-child{width:16px;height:16px;color:#fff}
.aihero{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#FFF4EC;margin-bottom:10px}
.aihero svg{width:22px;height:22px;color:#FF6A00;flex:0 0 auto}.aihero strong{display:block}.aihero span{font-size:13px;color:var(--ink-2)}
.aiprods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 8px;max-width:86%}
.aiprods a{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.aiprods img{aspect-ratio:1;object-fit:cover;width:100%;background:#F4F4F4}.aiprods span{font-size:12.5px;padding:6px 8px 0;line-height:1.3}.aiprods b{font-size:13px;color:#FF6A00;padding:2px 8px 8px}
.aiweb{display:grid;gap:4px;font-size:12.5px;max-width:86%;margin-bottom:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}.aiweb b{font-size:11.5px;color:var(--ink-3)}.aiweb a{color:#FF6A00;text-decoration:underline}
.webt{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:700;gap:2px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #ccc;border-top-color:#FF6A00;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

body.haslog .fbbtn{bottom:calc(var(--tab-h) + 86px + env(safe-area-inset-bottom,0px))}
/* ===== PHASE 1h ===== */
.alertc .card__h svg{width:18px;height:18px;color:#FF6A00}
.topicbox{display:flex;gap:8px;align-items:center;margin:6px 0 2px;flex-wrap:wrap}
.topicbox code{font:600 13px ui-monospace,monospace;background:#F4F4F4;padding:7px 10px;border-radius:8px;word-break:break-all;flex:1;min-width:0}
.verifcta{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1.5px solid #FF6A00;background:#FFF8F2;margin-bottom:14px}
.verifcta>svg{width:26px;height:26px;color:#FF6A00;flex:0 0 auto}.verifcta strong{display:block;font-size:14.5px}.verifcta span span{font-size:12.5px;color:var(--ink-2)}
.verifcta>svg:last-child{width:16px;height:16px;color:var(--ink)}
.docpick{display:flex;gap:10px;align-items:center;justify-content:center;min-height:96px;border:1.5px dashed var(--line);border-radius:12px;background:#F8F8F8;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer;overflow:hidden;position:relative}
.docpick svg{width:22px;height:22px}.docpick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.docpick img+span{position:relative;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.docs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#F4F4F4}
/* ===== PHASE 1i ===== */
.paycard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px;border-radius:14px;border:2px solid #FF6A00;background:#FFF8F2;margin:10px 0}
.paycard strong{display:block}.paycard span{font-size:12.5px;color:var(--ink-2)}
.paybtn svg{width:16px;height:16px}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dchip{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;background:#F4F4F4;color:var(--ink-2);padding:5px 9px;border-radius:999px}
.dchip svg{width:14px;height:14px}.dchip.dhot{background:#FFF1E6;color:#9A3D00}
.stbtn{display:inline-flex;gap:6px;align-items:center;margin:4px 0 10px}.stbtn svg{width:15px;height:15px}
.tcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;display:grid;gap:7px}
.tcard strong{font-size:14.5px}.tcard>div{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tcard>div span{display:flex;gap:6px;align-items:center;color:var(--ink-2)}.tcard>div svg{width:15px;height:15px;color:#FF6A00}.tcard b{text-align:right}
.humanbtn{display:inline-flex;gap:6px;align-items:center;margin:0 0 10px}.humanbtn svg{width:15px;height:15px}
/* Zones à toucher plus grandes (doigt = 40px) sans changer le dessin */
a.more,button.more{position:relative}
a.more::after,button.more::after{content:"";position:absolute;inset:-12px -8px}
.t-small a,.howsteps a{display:inline-block;padding:10px 2px;margin:-10px 0}
.dchip.ok{background:#E9F6EE;color:#1E6B3A}
/* ===== Tous les écrans : tablette et PC (30/10) ===== */
.mgrid{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))!important;max-width:none!important}
@media(min-width:600px){
  .page{max-width:1280px!important;margin-left:auto;margin-right:auto}
  .circs4{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .circs4 .ci{width:76px;height:76px}

}

  .tabbar{padding-left:max(0px,calc((100vw - 760px)/2));padding-right:max(0px,calc((100vw - 760px)/2))}

}

}

  #view.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:36px;align-items:start}

}
@media(min-width:900px){#view.pdp>.stbtn{justify-self:start;width:auto}}
body.hasbeta .shell .nav{top:34px}
/* Rien ne doit rester caché sous la barre du bas ni sous le bouton d'avis (30/10) */
.catpage.fixedcols .catmain,.catpage.fixedcols .catside{padding-bottom:calc(var(--tab-h) + 110px + env(safe-area-inset-bottom,0px))!important}
.shell:not(.feedmode) .main{padding-bottom:calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
@media(max-width:599px){
  .fbbtn{width:44px;height:44px;padding:0!important;border-radius:50%!important;justify-content:center;opacity:.92}
  .fbbtn span{display:none}
}
.paymode .pick{margin-top:8px}.paymode .pick.pmsoon{opacity:.6;pointer-events:none}
.soonb{font-style:normal;font-size:11px;font-weight:700;background:#111;color:#fff;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.pnumrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pnumrow select{flex:0 0 auto;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.pnumrow .tel{flex:1 1 160px}
.paymode.bad>label{color:var(--red)}.paymode.bad>.err{display:block}.paymode.bad .pick:not(.pmsoon){border-color:var(--red)}
.nores{display:flex;gap:10px;align-items:flex-start;margin-top:10px;background:#FDECEA;color:#8A1F17;border:1px solid #F5C2BD;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.4}
.nores svg{flex:0 0 18px;width:18px;height:18px;margin-top:1px}
.dchip.warn{background:#FFF4E5;color:#8A4B00}
.pnumwrap{display:none;margin:8px 0 0 30px;padding:10px 12px;border-left:3px solid #FF6A00;background:#FFF8F2;border-radius:0 10px 10px 0}
.pnumwrap.on{display:block}.pnumlab{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pnumwrap .pnumrow{margin-top:6px}.field.bad .pnumwrap .err,.pnumwrap.bad .err{display:block}
/* « + » panier sur les cartes */
.mgrid .pcard__b{position:relative}
.qplus{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;transition:transform .15s}
.qplus svg{width:16px;height:16px}.qplus:active{transform:scale(.86)}.qplus.done{background:#1E8A4C}
.mgrid .pcard__b .pc-sh{padding-right:36px}
.qpk{display:grid;gap:8px}.qpk button{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left}
.qpk button span{flex:1}.qpk button.on{border-color:#111;box-shadow:inset 0 0 0 1px #111}.qpk i{width:18px;height:18px;border-radius:50%;flex:0 0 18px;border:1px solid rgba(0,0,0,.1)}
.shipmode .pick{margin-top:8px}.shipfee{display:none;margin:8px 0 0 30px}.shipfee.on{display:block}.shipfee input{max-width:220px}
.colrow{display:flex;gap:8px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}.colrow::-webkit-scrollbar{display:none}
.colrow a{flex:0 0 auto;width:64px;text-align:center;font-size:11.5px;color:var(--ink-2)}
.colrow a img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent;display:block;background:#F4F4F4}
.colrow a.on img{border-color:#111}.colrow a span{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhd{font-size:13px;font-weight:700;margin-top:6px}
.pfcard{margin:12px 0;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:grid;gap:10px}
.pfcard__t strong{display:block;font-size:15px}.pfcard__t span{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.pfcard__c{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pfcode{font-family:var(--ff-d);font-size:30px;font-weight:800;letter-spacing:2px}
.pfcard__a{display:flex;gap:8px;flex-wrap:wrap}
.pfin{display:flex;gap:8px}.pfin input{flex:1;font-size:22px;letter-spacing:4px;text-align:center;min-height:48px;border:1px solid var(--line);border-radius:12px}
.pflab{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}.pfcode{display:block}.pfwarn{display:block;font-size:11.5px;color:#B3261E;margin-top:2px}
.pflink{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.pflink>span{flex:1}.pflink strong{display:block;font-size:14px}.pflink span span{font-size:12.5px;color:var(--ink-3)}.pflink svg{width:20px;height:20px;flex:0 0 20px}
/* titres vendeurs */
.lvchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;background:#F2F2F2;color:#333;vertical-align:middle;margin-left:6px}
.lvchip svg{width:12px;height:12px}.lvchip.lv2{background:#EAF3FF;color:#1F4E8C}.lvchip.lv3{background:#E9F6EE;color:#1E6B3A}.lvchip.lv4{background:#FFF1E6;color:#9A3D00}
.lvchip.lv5{background:#F3E8FF;color:#5B21B6}.lvchip.lv6{background:#111;color:#fff}.lvchip.lv7{background:linear-gradient(90deg,#FF6A00,#FFB000);color:#111}
.lvcard{margin:12px 0;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.lvcard.legend{border-color:#FF6A00;box-shadow:0 6px 24px -12px rgba(255,106,0,.6)}
.lvcard__h{display:flex;align-items:center;justify-content:space-between;gap:8px}.lvcard__h .lvchip{margin-left:0;font-size:13px;padding:5px 10px}
.lvladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.lvladder i{height:6px;border-radius:3px;background:#EEE}.lvladder i.on{background:#FF6A00}
.lvbar{height:6px;border-radius:3px;background:#EEE;margin-top:6px;overflow:hidden}.lvbar span{display:block;height:100%;background:#111}
.lvwhy{margin-top:8px;color:var(--ink-3)}

.boot{background:#fff !important;align-items:center}
.splash{display:flex;flex-direction:column;align-items:center;gap:12px;animation:spIn .5s var(--ease) both}
.splash img{width:84px;height:84px;border-radius:20px}
.splash .brand{font-size:30px}
@keyframes spIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="boot" id="boot"><div class="boot__in"><p class="t-small boot__msg">Chargement…</p></div></div>

<div class="shell hidden" id="shell">
  <div id="netbar"></div>
  <header class="topbar" id="topbar"></header>
  <nav class="nav hidden" id="nav" aria-label="Espace vendeur"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main"><div class="page" id="view"></div></main>
</div>

<nav class="tabbar hidden" id="tabbar" aria-label="Navigation principale"></nav>

<section class="wiz" id="wiz">
  <div class="wiz__top"><div class="wiz__topin">
    <div class="brand" id="wizBrand">VAlex<i>.</i></div><span class="wiz__count" id="wizCount"></span>
  </div></div>
  <div class="wiz__bar"><i id="wizBar"></i></div>
  <div class="wiz__body"><div class="wiz__inner">
    <div class="wiz__card" id="wizCard"></div>
    <p style="text-align:center;margin-top:16px"><button class="btn btn--ghost btn--sm" id="wizQuit">Quitter</button></p>
  </div></div>
</section>

<div class="modal" id="modal">
  <div class="modal__bg" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true">
    <h3 id="mdTitle"></h3><div class="body" id="mdBody"></div><div class="foot" id="mdFoot"></div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastTxt"></span>
</div>

function ask(o){return new Promise(res=>{
  const m=$('#modal');
  $('#mdTitle').textContent=o.title; $('#mdBody').innerHTML=o.body||'';
  $('#mdFoot').innerHTML=(o.cancel===false?'':'<button class="btn" data-a="0">'+esc(o.cancel||'Annuler')+'</button>')+
    '<button class="btn '+(o.danger?'btn--danger':'btn--pri')+'" data-a="1">'+esc(o.ok||'Confirmer')+'</button>';
  m.classList.add('on');
  const close=v=>{m.classList.remove('on');m.removeEventListener('click',h);res(v);};
  function h(e){ if(e.target.hasAttribute('data-close'))return close(false);
    const b=e.target.closest('[data-a]'); if(b)close(b.dataset.a==='1'); }
  m.addEventListener('click',h);
});}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn'); if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height), i=document.createElement('span');
  i.className='ripple';
  i.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(i); setTimeout(()=>i.remove(),620);
});
function busy(sel,on,label){
  const b=$(sel); if(!b)return;
  if(on){ b.dataset.old=b.innerHTML; b.disabled=true; b.innerHTML='<span class="spin"></span>'+(label||'…'); }
  else { b.disabled=false; if(b.dataset.old)b.innerHTML=b.dataset.old; }
}
function flashSaved(sel,l){const b=$(sel);if(!b)return;const o=b.innerHTML;b.innerHTML=l;b.classList.add('is-saved');

/* Toute erreur Supabase remonte à l'écran. Rien n'échoue en
   silence : c'est la règle la plus utile quand on débogue
   depuis un téléphone. */
function fail(err,ctx){
  console.error(ctx||'', err);
  const msg=(err&&(err.message||err.error_description))||'Erreur inconnue';
  toast((ctx?ctx+' : ':'')+msg);
  return null;
}

function imgUrl(bucket,path){
  if(!path)return null;
  if(path.indexOf('demo:')===0)return IMG[path.slice(5)]||null;

/* ==========================================================
   5. IMAGES — compression avant envoi
   Une photo de téléphone pèse 4 Mo. On ne la met pas telle
   quelle sur un réseau mobile haïtien.
   ========================================================== */
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error("Ce fichier n'est pas une image."));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Lecture impossible.'));
    fr.onload=()=>{const im=new Image();
      im.onerror=()=>rej(new Error('Image illisible.'));
      im.onload=()=>{let w=im.width,h=im.height;const r=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*r);h=Math.round(h*r);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('Conversion impossible.')),'image/jpeg',q);};
      im.src=fr.result;};
    fr.readAsDataURL(file);});
}
async function upload(bucket,file,max,q){
  const blob=await shrink(file,max,q);
  const path=S.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
  const {error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error)throw error;
  return path;
}

async function fetchCatalog(opts){
  opts=opts||{};
  let q=sb.from('catalog_products').select('*').order('published_at',{ascending:false,nullsFirst:false}).limit(opts.limit||60);
  if(opts.rayon)q=q.eq('rayon_slug',opts.rayon);
  if(opts.sub)q=q.eq('category_slug',opts.sub);
  if(opts.shop)q=q.eq('shop_slug',opts.shop);
  if(opts.text)q=q.or('title.ilike.%'+opts.text+'%,description.ilike.%'+opts.text+'%');
  if(opts.city)q=q.eq('shop_city',opts.city);
  if(opts.inStock)q=q.gt('total_stock',0);
  if(opts.maxPrice)q=q.lte('min_price_cents',opts.maxPrice);
  const {data,error}=await q;
  if(error){fail(error,'Catalogue');return [];}
  return data||[];
}

  /* ---------- FICHE PRODUIT ---------- */
  async product(id){
    topbar('back',{title:'Produit'});
    this.set('<div class="sk" style="aspect-ratio:1;border-radius:12px"></div><div class="sk sk-line" style="width:70%;margin-top:14px;height:22px"></div><div class="sk sk-line" style="width:40%"></div>');
    const {data:p,error}=await sb.from('products')
      .select('*, shops(*), categories!products_category_id_fkey(*), product_variants(*), product_images(*)')
      .eq('id',id).maybeSingle();
    if(error||!p){fail(error||new Error('Produit introuvable'),'Produit');go('#/');return;}
    const shop=p.shops||{}, cat=p.categories||{};
    const variants=(p.product_variants||[]).sort((a,b)=>a.position-b.position);
    const images=(p.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.position-b.position));
    const prof=profOf(cat);
    let sel=variants.find(v=>v.stock>0)||variants[0]||null;

    const {data:del}=await sb.from('shop_delivery').select('*').eq('shop_id',shop.id).maybeSingle();
    const {data:pay}=await sb.from('shop_payment').select('*').eq('shop_id',shop.id).maybeSingle();
    const dText=del?({included:'Livraison incluse dans le prix',separate:'Livraison en supplément : '+gds(del.fee_cents),
      pickup:'Retrait sur place uniquement',zones:'Frais selon la zone, à partir de '+gds(del.fee_cents)})[del.mode]:'À convenir avec le vendeur';
    const pays=[]; if(pay){ if(pay.cash_on_delivery)pays.push('Espèces à la livraison'); if(pay.moncash)pays.push('MonCash'); if(pay.bank_transfer)pays.push('Virement'); }
    const sizes=[...new Set(variants.map(v=>v.size).filter(Boolean))];
    const colors=[...new Set(variants.map(v=>v.color).filter(Boolean))];

    const render=()=>{
      const stock=sel?sel.stock:0;
      const price=sel?sel.price_cents:p.base_price_cents;
      const mes=sel&&sel.measures?sel.measures:{};
      const rows=prof.fields.filter(([k])=>mes[k]).map(([k,l,u])=>'<tr><td>'+l+'</td><td>'+esc(mes[k])+' '+u+'</td></tr>').join('');
      this.set(
        '<div class="gal enter"><div class="gal__main" id="galMain">'+
        (images[0]?'<img src="'+prodImg(images[0].storage_path)+'" alt="">':ico('box'))+'</div>'+
        (images.length>1?'<div class="gal__thumbs">'+images.map((im,i)=>
          '<button class="'+(i===0?'on':'')+'" data-i="'+i+'"><img src="'+prodImg(im.storage_path)+'" alt=""></button>').join('')+'</div>':'')+'</div>'+

        '<h1 class="t-h1 enter" style="margin-top:16px;animation-delay:.05s">'+esc(p.title)+'</h1>'+
        '<p class="enter" style="margin-top:8px;animation-delay:.07s"><span class="price" style="font-size:26px">'+gds(price)+'</span>'+
        (p.compare_at_cents?'<span class="was" style="font-size:15px">'+gds(p.compare_at_cents)+'</span>':'')+'</p>'+
        '<div class="enter" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;animation-delay:.09s">'+
        '<span class="badge badge--draft">'+esc(p.condition)+'</span>'+
        '<span class="badge badge--draft">'+esc(cat.label||'')+'</span>'+
        (stock>0?'<span class="badge badge--live"><span class="dot"></span>'+stock+' disponible'+(stock>1?'s':'')+'</span>':'<span class="badge badge--out">Épuisé</span>')+'</div>'+

        (sizes.length?'<div class="enter" style="margin-top:16px"><strong class="t-h3">Taille</strong><div class="vpick" id="vSize">'+
          sizes.map(s=>{const av=variants.some(v=>v.size===s&&v.stock>0);
            return '<button data-size="'+esc(s)+'"'+(sel&&sel.size===s?' class="on"':'')+(av?'':' disabled')+'>'+esc(s)+'</button>';}).join('')+'</div></div>':'')+
        (colors.length?'<div class="enter" style="margin-top:14px"><strong class="t-h3">Couleur</strong><div class="vpick" id="vColor">'+
          colors.map(c=>{const av=variants.some(v=>v.color===c&&v.stock>0);
            return '<button data-color="'+esc(c)+'"'+(sel&&sel.color===c?' class="on"':'')+(av?'':' disabled')+'>'+esc(c)+'</button>';}).join('')+'</div></div>':'')+

        (p.description?'<p class="enter" style="margin-top:16px;font-size:14.5px;color:var(--ink-2);line-height:1.65;max-width:62ch">'+esc(p.description)+'</p>':'')+

        (rows?'<div class="card enter" style="margin-top:18px"><div class="card__h">'+ico('ruler')+'<h3>Mesures réelles de l\'article</h3></div>'+
          '<div class="card__b"><table class="measure-tab">'+rows+'</table>'+
          '<p class="t-small" style="margin-top:10px">Mesuré à plat par le vendeur. Comparez avec un vêtement que vous possédez déjà.</p></div></div>':'')+

        '<div class="card enter" style="margin-top:14px"><div class="card__h">'+ico('truck')+'<h3>Livraison et paiement</h3></div>'+
        '<div class="card__b"><table class="measure-tab">'+
        '<tr><td>Livraison</td><td>'+esc(dText)+'</td></tr>'+
        (del&&del.delay_label?'<tr><td>Délai annoncé</td><td>'+esc(del.delay_label)+'</td></tr>':'')+
        (del&&del.zones?'<tr><td>Zones</td><td>'+esc(del.zones)+'</td></tr>':'')+
        (pays.length?'<tr><td>Paiement</td><td>'+esc(pays.join(', '))+'</td></tr>':'')+
        '</table><p class="t-small" style="margin-top:10px">VAlex Boutique ne livre pas et n\'encaisse pas. Tout se règle directement avec le vendeur.</p></div></div>'+

        '<div style="margin-top:14px" class="enter"><a class="shopline" href="#/boutique/'+esc(shop.slug||'')+'">'+
        '<span class="av">'+(shopImg(shop.logo_url)?'<img src="'+shopImg(shop.logo_url)+'" alt="">':esc((shop.name||'B')[0]))+'</span>'+
        '<span style="flex:1;min-width:0"><strong style="display:block;font-size:14.5px">'+esc(shop.name||'')+'</strong>'+
        '<span class="t-small">'+esc(shop.city||'')+' · voir la boutique</span></span>'+
        '<span style="color:var(--ink-3);transform:rotate(180deg)">'+ico('back',2.2)+'</span></a></div>'+

        '<div class="btn-row" style="margin-top:14px">'+
        '<button class="btn btn--sm" id="favBtn">'+ico('heart')+'Favori</button>'+
        '<button class="btn btn--sm btn--ghost" id="repBtn">'+ico('flag')+'Signaler</button></div>'+

        '<div class="buybar"><div class="p"><div class="price" style="font-size:18px">'+gds(price)+'</div>'+
        '<div class="t-small">'+(stock>0?'Vendu par '+esc(shop.name||''):'Article épuisé')+'</div></div>'+
        '<button class="btn btn--mango btn--lg" id="addCart"'+(stock>0?'':' disabled')+'>Ajouter au panier</button></div>');

      $$('.gal__thumbs button').forEach(b=>b.onclick=()=>{
        $('#galMain').innerHTML='<img src="'+prodImg(images[b.dataset.i].storage_path)+'" alt="">';
        $$('.gal__thumbs button').forEach(x=>x.classList.toggle('on',x===b));});
      $$('#vSize button').forEach(b=>b.onclick=()=>{
        const nv=variants.find(v=>v.size===b.dataset.size&&(!sel||!sel.color||v.color===sel.color)&&v.stock>0)
              ||variants.find(v=>v.size===b.dataset.size&&v.stock>0);
        if(nv){sel=nv;render();}});
      $$('#vColor button').forEach(b=>b.onclick=()=>{
        const nv=variants.find(v=>v.color===b.dataset.color&&(!sel||!sel.size||v.size===sel.size)&&v.stock>0)
              ||variants.find(v=>v.color===b.dataset.color&&v.stock>0);
        if(nv){sel=nv;render();}});
      const ac=$('#addCart'); if(ac)ac.onclick=()=>{
        if(!sel)return toast('Choisissez une variante.');
        const line=S.cart.find(x=>x.variantId===sel.id);
        if(line&&line.qty>=sel.stock)return toast('Stock maximum atteint.');
        cartAdd(sel.id,1); topbar('back',{title:'Produit'}); toast('Ajouté au panier.');};
      $('#favBtn').onclick=async ()=>{
        if(!S.user)return toast('Connectez-vous pour garder vos favoris.');
        const {error}=await sb.from('favorites').upsert({user_id:S.user.id,product_id:p.id});
        if(error)return fail(error,'Favori');
        toast('Ajouté à vos favoris.');};
      $('#repBtn').onclick=()=>reportDialog('product',p.id);
    };
    render();
  },
