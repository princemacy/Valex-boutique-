  /* ---------- PANIER ---------- */
  async cart(){
    topbar('back',{title:'Panier'});
    if(!S.cart.length){
      this.set('<div class="card enter"><div class="empty"><div class="empty__ic">'+ico('cart')+'</div>'+
        '<h3>Votre panier est vide</h3><p>Parcourez les rayons et ajoutez ce qui vous plaît. Aucun compte n\'est nécessaire pour regarder.</p>'+
        '<a class="btn btn--pri" href="#/explorer">Voir les articles</a></div></div>');
      return;
    }
    this.set(skeleton(2));
    const ids=S.cart.map(l=>l.variantId);
    const {data:vs,error}=await sb.from('product_variants')
      .select('*, products(id,title,status,shop_id, shops(id,name,slug,city), product_images(storage_path,is_primary,position))')
      .in('id',ids);
    if(error){fail(error,'Panier');return;}
    /* On retire silencieusement les lignes dont le produit a été
       dépublié ou supprimé entre-temps. */
    const valid=(vs||[]).filter(v=>v.products&&v.products.status==='published');
    if(valid.length!==S.cart.length){
      S.cart=S.cart.filter(l=>valid.some(v=>v.id===l.variantId)); saveCart(); paintTabbar();
    }
    if(!S.cart.length){ this.cart(); return; }

    const groups={};
    valid.forEach(v=>{
      const sh=v.products.shops;
      (groups[sh.id]=groups[sh.id]||{shop:sh,items:[]}).items.push(v);
    });
    const shopIds=Object.keys(groups);
    const {data:dels}=await sb.from('shop_delivery').select('*').in('shop_id',shopIds);
    let sub=0, ship=0;
    Object.values(groups).forEach(g=>{
      g.items.forEach(v=>{ const q=S.cart.find(x=>x.variantId===v.id).qty; sub+=v.price_cents*q; });
      const d=(dels||[]).find(x=>x.shop_id===g.shop.id);
      g.ship=(d&&(d.mode==='separate'||d.mode==='zones'))?d.fee_cents:0;
      g.mode=d?d.mode:'separate';
      ship+=g.ship;
    });

    this.set('<h1 class="t-h1 enter">Panier</h1>'+
      '<p class="t-sub enter" style="margin-top:4px">'+valid.length+' article'+(valid.length>1?'s':'')+' chez '+shopIds.length+' vendeur'+(shopIds.length>1?'s':'')+'</p>'+
      Object.values(groups).map((g,gi)=>{
        return '<div class="card enter" style="margin-top:14px;animation-delay:'+(.05+gi*.05)+'s">'+
        '<div class="card__h"><h3>'+esc(g.shop.name)+'</h3><span class="t-small" style="margin-left:auto">'+esc(g.shop.city)+'</span></div>'+
        '<div class="card__b" style="display:grid;gap:10px">'+
        g.items.map(v=>{
          const q=S.cart.find(x=>x.variantId===v.id).qty;
          const im=(v.products.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.position-b.position))[0];
          const label=[v.size,v.color].filter(Boolean).join(' · ');
          return '<div class="citem"><span class="citem__img">'+(im?'<img src="'+prodImg(im.storage_path)+'" alt="">':'')+'</span>'+
          '<span class="citem__b"><strong>'+esc(v.products.title)+'</strong>'+
          (label?'<span class="t-small">'+esc(label)+'</span>':'')+
          '<span class="t-small">'+gds(v.price_cents)+' · stock '+v.stock+'</span></span>'+
          '<span class="qty"><button data-m="'+v.id+'">−</button><span>'+q+'</span><button data-pl="'+v.id+'" data-max="'+v.stock+'">+</button></span></div>';
        }).join('')+'</div>'+
        '<div class="card__f"><span class="t-small">Livraison : '+(g.ship?gds(g.ship):(g.mode==='pickup'?'retrait sur place':'incluse'))+'</span></div></div>';
      }).join('')+
      '<div class="card enter" style="margin-top:14px"><div class="card__b">'+
      '<div class="sumline"><span>Articles</span><span>'+gds(sub)+'</span></div>'+
      '<div class="sumline"><span>Livraison estimée</span><span>'+gds(ship)+'</span></div>'+
      '<div class="sumline total"><span>Total</span><b>'+gds(sub+ship)+'</b></div>'+
      '<button class="btn btn--mango btn--wide btn--lg" id="checkout" style="margin-top:14px">Passer la commande</button>'+
      '<p class="t-small" style="margin-top:10px;text-align:center">Chaque vendeur livre et encaisse sa propre commande.</p></div></div>');

    $$('[data-pl]').forEach(b=>b.onclick=()=>{
      const l=S.cart.find(x=>x.variantId===b.dataset.pl);
      if(l.qty>=Number(b.dataset.max))return toast('Stock maximum atteint.');
      l.qty++; saveCart(); paintTabbar(); this.cart();});
    $$('[data-m]').forEach(b=>b.onclick=()=>{
      const l=S.cart.find(x=>x.variantId===b.dataset.m);
      l.qty--; if(l.qty<=0)S.cart=S.cart.filter(x=>x.variantId!==b.dataset.m);
      saveCart(); paintTabbar(); this.cart();});
    $('#checkout').onclick=async ()=>{
      if(!S.user){
        if(await ask({title:'Connectez-vous pour commander',
          body:'<p>Vous pouvez regarder librement, mais un compte est nécessaire pour envoyer une commande à un vendeur.</p>',
          ok:'Créer un compte',cancel:'Plus tard'}))go('#/compte');
        return;
      }
      go('#/commander');
    };
  },

        '<button class="rayon" id="newSeller"><span class="ic">'+ico('shop')+'</span><span><strong>Compte vendeur</strong><span>Ouvrir votre boutique</span></span></button></div>'+

  async dash(){
    const {data:ps}=await sb.from('products').select('id,status,title').eq('shop_id',S.shop.id);
    const {data:vs}=await sb.from('product_variants').select('stock,price_cents,product_id');
    const mine=(ps||[]).map(p=>p.id);
    const myVars=(vs||[]).filter(v=>mine.includes(v.product_id));
    const live=(ps||[]).filter(p=>p.status==='published');
    const out=mine.filter(id=>{const g=myVars.filter(v=>v.product_id===id);return g.length&&g.every(v=>v.stock===0);});
    const val=myVars.reduce((t,v)=>t+v.price_cents*v.stock,0);
    const {data:sub}=await sb.from('subscriptions').select('*').eq('shop_id',S.shop.id).maybeSingle();
    const {data:del}=await sb.from('shop_delivery').select('*').eq('shop_id',S.shop.id).maybeSingle();
    const {data:pay}=await sb.from('shop_payment').select('*').eq('shop_id',S.shop.id).maybeSingle();
    const tasks=[
      {d:!!S.shop.logo_url,t:'Ajouter le logo de la boutique',x:'Une boutique sans image inspire moins confiance.',g:'#/ma-boutique'},
      {d:(ps||[]).length>0,t:'Publier un premier produit',x:'Sans produit, votre page publique est vide.',g:'#/produits/nouveau'},
      {d:(ps||[]).length>=5,t:'Atteindre 5 produits',x:'En dessous de cinq articles, les visiteurs repartent.',g:'#/produits/nouveau'},
      {d:!!del,t:'Régler vos conditions de livraison',x:'Chaque produit en hérite.',g:'#/livraison'},
      {d:!!(pay&&(pay.cash_on_delivery||pay.moncash||pay.bank_transfer)),t:'Choisir vos moyens de paiement',x:'Les acheteurs veulent savoir comment payer.',g:'#/paiement'}];
    const rest=tasks.filter(t=>!t.d).length;
    const left=sub?Math.max(0,Math.ceil((new Date(sub.expires_at)-Date.now())/864e5)):0;
    this.set('<div class="phead enter"><div class="phead__t"><h1>Bonjour '+esc((S.profile||{}).first_name||'')+'</h1>'+
      '<p>'+(rest?'Il reste '+rest+' chose'+(rest>1?'s':'')+' à régler.':'Votre boutique est complète. Faites-la connaître.')+'</p></div>'+
      '<a class="btn btn--pri" href="#/produits/nouveau">Ajouter un produit</a></div>'+
      '<div class="stats enter">'+
      '<div class="stat accent"><b data-count="'+(ps||[]).length+'">0</b><span>Produits enregistrés</span></div>'+
      '<div class="stat"><b data-count="'+live.length+'">0</b><span>Visibles par les clients</span></div>'+
      '<div class="stat"><b data-count="'+out.length+'">0</b><span>En rupture</span></div>'+
      '<div class="stat"><b data-money="'+val+'">0</b><span>Valeur du stock</span></div></div>'+
      '<div class="card enter" style="margin-top:16px"><div class="card__h"><h3>Mise en route</h3>'+
      '<span class="badge '+(rest?'badge--warn':'badge--live')+'">'+(tasks.length-rest)+' sur '+tasks.length+'</span></div>'+
      tasks.map(t=>'<a class="task '+(t.d?'done':'')+'" href="'+t.g+'">'+
        '<span class="task__box"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>'+
        '<span class="task__t"><strong>'+esc(t.t)+'</strong><span>'+esc(t.x)+'</span></span></a>').join('')+'</div>'+
      (sub?'<div class="card enter" style="margin-top:16px"><div class="card__b">'+
        '<span class="badge badge--live"><span class="dot"></span>Offre de lancement</span>'+
        '<p class="t-sub" style="margin-top:10px">Gratuit encore '+left+' jours. Aucune commission sur vos ventes.</p></div></div>':'')+
      '<div class="card enter" style="margin-top:16px"><div class="card__b">'+
      '<p class="t-small" style="margin-bottom:12px">Page publique : <strong>/'+esc(S.shop.slug)+'</strong></p>'+
      '<a class="btn btn--pri btn--sm" href="#/boutique/'+esc(S.shop.slug)+'">Voir ma boutique comme un client</a></div></div>');
    countUp();
  },

  },

  /* ---------- FORMULAIRE PRODUIT ---------- */
  async productForm(id){
    let p=null, variants=[], images=[];

      const {data,error}=await sb.from('products')
        .select('*, product_variants(*), product_images(*)').eq('id',id).maybeSingle();

      variants=(data.product_variants||[]).sort((a,b)=>a.position-b.position);

    }
    const d={
      title:p?p.title:'', description:p?(p.description||''):'',
      category_id:p?p.category_id:(subsOf(S.rayons[0].id)[0]||{}).id,
      condition:p?p.condition:'Très bon état', audience:p?(p.audience||''):'', occasions:p?(p.occasions||[]):[], age_group:p?(p.age_group||''):'', kid_gender:p?(p.kid_gender||''):'', plus_size:p?!!p.plus_size:false,
      has_variants:p?p.has_variants:false,
      price:p?fromCents(p.base_price_cents):'',
      compare:p&&p.compare_at_cents?fromCents(p.compare_at_cents):'',
      status:p?p.status:'draft',
      vars: p ? variants.map(v=>({id:v.id,size:v.size||'',color:v.color||'',price:fromCents(v.price_cents),lot3:v.lot3_cents?fromCents(v.lot3_cents):'',lot12:v.lot12_cents?fromCents(v.lot12_cents):'',stock:v.stock,measures:v.measures||{},open:false}))
              : [{id:null,size:'',color:'',price:'',lot3:'',lot12:'',stock:1,measures:{},open:true}],
      imgs: images.map(i=>({id:i.id,path:i.storage_path,is_primary:i.is_primary,color:i.color||''})), barcode:p?(p.barcode||''):'',
      video: p?p.video_path:null, pay: p?(p.pay_mode||(p.cod_ok===false?'before':'cod')):null, pnet:'moncash', pnum:'', colorLabel:p?(p.color_label||''):'', group:p?(p.group_id||null):null, ship:p?(p.ship_mode||'shop'):'shop', shipFee:p&&p.ship_fee_cents!=null?fromCents(p.ship_fee_cents):'',
      removedVars:[], removedImgs:[]
    };
    let tab='info';
    const cat=()=>S.subs[d.category_id]||{};
    const prof=()=>profOf(cat());
    const cols=()=>[...new Set(d.vars.map(v=>v.color).filter(Boolean))];
    const rayonOf=cid=>{const c=S.subs[cid];return c?S.subs[c.parent_id]:null;};

    this.set('<div class="phead enter"><div class="phead__t"><h1>'+(p?'Modifier le produit':'Nouveau produit')+'</h1>'+
      '<p>'+(p?'Modifié le '+new Date(p.updated_at).toLocaleDateString('fr-FR'):'Plus la fiche est précise, moins vous aurez de retours.')+'</p></div>'+
      '<a class="btn btn--ghost" href="#/produits">Retour</a></div>'+
      '<div class="card enter" style="margin-bottom:14px"><div class="card__b">'+
      '<div class="gauge"><div class="gauge__track"><div class="gauge__fill" id="gF"></div></div><span class="gauge__n" id="gN">0%</span></div>'+
      '<p class="t-small" style="margin-top:8px" id="gT"></p></div></div>'+
      '<div class="tabs" role="tablist">'+
      '<button role="tab" aria-selected="true" data-t="info">L\'article</button>'+
      '<button role="tab" aria-selected="false" data-t="var">Variantes et stock</button>'+
      '<button role="tab" aria-selected="false" data-t="pho">Photos</button></div>'+
      '<div class="card enter"><div class="card__b" id="tb"></div>'+
      '<div class="card__f"><button class="btn btn--pri" id="pub">'+(d.status==='published'?'Enregistrer':'Publier')+'</button>'+
      '<button class="btn" id="drf">Garder en brouillon</button>'+
      (p?'<button class="btn" id="dupC">'+ico('plus',2)+'Autre couleur</button>':'')+
      (p?'<button class="btn btn--danger" id="del" style="margin-left:auto">Supprimer</button>':'')+'</div></div>');
    if(p&&$('#dupC'))$('#dupC').onclick=()=>dupColor(p.id);

    const val=s=>{const e=$(s);return e?e.value:'';};

    function collect(){
      if(tab==='info'){
        d.title=val('#pT'); d.category_id=val('#pS')||d.category_id; d.condition=val('#pE'); d.audience=val('#pA'); if($('#pBar'))d.barcode=val('#pBar').replace(/\D/g,''); if($('#pOcc')){d.occasions=$$('#pOcc input:checked').map(x=>x.value);} if($('#pAge'))d.age_group=val('#pAge'); if($('#pKg'))d.kid_gender=val('#pKg'); if($('#pPlus'))d.plus_size=$('#pPlus').checked;
        d.price=val('#pP'); d.description=val('#pD');
        { const r=document.querySelector('input[name=pmode]:checked'); if(r)d.pay=r.value; if($('#pNet'))d.pnet=$('#pNet').value; if($('#pNum'))d.pnum=$('#pNum').value.replace(/\D/g,''); }
        { const r=document.querySelector('input[name=shipm]:checked'); if(r)d.ship=r.value; if($('#pShip'))d.shipFee=$('#pShip').value; if($('#pCol'))d.colorLabel=$('#pCol').value.trim(); }
      } else if(tab==='var'){
        d.has_variants=$('#hv')?$('#hv').checked:d.has_variants;
        d.vars.forEach((v,i)=>{
          const g=k=>{const e=$('#v'+i+'_'+k);return e?e.value:undefined;};
          if(g('size')!==undefined)v.size=g('size');
          if(g('color')!==undefined)v.color=g('color');
          if(g('price')!==undefined)v.price=g('price');
          if(g('stock')!==undefined)v.stock=g('stock'); if(g('lot3')!==undefined)v.lot3=g('lot3'); if(g('lot12')!==undefined)v.lot12=g('lot12');
          prof().fields.forEach(([k])=>{const e=$('#v'+i+'_m_'+k); if(e)v.measures[k]=e.value;});
        });
      }
    }

    function score(){
      const f=prof().fields;
      const anyMes=d.vars.some(v=>f.some(([k])=>v.measures[k]));
      const allMes=d.vars.every(v=>f.every(([k])=>v.measures[k]));
      const has=[!!String(d.title).trim(), Number(d.price)>0, d.imgs.length>0, d.imgs.length>=2,
        !!String(d.description).trim(), !f.length||anyMes, !f.length||allMes, d.vars.some(v=>Number(v.stock)>0)];
      const n=Math.round(has.filter(Boolean).length/has.length*100);
      const gf=$('#gF'); if(gf){gf.style.width=n+'%'; $('#gN').textContent=n+'%';}
      const tips=[];
      if(!d.imgs.length)tips.push('ajoutez une photo'); else if(d.imgs.length<2)tips.push('une deuxième photo rassure');
      if(f.length&&!allMes)tips.push('complétez les mesures');
      if(!String(d.description).trim())tips.push('écrivez deux lignes de description');
      if(!d.vars.some(v=>Number(v.stock)>0))tips.push('indiquez au moins une quantité');
      const gt=$('#gT'); if(gt)gt.textContent=tips.length?'Pour aller plus loin : '+tips.join(', ')+'.':'Fiche complète.';
    }

    const T={
      info:()=>{
        const r=rayonOf(d.category_id)||S.rayons[0];
        return '<div class="field"><label for="pT">Nom du produit <span class="req">*</span></label>'+
        '<input type="text" id="pT" value="'+esc(d.title)+'" placeholder="Chemise en lin bleu ciel"><div class="err">Donnez un nom clair.</div>'+
        '<div class="hint">Décrivez ce que c\'est, pas ce que vous en pensez.</div></div>'+
        '<div class="field"><label for="pBar">Code-barres <span class="opt">— remplit la fiche tout seul</span></label><div class="barrow"><input id="pBar" inputmode="numeric" value="'+esc(d.barcode||'')+'" placeholder="Scannez ou tapez les chiffres">'+
        '<button class="btn btn--sm" id="scanBtn" type="button">'+ico('image')+'Scanner</button></div><div class="hint" id="barH">Parfums, crèmes, lait, téléphones en boîte : scannez, on remplit le nom et la marque.</div></div>'+
        '<div class="field"><label for="pR">Rayon <span class="req">*</span></label><select id="pR">'+
        S.rayons.map(x=>'<option value="'+x.id+'"'+(x.id===r.id?' selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select></div>'+
        '<div class="field"><label for="pS">Sous-rayon <span class="req">*</span></label><select id="pS"></select>'+
        '<div class="hint" id="profH"></div><div class="hint">Choisissez bien : c\'est là que les clients chercheront. VAlex peut corriger une catégorie mal choisie.</div></div>'+
        '<div class="field"><label for="pE">État <span class="req">*</span></label><select id="pE">'+
        CONDITIONS.map(x=>'<option'+(x===d.condition?' selected':'')+'>'+x+'</option>').join('')+'</select></div>'+
        '<div class="field"><label for="pA">Pour qui ?</label><select id="pA"><option value="">Choisir…</option>'+
        [['femme','Femme'],['homme','Homme'],['enfant','Enfant'],['mixte','Tout le monde']].map(([k,l])=>'<option value="'+k+'"'+(k===d.audience?' selected':'')+'>'+l+'</option>').join('')+
        '</select><div class="hint">Sert aux onglets Femmes, Hommes, Enfants de l\'accueil.</div></div>'+
        '<details class="moreopt"><summary>Plus d\'options <span class="opt">— facultatif</span></summary><p class="t-small" style="margin:6px 0 12px">L\'occasion fait apparaître l\'article dans les tuiles Travail, Église, Fête… des onglets Femmes et Hommes. L\'âge et fille/garçon servent à l\'onglet Enfants.</p>'+
        '<div class="field"><label>Occasions <span class="opt">— facultatif</span></label><div class="occsel" id="pOcc">'+OCCASIONS.map(([k,l])=>'<label><input type="checkbox" value="'+k+'"'+((d.occasions||[]).includes(k)?' checked':'')+'>'+l+'</label>').join('')+'</div></div>'+
        '<div class="row2"><div class="field"><label for="pAge">Âge (enfants)</label><select id="pAge"><option value="">—</option>'+AGES.map(([k,l])=>'<option value="'+k+'"'+(k===d.age_group?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
        '<div class="field"><label for="pKg">Fille ou garçon</label><select id="pKg"><option value="">—</option>'+[['fille','Fille'],['garcon','Garçon'],['mixte','Les deux']].map(([k,l])=>'<option value="'+k+'"'+(k===d.kid_gender?' selected':'')+'>'+l+'</option>').join('')+'</select></div></div>'+
        '<label class="check" style="margin-bottom:6px"><input type="checkbox" id="pPlus"'+(d.plus_size?' checked':'')+'> <span>Existe en grande taille</span></label></details>'+
        '<div class="row2"><div class="field"><label for="pP">Prix en HTG <span class="req">*</span></label>'+
        '<input type="number" id="pP" min="0" step="25" value="'+esc(d.price)+'" inputmode="decimal" placeholder="2500"><div class="err">Prix supérieur à zéro.</div></div>'+
        '<div class="field"><label>Prix barré</label><div class="hint" style="margin-top:4px">Automatique : il apparaît si vous baissez votre prix, une seule fois, après 7 jours au prix d\'origine.</div></div></div>'+
        '<div class="field" style="margin-bottom:0"><label for="pD">Description</label>'+
        '<textarea id="pD" placeholder="Matière, coupe, défauts éventuels…">'+esc(d.description)+'</textarea>'+
        '<div class="hint">Signalez les défauts. Un acheteur prévenu ne réclame pas.</div></div>'+colorLabelHTML(d)+payModeHTML(d)+shipHTML(d);
      },
      var:()=>{
        const f=prof().fields;
        return '<label class="pick '+(d.has_variants?'on':'')+'" style="margin-bottom:14px">'+
        '<input type="checkbox" id="hv"'+(d.has_variants?' checked':'')+'>'+
        '<span><strong>Cet article existe en plusieurs tailles ou couleurs</strong>'+
        '<span>Chaque combinaison taille × couleur a son propre stock et son propre prix. Laissez décoché pour une pièce unique.</span></span></label>'+
        (d.has_variants?builderHtml(d,(prof().sizes||SIZES).concat(d._extraSizes||[])):'')+
        '<div id="vlist">'+d.vars.map((v,i)=>vrow(v,i,f)).join('')+'</div>'+
        (d.has_variants?'<button class="btn btn--sm" id="addVar">+ Ajouter une variante</button>':'')+
        (f.length?'<p class="t-small" style="margin-top:12px">Mesurez l\'article posé à plat, sans l\'étirer. C\'est ce que l\'acheteur comparera à un vêtement qu\'il possède déjà.</p>':'');
      },
      pho:()=>'<p class="t-small" style="margin-bottom:12px">Jusqu\'à 8 photos. La première sert de vignette. Fond clair, lumière du jour, l\'article seul. La vidéo se publie depuis l\'onglet Vidéos.</p>'+
        (cols().length>1?'<div class="field"><label for="pColFor">Les prochaines photos sont pour la couleur</label><select id="pColFor"><option value="">Toutes les couleurs</option>'+cols().map(c=>'<option'+(c===(window.__photoColor||'')?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="hint">Le client verra ces photos en touchant la couleur.</div></div>':'')+
        '<div class="btn-row" style="margin-bottom:12px"><label class="btn btn--pri btn--sm" for="pCam">'+ico('image',2)+'Prendre une photo</label><label class="btn btn--sm" for="pPh">Choisir dans la galerie</label></div>'+
        '<div class="shots" id="shots"></div><input type="file" id="pPh" accept="image/*" multiple class="sr"><input type="file" id="pCam" accept="image/*" capture="environment" class="sr">'
    };

    function vrow(v,i,f){
      return '<div class="vrow" data-i="'+i+'">'+
        (d.has_variants?'<div class="vrow__top">'+
          '<div class="field"><label for="v'+i+'_size">Taille</label>'+
          '<input list="szl" type="text" id="v'+i+'_size" value="'+esc(v.size)+'" placeholder="M"></div>'+
          '<div class="field"><label for="v'+i+'_color">Couleur</label>'+
          '<select id="v'+i+'_color"><option value="">Couleur…</option>'+COLORS.map(([n,h])=>'<option'+(n===v.color?' selected':'')+'>'+n+'</option>').join('')+'</select></div>'+
          (d.vars.length>1?'<button class="vrow__x" data-rm="'+i+'" aria-label="Retirer">×</button>':'<span></span>')+
        '</div>':'')+
        '<div class="vrow__num">'+
        '<div class="field"><label for="v'+i+'_price">Prix HTG</label>'+
        '<input type="number" id="v'+i+'_price" min="0" step="25" value="'+esc(v.price)+'" inputmode="decimal"></div>'+
        '<div class="field"><label for="v'+i+'_stock">Quantité</label>'+
        '<input type="number" id="v'+i+'_stock" min="0" step="1" value="'+esc(v.stock)+'" inputmode="numeric"></div></div>'+
        '<div class="vrow__num"><div class="field"><label for="v'+i+'_lot3">Prix pour 3 <span class="opt">— facultatif</span></label>'+
        '<input type="number" id="v'+i+'_lot3" min="0" step="25" value="'+esc(v.lot3||'')+'" inputmode="decimal" placeholder="Total des 3"></div>'+
        '<div class="field"><label for="v'+i+'_lot12">Prix pour 12 <span class="opt">— facultatif</span></label>'+
        '<input type="number" id="v'+i+'_lot12" min="0" step="25" value="'+esc(v.lot12||'')+'" inputmode="decimal" placeholder="Total des 12"></div></div>'+
        (f.length?'<button class="vrow__more" data-mes="'+i+'">'+(v.open?'Masquer les mesures':'Mesures de cette variante')+'</button>'+
          (v.open?'<div class="vrow__mes">'+f.map(([k,l,u])=>
            '<div class="field"><label for="v'+i+'_m_'+k+'">'+l+' ('+u+')</label>'+
            '<input type="number" id="v'+i+'_m_'+k+'" step="0.5" min="0" inputmode="decimal" value="'+esc(v.measures[k]||'')+'"></div>').join('')+'</div>':''):'')+
        '</div>';
    }

    function subSelect(){
      const r=S.rayons.find(x=>x.id===$('#pR').value)||S.rayons[0];
      const list=subsOf(r.id);
      if(!list.some(c=>c.id===d.category_id))d.category_id=list[0].id;
      $('#pS').innerHTML=list.map(c=>'<option value="'+c.id+'"'+(c.id===d.category_id?' selected':'')+'>'+esc(c.label)+'</option>').join('');
      $('#profH').textContent='Tailles proposées : '+(prof().sizes||SIZES).join(', ')+'.';
    }

    function shots(){
      const b=$('#shots'); if(!b)return;
      b.innerHTML=d.imgs.map((im,i)=>'<div class="shot"><img src="'+prodImg(im.path)+'" alt="">'+
        '<button class="x" data-rmi="'+i+'">×</button>'+(i===0?'<span class="main-tag">Vignette</span>':'')+
        (cols().length>1?'<select class="shotcol" data-ci="'+i+'"><option value="">Toutes couleurs</option>'+cols().map(c=>'<option'+(c===im.color?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>':'')+'</div>').join('')+
        (d.imgs.length<8?'<button class="shot shot--add" id="addShot"><span style="font-size:20px">+</span>Ajouter</button>':'');
      const a=$('#addShot'); if(a)a.onclick=()=>$('#pPh').click();
      b.querySelectorAll('[data-ci]').forEach(x=>x.onchange=()=>{d.imgs[+x.dataset.ci].color=x.value;});
      b.querySelectorAll('[data-rmi]').forEach(x=>x.onclick=()=>{
        const im=d.imgs[+x.dataset.rmi];
        if(im.id)d.removedImgs.push(im.id);
        d.imgs.splice(+x.dataset.rmi,1); shots(); score();});
    }

    function paint(){
      $('#tb').innerHTML=T[tab]()+'<datalist id="szl">'+(prof().sizes||SIZES).map(s=>'<option>'+s+'</option>').join('')+'</datalist>';
      if(tab==='info'){
        subSelect();
        $('#pR').onchange=()=>{d.category_id='';subSelect();collect();score();};
        $('#pS').onchange=()=>{d.category_id=$('#pS').value;$('#profH').textContent='Tailles proposées : '+(prof().sizes||SIZES).join(', ')+'.';score();};
        ['#pT','#pP','#pD'].forEach(s=>{const e=$(s);if(e)e.addEventListener('input',()=>{collect();score();});});
        const bh=t=>{const e=$('#barH'); if(e)e.textContent=t;};
        const fillBar=async code=>{ if(!code)return; $('#pBar').value=code; bh('Recherche du produit…');
          const r=await lookupBarcode(code); if(!$('#pBar'))return; collect(); d.barcode=code;
          if(!r){bh('Produit inconnu des bases gratuites : remplissez la fiche à la main.');return;}
          if(r.title&&!String(d.title).trim())d.title=(r.brand&&!r.title.toLowerCase().includes(r.brand.toLowerCase())?r.brand+' ':'')+r.title+(r.qty?' '+r.qty:'');
          if(!String(d.description).trim())d.description=[r.brand?'Marque : '+r.brand:'',r.qty?'Contenance : '+r.qty:''].filter(Boolean).join('\n');
          if(r.beauty){const rb=catBySlug('beaute'); if(rb&&subsOf(rb.id)[0])d.category_id=subsOf(rb.id)[0].id;}
          paint(); score(); bh('Trouvé sur '+r.source+'. Vérifiez, puis ajoutez le prix et la quantité.');};
        $('#scanBtn').onclick=async ()=>{ const c=await scanBarcode(); if(c)fillBar(c); };
        $('#pBar').addEventListener('change',e=>{const c=e.target.value.replace(/\D/g,''); if(c.length>=8)fillBar(c);});
      }
      if(tab==='var'){
        if(d.has_variants)bindBuilder(d,paint,collect);
        $('#hv').onchange=e=>{
          collect(); d.has_variants=e.target.checked;
          if(!d.has_variants&&d.vars.length>1){
            d.vars.slice(1).forEach(v=>{if(v.id)d.removedVars.push(v.id);});
            d.vars=[d.vars[0]];
          }
          paint();
        };
        const av=$('#addVar'); if(av)av.onclick=()=>{collect();
          d.vars.push({id:null,size:'',color:'',price:d.price||'',lot3:'',lot12:'',stock:1,measures:{},open:false});paint();};
        $$('[data-rm]').forEach(b=>b.onclick=()=>{collect();
          const v=d.vars[+b.dataset.rm]; if(v.id)d.removedVars.push(v.id);
          d.vars.splice(+b.dataset.rm,1); paint();});
        $$('[data-mes]').forEach(b=>b.onclick=()=>{collect();
          d.vars[+b.dataset.mes].open=!d.vars[+b.dataset.mes].open; paint();});
        $$('#vlist input').forEach(e=>e.addEventListener('input',()=>{collect();score();}));
      }
      if(tab==='pho'){
        shots();
        $('#pPh').onchange=async e=>{
          const fs=Array.from(e.target.files).slice(0,8-d.imgs.length);
          for(const f of fs){
            try{ toast('Envoi…'); const path=await upload('product-images',f,1100,.78);
              d.imgs.push({id:null,path:path,is_primary:d.imgs.length===0,color:window.__photoColor||''}); }
            catch(err){ fail(err,'Photo'); }
          }
          e.target.value=''; shots(); score();};
        $('#pCam').onchange=$('#pPh').onchange;
        const pcf=$('#pColFor'); if(pcf)pcf.onchange=e=>{window.__photoColor=e.target.value;};
      }
      score();
    }
    $$('.tabs button').forEach(b=>b.onclick=()=>{collect();tab=b.dataset.t;
      $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));paint();});
    paint();

    async function persist(status){
      collect();
      if(!String(d.title).trim()||!(Number(d.price)>0)){
        tab='info'; $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.t==='info'))); paint();
        req('#pT',v=>v.trim().length>0); req('#pP',v=>Number(v)>0);
        return toast('Il faut au minimum un nom et un prix.');
      }

      if(status==='published'&&!d.imgs.length)return toast('Ajoutez au moins une photo avant de publier.');
      if(status==='published'&&!d.pay){ tab='info'; $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.t==='info'))); paint(); const pm=$('#pModeF'); if(pm){pm.classList.add('bad'); pm.scrollIntoView({block:'center'});} return toast('Choisissez comment vous voulez être payé.'); }
      if(d.pay==='before'&&!/^\d{8}$/.test(d.pnum||'')){ tab='info'; $$('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.t==='info'))); paint(); req('#pNum',v=>/^\d{8}$/.test(v)); return toast('Indiquez votre numéro MonCash ou NatCash (8 chiffres).'); }

                 if(error)throw error; }

function loadImage(src){return new Promise((res,rej)=>{const i=new Image(); if(!/^data:/.test(src))i.crossOrigin='anonymous';
  i.onload=()=>res(i); i.onerror=()=>rej(new Error('Image indisponible')); i.src=src;});}
async function statusImage(o){
  toast('Préparation de l\'image…');
  try{
    const W=1080,H=1920,c=document.createElement('canvas'); c.width=W;c.height=H; const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#FF6A00'); g.addColorStop(1,'#111111'); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,106,0,.16)'; x.beginPath(); x.arc(W-60,140,260,0,7); x.fill();
    const logo=await loadImage(IMG.icone); x.drawImage(logo,70,80,110,110);
    x.fillStyle='#fff'; x.font='800 64px "Bricolage Grotesque",sans-serif'; x.fillText('VAlex',200,155);
    x.fillStyle='#FF6A00'; x.fillText('.',200+x.measureText('VAlex').width,155);
    if(o.img){ try{ const im=await loadImage(o.img); const s=880, r=Math.max(s/im.width,s/im.height);
      x.save(); const px=100,py=270; x.beginPath(); x.roundRect?x.roundRect(px,py,s,s,40):x.rect(px,py,s,s); x.clip();
      x.fillStyle='#fff'; x.fillRect(px,py,s,s);
      x.drawImage(im,px+(s-im.width*r)/2,py+(s-im.height*r)/2,im.width*r,im.height*r); x.restore(); }catch(e){} }
    x.fillStyle='#fff'; x.font='700 62px "Bricolage Grotesque",sans-serif';
    const words=String(o.title||'').split(' '); let line='', y=1250, lines=0;
    for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>880&&line){ x.fillText(line,100,y); y+=76; line=w; if(++lines>=2)break; } else line=t; }
    if(lines<2)x.fillText(line,100,y);
    x.fillStyle='#FF6A00'; x.font='800 96px "Bricolage Grotesque",sans-serif'; x.fillText(o.price||'',100,y+140);
    x.fillStyle='#EDEDED'; x.font='600 44px "Instrument Sans",sans-serif'; x.fillText('Vendu par '+(o.shop||''),100,y+220);
    x.fillStyle='#FF6A00'; x.beginPath(); x.roundRect?x.roundRect(100,1640,880,150,75):x.rect(100,1640,880,150); x.fill();
    x.fillStyle='#FFFFFF'; x.font='800 50px "Instrument Sans",sans-serif'; x.textAlign='center';
    x.fillText('Commandez sur VAlex Boutique',W/2,1708); x.font='600 34px "Instrument Sans",sans-serif'; x.fillText(o.short||'',W/2,1758);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const file=new File([blob],'valex-statut.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],text:o.title+' — '+o.url}); return; }catch(e){ if(e&&e.name==='AbortError')return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='valex-statut.png'; document.body.appendChild(a); a.click(); a.remove();
    toast('Image enregistrée. Publiez-la dans votre statut WhatsApp.');
  }catch(err){ fail(err,'Image statut'); }
}

  /* ---------- PASSER COMMANDE ---------- */
  async checkout(){
    topbar('back',{title:'Commander'});
    if(!S.user){go('#/compte');return;}
    if(!S.cart.length){go('#/panier');return;}
    this.set(skeleton(2));
    const {data:vs,error}=await sb.from('product_variants')
      .select('*, products(id,title,status,shop_id,is_demo,cod_ok,ship_mode,ship_fee_cents, shops(id,name,slug,city,phone,whatsapp), product_images(storage_path,is_primary,position))')
      .in('id',S.cart.map(l=>l.variantId));
    if(error)return fail(error,'Commande');
    const valid=(vs||[]).filter(v=>v.products&&v.products.status==='published'&&!v.products.is_demo);
    const groups={};
    valid.forEach(v=>{const sh=v.products.shops;(groups[sh.id]=groups[sh.id]||{shop:sh,items:[]}).items.push(v);});
    const ids=Object.keys(groups);
    if(!ids.length){toast('Aucun article commandable dans le panier.');go('#/panier');return;}
    const [{data:dels},{data:pays},{data:adds}]=await Promise.all([
      sb.from('shop_delivery').select('*').in('shop_id',ids), sb.from('shop_payment').select('*').in('shop_id',ids),
      sb.from('addresses').select('*').eq('user_id',S.user.id).order('created_at')]);
    let addr=(adds||[])[0]?adds[0].id:null;
    const st={};
    ids.forEach(id=>{const d=(dels||[]).find(x=>x.shop_id===id)||{mode:'separate',fee_cents:0,allows_pickup:true};
      const p=(pays||[]).find(x=>x.shop_id===id)||{cash_on_delivery:true};
      /* Le vendeur choisit par produit : à la livraison (espèces) OU avant la livraison (son numéro). */
      const noCod=groups[id].items.filter(v=>v.products.cod_ok===false).map(v=>v.products.title);
      const methods=[]; if(!noCod.length)methods.push('cash'); else { if(p.moncash&&p.moncash_number)methods.push('moncash'); if(p.natcash&&p.natcash_number)methods.push('natcash'); }
      if(typeof ONLINE_PAY!=='undefined'&&ONLINE_PAY)methods.push('online');
      st[id]={d,p,methods,noCod,pay:methods[0]||null,pickup:d.mode==='pickup',ref:'',note:''};});
    const qty=v=>(S.cart.find(x=>x.variantId===v.id)||{qty:1}).qty;

    const paint=()=>{
      let grand=0;
      const needAddr=ids.some(id=>!st[id].pickup);
      this.set('<h1 class="t-h1 enter">Commander</h1>'+
        '<p class="t-sub enter" style="margin-top:4px">'+(ids.length>1?ids.length+' commandes séparées : chaque vendeur prépare, livre et encaisse la sienne.':'Vérifiez avant de confirmer.')+'</p>'+
        (needAddr?'<div class="card enter" style="margin-top:14px"><div class="card__h">'+ico('pin')+'<h3>Où livrer ?</h3><a class="btn btn--sm" href="#/adresses" style="margin-left:auto">Gérer</a></div><div class="card__b"><div class="picks">'+
          ((adds||[]).length?adds.map(a=>'<label class="pick '+(addr===a.id?'on':'')+'"><input type="radio" name="ad" value="'+a.id+'"'+(addr===a.id?' checked':'')+'>'+
            '<span><strong>'+esc(a.label||'Adresse')+' — '+esc(a.full_name)+'</strong><span>'+esc(a.city)+', '+esc(a.department)+' · '+esc(a.landmark)+' · +509 '+esc(a.phone)+'</span></span></label>').join('')
          :'<p class="t-small">Ajoutez une adresse avec un point de repère : c\'est ce qui permet au livreur de vous trouver.</p>')+'</div>'+
          '<button class="btn btn--sm" id="addAdr" style="margin-top:10px">'+ico('plus',2)+'Nouvelle adresse</button><div id="adrForm"></div></div></div>':'')+
        ids.map(id=>{const g=groups[id], s=st[id];
          const sub=g.items.reduce((t,v)=>t+lineTotal(v,qty(v)),0);
          const ship=s.pickup?0:shipFor(g.items,s.d); grand+=sub+ship;
          const num=s.pay==='moncash'?s.p.moncash_number:s.pay==='natcash'?s.p.natcash_number:'';
          return '<div class="card enter" style="margin-top:14px"><div class="card__h"><h3>'+esc(g.shop.name)+'</h3><span class="t-small" style="margin-left:auto">'+esc(g.shop.city||'')+'</span></div><div class="card__b">'+
          g.items.map(v=>{const im=(v.products.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.position-b.position))[0];
            return '<div class="citem" style="border:0;padding:6px 0"><span class="citem__img">'+(im?'<img src="'+prodImg(im.storage_path)+'" alt="">':'')+'</span>'+
            '<span class="citem__b"><strong>'+esc(v.products.title)+'</strong><span class="t-small">'+esc([v.size,v.color].filter(Boolean).join(' · '))+' × '+qty(v)+'</span>'+(lotNote(v,qty(v))?'<span class="t-small lotok">'+lotNote(v,qty(v))+'</span>':'')+'</span><b class="price">'+gds(lineTotal(v,qty(v)))+'</b></div>';}).join('')+
          (s.d.mode!=='pickup'&&s.d.allows_pickup?'<div class="seg" style="margin-top:12px"><button data-pk="'+id+'" data-v="0" class="'+(!s.pickup?'on':'')+'">Livraison</button><button data-pk="'+id+'" data-v="1" class="'+(s.pickup?'on':'')+'">Retrait sur place</button></div>':'')+
          (s.d.mode==='pickup'?'<p class="t-small" style="margin-top:10px">Ce vendeur propose uniquement le retrait sur place à '+esc(g.shop.city||'')+'.</p>':'')+
          '<strong class="t-h3" style="display:block;margin-top:14px">Paiement</strong>'+
          (s.methods.length?'<div class="picks" style="margin-top:8px">'+s.methods.map(m=>'<label class="pick '+(s.pay===m?'on':'')+'"><input type="radio" name="pay_'+id+'" value="'+m+'"'+(s.pay===m?' checked':'')+'>'+
            '<span><strong>'+PAY_LABEL[m]+'</strong><span>'+(m==='cash'?'Vous payez le livreur à la réception.':m==='online'?'Vous payez sur MonCash après avoir confirmé. VAlex garde l\'argent jusqu\'à la livraison.':'Envoi direct au numéro '+(m==='moncash'?'MonCash':'NatCash')+' du vendeur, puis vous indiquez le numéro de transaction.')+'</span></span></label>').join('')+'</div>'
            :'<p class="t-small" style="color:var(--red)">Ce vendeur n\'a pas encore indiqué son numéro de paiement. Écrivez-lui depuis sa boutique.</p>')+
          (s.noCod.length?'<p class="t-small" style="margin-top:8px">Le vendeur demande d\'être payé avant la livraison pour « '+esc(s.noCod.join(' », « '))+' ».</p>':'')+
          ((typeof ONLINE_PAY==='undefined'||!ONLINE_PAY)?'<div class="pick" aria-disabled="true" style="opacity:.55;margin-top:8px;pointer-events:none"><span><strong>Payer via VAlex</strong><span>Pas encore disponible. Bientôt : VAlex garde l\'argent jusqu\'à la livraison.</span></span></div>':'')+
          (s.pay==='moncash'||s.pay==='natcash'?'<div class="nores">'+ico('alert',2)+'<span><b>VAlex n\'est pas responsable de ce paiement.</b> Vous envoyez l\'argent directement au vendeur : en aucun cas VAlex ne pourra vous rembourser. Payez seulement un vendeur en qui vous avez confiance.</span></div>':'')+
          (s.pay==='moncash'||s.pay==='natcash'?'<div class="paybox"><p>Envoyez <b>'+gds(sub+ship)+'</b> au '+(s.pay==='moncash'?'MonCash':'NatCash')+' du vendeur : <b>+509 '+esc(num||'?')+'</b></p>'+
            '<div class="field" style="margin:10px 0 0"><label for="ref_'+id+'">Numéro de transaction <span class="req">*</span></label><input type="text" id="ref_'+id+'" value="'+esc(s.ref)+'" placeholder="Ex. 3248761"><div class="hint">Il figure dans le SMS de confirmation. Le vendeur vérifie avant d\'envoyer.</div></div></div>':'')+
          '<div class="field" style="margin:12px 0 0"><label for="note_'+id+'">Message au vendeur <span class="opt">— facultatif</span></label><input type="text" id="note_'+id+'" value="'+esc(s.note)+'" placeholder="Heure de passage, précision…"></div>'+
          '</div><div class="card__f"><span class="t-small">Articles '+gds(sub)+' · Livraison '+(s.pickup?'retrait':ship?gds(ship):'incluse')+'</span><b class="price" style="margin-left:auto">'+gds(sub+ship)+'</b></div></div>';}).join('')+
        '<div class="card enter" style="margin-top:14px"><div class="card__b">'+
        '<div class="sumline total"><span>Total à payer</span><b>'+gds(grand)+'</b></div>'+
        '<button class="btn btn--mango btn--wide btn--lg" id="placeIt" style="margin-top:14px">Confirmer '+(ids.length>1?'les '+ids.length+' commandes':'la commande')+'</button>'+
        '<p class="t-small" style="margin-top:10px;text-align:center">En confirmant, vous acceptez les <a href="#/conditions" style="text-decoration:underline">conditions</a>. Vous pourrez annuler tant que le vendeur n\'a pas accepté.</p></div></div>');
      const keep=()=>ids.forEach(id=>{const r=$('#ref_'+id); if(r)st[id].ref=r.value; const n=$('#note_'+id); if(n)st[id].note=n.value;});
      $$('input[name=ad]').forEach(r=>r.onchange=()=>{keep();addr=r.value;paint();});
      $$('[data-pk]').forEach(b=>b.onclick=()=>{keep();st[b.dataset.pk].pickup=b.dataset.v==='1';paint();});
      ids.forEach(id=>$$('input[name=pay_'+id+']').forEach(r=>r.onchange=()=>{keep();st[id].pay=r.value;paint();}));
      const aa=$('#addAdr'); if(aa)aa.onclick=()=>{keep(); $('#adrForm').innerHTML=
        '<div class="field" style="margin-top:12px"><label for="nN">Qui reçoit <span class="req">*</span></label><input type="text" id="nN" value="'+esc(((S.profile||{}).first_name||'')+' '+((S.profile||{}).last_name||''))+'"><div class="err">Champ obligatoire.</div></div>'+
        '<div class="field"><label for="nP">Téléphone <span class="req">*</span></label><div class="tel"><span>+509</span><input type="tel" id="nP" maxlength="8" inputmode="numeric" value="'+esc((S.profile||{}).phone||'')+'"></div><div class="err">8 chiffres attendus.</div></div>'+
        '<div class="row2"><div class="field"><label for="nD">Département <span class="req">*</span></label>'+selDept('nD',(S.profile||{}).department)+'<div class="err">Champ obligatoire.</div></div>'+
        '<div class="field"><label for="nC">Ville <span class="req">*</span></label><select id="nC"></select><div class="err">Champ obligatoire.</div></div></div>'+
        '<div class="field"><label for="nM">Point de repère <span class="req">*</span></label><input type="text" id="nM" placeholder="En face de l\'église, maison bleue"><div class="err">Champ obligatoire.</div></div>'+
        '<button class="btn btn--pri btn--sm" id="nS">Enregistrer l\'adresse</button>';
        telOnly('#nP'); bindCity('#nD','#nC',null);
        $('#nS').onclick=async ()=>{let ok=true;
          ok=req('#nN',v=>v.trim().length>=3)&&ok; ok=req('#nP',v=>/^\d{8}$/.test(v))&&ok; ok=req('#nD',v=>!!v)&&ok; ok=req('#nC',v=>!!v)&&ok; ok=req('#nM',v=>v.trim().length>=4)&&ok;
          if(!ok)return toast('Corrigez les champs en rouge.');
          busy('#nS',true,'…');
          const {data:na,error}=await sb.from('addresses').insert({user_id:S.user.id,label:'Domicile',full_name:$('#nN').value.trim(),phone:$('#nP').value,
            department:$('#nD').value,city:$('#nC').value,landmark:$('#nM').value.trim()}).select().single();
          busy('#nS',false); if(error)return fail(error,'Adresse');
          (adds||(adds=[])).push(na); addr=na.id; paint();};};
      $('#placeIt').onclick=async ()=>{
        keep();
        if(ids.some(id=>!st[id].pickup)&&!addr)return toast('Ajoutez une adresse de livraison.');
        if(ids.some(id=>st[id].pay==='moncash'||st[id].pay==='natcash')&&!await ask({title:'Paiement direct au vendeur',body:'<p><b>VAlex n\'est pas responsable de ce paiement.</b></p><p style="margin-top:8px">L\'argent part directement sur le numéro du vendeur. En aucun cas VAlex ne vous remboursera si le vendeur ne livre pas.</p><p style="margin-top:8px">Bientôt, « Payer via VAlex » gardera votre argent jusqu\'à la livraison.</p>',ok:'J\'ai compris, je commande',cancel:'Annuler'}))return;
        for(const id of ids){ const s=st[id];
          if(!s.pay)return toast(groups[id].shop.name+' : aucun moyen de paiement disponible.');
          if((s.pay==='moncash'||s.pay==='natcash')&&s.ref.trim().length<4)return toast(groups[id].shop.name+' : indiquez le numéro de transaction.'); }
        busy('#placeIt',true,'Envoi…');
        const done=[];
        for(const id of ids){ const s=st[id], g=groups[id];
          const {data,error}=await sb.rpc('place_order',{p_shop:id,p_items:g.items.map(v=>({variant_id:v.id,qty:qty(v)})),
            p_address:s.pickup?null:addr,p_payment:s.pay,p_payment_ref:s.ref||null,p_note:s.note||null,p_pickup:s.pickup});
          if(error){ busy('#placeIt',false); fail(error,g.shop.name); if(done.length)break; return; }
          const row=Array.isArray(data)?data[0]:data;
          done.push({id:row.order_id,number:row.order_number,shop:g.shop,items:g.items.map(v=>v.products.title+(v.size?' ('+v.size+')':'')+' × '+qty(v)),pay:s.pay,pickup:s.pickup,
            total:g.items.reduce((t,v)=>t+v.price_cents*qty(v),0)+(s.pickup?0:((s.d.mode==='separate'||s.d.mode==='zones')?s.d.fee_cents:0))});
          S.cart=S.cart.filter(l=>!g.items.some(v=>v.id===l.variantId)); saveCart();
        }
        const a=(adds||[]).find(x=>x.id===addr);
        sessionStorage.setItem('valex_done',JSON.stringify({orders:done,addr:a||null}));
        paintTabbar(); go('#/merci');
      };
    };
    paint();
  },

/* ---------- petites données partagées ---------- */
const PX=p=>p.min_price_cents!=null?p.min_price_cents:p.base_price_cents;
const OFF=p=>p.compare_at_cents&&PX(p)&&p.compare_at_cents>PX(p)?Math.round((1-PX(p)/p.compare_at_cents)*100):0;
const AUD={tous:'Tous',femme:'Femmes',homme:'Hommes',enfant:'Enfants',chaussures:'Chaussures'};
const SORTS=[['pert','Pertinence'],['recent','Plus récents'],['asc','Prix croissant'],['desc','Prix décroissant'],['note','Mieux notés'],['ventes','Plus vendus']];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const since=d=>{if(!d)return '';const m=Math.max(0,Math.floor((Date.now()-new Date(d))/2592e6));
  return m<1?'nouvelle sur VAlex':'sur VAlex depuis '+m+' mois';};
let RANK={}; /* id produit -> rang dans sa sous-catégorie (1 à 3), calculé sur les ventes réelles */
function computeRanks(list){
  const by={}; list.forEach(p=>{if(!p.is_demo)(by[p.category_slug]=by[p.category_slug]||[]).push(p);});
  RANK={}; Object.values(by).forEach(a=>{ if(a.length<3)return; /* un classement n'a de sens qu'à partir de 3 articles */
    a.filter(p=>(p.sold_count||0)>0).sort((x,y)=>y.sold_count-x.sold_count).slice(0,3).forEach((p,i)=>RANK[p.id]=i+1);});
}
function sortList(list,s,q){
  const a=list.slice();
  if(s==='recent')a.sort((x,y)=>new Date(y.published_at)-new Date(x.published_at));
  else if(s==='asc')a.sort((x,y)=>PX(x)-PX(y));
  else if(s==='desc')a.sort((x,y)=>PX(y)-PX(x));
  else if(s==='note')a.sort((x,y)=>((y.rating_avg||0)-(x.rating_avg||0))||((y.rating_count||0)-(x.rating_count||0)));
  else if(s==='ventes')a.sort((x,y)=>(y.sold_count||0)-(x.sold_count||0));
  else { const t=(q||'').toLowerCase();
    const sc=p=>(t&&String(p.title).toLowerCase().includes(t)?1000:0)+(p.sold_count||0)*5+(p.views||0)/10+(p.rating_avg||0)*3;
    a.sort((x,y)=>sc(y)-sc(x)); }
  return a;
}
function remember(p){ const h=LS.get('valex_vus',[]).filter(x=>x!==p); h.unshift(p); LS.set('valex_vus',h.slice(0,40)); }

/* ---------- carte produit (CAHIER §3.2) : chaque mention n'apparaît que si elle est vraie ---------- */
pcard=function(p,i){
  const cover=prodImg(p.cover_path), price=PX(p), off=OFF(p);
  const tl=[];
  if(p.is_demo)tl.push('<span class="tg tg--demo">Exemple</span>');
  else if(!p.total_stock)tl.push('<span class="tg tg--out">Épuisé</span>');
  if(off>=5)tl.push('<span class="tg tg--off">−'+off+' %</span>');
  if(p.video_path)tl.push('<span class="tg tg--vid">'+ico('play',2.2)+'Vidéo</span>');
  const m=[];
  if(RANK[p.id])m.push('<span class="mn mn--rank">N°'+RANK[p.id]+' des ventes · '+esc(p.category_label||'')+'</span>');
  const line=[];
  if((p.sold_count||0)>0)line.push(p.sold_count+' vendu'+(p.sold_count>1?'s':''));
  if((p.rating_count||0)>=3&&p.five_star_pct)line.push(p.five_star_pct+' % d\'avis 5 étoiles');
  else if((p.rating_count||0)>0&&p.rating_avg)line.push(ico('star',2)+' '+String(p.rating_avg).replace('.',','));
  if(line.length)m.push('<span class="mn">'+line.join(' · ')+'</span>');
  if((p.colors_count||0)>1)m.push('<span class="mn mn--sw">'+p.colors_count+' couleurs</span>');
  return '<div class="pcard" role="link" tabindex="0" data-p="'+p.id+'" style="animation-delay:'+Math.min(i||0,12)*.03+'s">'+
    '<span class="pcard__img">'+(cover?'<img src="'+cover+'" alt="" loading="lazy">':ico('box'))+
    (tl.length?'<span class="pcard__tags">'+tl.join('')+'</span>':'')+
    (!p.is_demo&&p.total_stock?'<button class="qadd" data-qa="'+p.id+'" aria-label="Ajouter au panier">'+ico('cart',2)+'</button>':'')+'</span>'+
    '<span class="pcard__b"><span class="pc-t">'+esc(p.title)+'</span>'+m.join('')+
    '<span class="pc-pr"><span class="price">'+gds(price)+'</span>'+(off>=5?'<span class="was">'+gds(p.compare_at_cents)+'</span>':'')+'</span>'+
    '<span class="pc-sh">'+(p.shop_founder?'<span class="vf">'+ico('shield',2.2)+'</span>':'')+esc(p.shop_name||'')+(p.shop_city?' · '+esc(p.shop_city):'')+'</span>'+
    '</span></div>';
};

    let shown=0; const cur=feeds[ft]||feeds.pour; const hh=Array(NCOL()).fill(0);
    const page=()=>{const next=cur.slice(shown,shown+12); if(!next.length){$('#more').textContent=cur.length?'Vous avez tout vu.':'';return;}
      const cols=$$('#feed>div');
      next.forEach((p,i)=>{const est=100+(RANK[p.id]?16:0)+(tickerLines(p).length?16:0)+(OFF(p)>=5?16:0)+(String(p.title).length>22?18:0);

    if('IntersectionObserver' in window&&cur.length){const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){page(); if(shown>=cur.length)io.disconnect();}},{rootMargin:'300px'}); io.observe($('#more'));}
  },

  /* CATÉGORIES (CAHIER §3.4) */
  async categories(sel){
    searchHead();
    sel=sel||sessionStorage.getItem('valex_cat')||'pour';
    this.set('<div class="catpage"><nav class="catside" id="cside">'+
      '<button data-c="pour" class="'+(sel==='pour'?'on':'')+'">Pour vous</button><button data-c="new" class="'+(sel==='new'?'on':'')+'">Nouveautés</button><button data-c="petits" class="'+(sel==='petits'?'on':'')+'">Petits prix</button>'+
      S.rayons.map(r=>'<button data-c="'+r.slug+'" class="'+(sel===r.slug?'on':'')+'">'+esc(r.label)+'</button>').join('')+'</nav>'+
      '<div class="catmain" id="cmain">'+skeleton(2)+'</div></div>');
    $$('#cside button').forEach(b=>b.onclick=()=>{sessionStorage.setItem('valex_cat',b.dataset.c);this.categories(b.dataset.c);});
    const all=await fetchCatalog({limit:300}); computeRanks(all);
    const coverOf=(fn,fb)=>{const c=all.filter(fn).filter(p=>p.cover_path&&!p.is_demo).sort((a,b)=>(b.views||0)-(a.views||0))[0];return c?prodImg(c.cover_path):fb;};
    const hot=slug=>{const n=all.filter(p=>p.category_slug===slug&&!p.is_demo); const s=n.reduce((a,p)=>a+(p.sold_count||0),0);
      return s>=10?'<span class="hot">'+ico('fire',2.2)+'</span>':(n.length>=3?'<span class="hot hot--t">'+ico('trend',2.2)+'</span>':'');};
    const circ=(href,img,label,badge)=>'<a class="circ" href="'+href+'"><span class="ci">'+(img?'<img src="'+img+'" alt="" loading="lazy">':'')+(badge||'')+'</span><span>'+esc(label)+'</span></a>';
    let h='';
    if(['pour','new','petits'].includes(sel)){
      const subs=S.cats.filter(c=>c.parent_id);
      const scored=subs.map(c=>({c,n:all.filter(p=>p.category_slug===c.slug&&!p.is_demo).reduce((a,p)=>a+(p.views||0)+(p.sold_count||0)*20,0)})).sort((a,b)=>b.n-a.n).slice(0,12);
      if(sel==='pour')h='<h3 class="cm-h">Sélection pour vous</h3><div class="circs">'+scored.map(({c})=>{const r=S.subs[c.parent_id]||{};
        return circ('#/rayon/'+r.slug+'/'+c.slug,coverOf(p=>p.category_slug===c.slug,RAYON_IMG(r.slug)),c.label,hot(c.slug));}).join('')+'</div>';
      else{ const l=sel==='new'?sortList(all.filter(p=>!p.is_demo),'recent').slice(0,12):sortList(all.filter(p=>!p.is_demo&&p.total_stock),'asc').slice(0,12);
        h='<h3 class="cm-h">'+(sel==='new'?'Nouveautés':'Petits prix')+'</h3>'+(l.length?grid(l):'<p class="t-small">Rien pour l\'instant.</p>'); }
    } else {
      const r=catBySlug(sel);
      h='<h3 class="cm-h">'+esc(r?r.label:'')+'</h3><div class="circs">'+circ('#/rayon/'+sel,'', 'Voir tout','<span class="all">'+ico('grid',1.8)+'</span>')+
        subsOf(r.id).map(c=>circ('#/rayon/'+sel+'/'+c.slug,coverOf(p=>p.category_slug===c.slug,RAYON_IMG(sel)),c.label,hot(c.slug))).join('')+'</div>';
    }
    const sh={}; all.filter(p=>!p.is_demo&&(['pour','new','petits'].includes(sel)||p.rayon_slug===sel)).forEach(p=>{const s=sh[p.shop_slug]=sh[p.shop_slug]||{slug:p.shop_slug,name:p.shop_name,cover:p.cover_path,n:0};s.n++;});
    const ts=Object.values(sh).sort((a,b)=>b.n-a.n).slice(0,6);
    if(ts.length)h+='<h3 class="cm-h" style="margin-top:20px">Boutiques tendance</h3><div class="circs">'+ts.map(s=>circ('#/boutique/'+s.slug,prodImg(s.cover),s.name)).join('')+'</div>';
    $('#cmain').innerHTML=h; bindCards();
  },

  /* LISTE AVEC TRI ET FILTRES, partagée par rayon et recherche (CAHIER §3.3) */
  async _listing(o){
    const f=Object.assign({sort:o.q?'pert':'pert',min:'',max:'',city:'',promo:false,stock:false,aud:''},LS.get('valex_filters',{}),{sub:o.sub||''});
    const host=$('#lst');
    const paintBar=()=>{const n=['min','max','city','aud'].filter(k=>f[k]).length+(f.promo?1:0)+(f.stock?1:0);
      $('#lbar').innerHTML='<label class="sortsel">'+ico('trend',2)+'<select id="fSort">'+SORTS.map(([k,l])=>'<option value="'+k+'"'+(k===f.sort?' selected':'')+'>'+l+'</option>').join('')+'</select></label>'+
        '<button class="chip'+(n?' on':'')+'" id="fBtn">'+ico('filter',2)+'Filtres'+(n?' ('+n+')':'')+'</button>'+
        (f.promo?'<button class="chip on" data-rm="promo">En promo ×</button>':'')+(f.stock?'<button class="chip on" data-rm="stock">Disponible ×</button>':'');
      $('#fSort').onchange=e=>{f.sort=e.target.value;save();run();};
      $('#fBtn').onclick=sheet;
      $$('[data-rm]').forEach(b=>b.onclick=()=>{f[b.dataset.rm]=false;save();run();});};
    const save=()=>LS.set('valex_filters',{sort:f.sort,min:f.min,max:f.max,city:f.city,promo:f.promo,stock:f.stock,aud:f.aud});
    async function run(){
      paintBar(); host.innerHTML=skeleton(4);
      let list=await fetchCatalog({rayon:o.rayon,sub:f.sub||undefined,text:o.q||undefined,city:f.city||undefined,inStock:f.stock,limit:200});
      if(f.min)list=list.filter(p=>PX(p)>=Number(f.min)*100);
      if(f.max)list=list.filter(p=>PX(p)<=Number(f.max)*100);
      if(f.promo)list=list.filter(p=>OFF(p)>=5);
      if(f.aud)list=list.filter(p=>p.audience===f.aud||p.audience==='mixte');
      computeRanks(list);
      list=sortList(list,f.sort,o.q);
      if(o.count)o.count(list.length);
      host.innerHTML=list.length?grid(list):'<div class="card"><div class="empty"><div class="empty__ic">'+ico('search')+'</div><h3>Rien ne correspond</h3><p>Essayez d\'enlever un filtre ou un mot plus simple.</p></div></div>';
      bindCards();
    }
    function sheet(){
      const cities=Object.values(DEPTS).flat().sort();
      ask({title:'Filtres',ok:'Voir les résultats',cancel:'Tout effacer',body:
        '<div class="row2"><div class="field"><label for="fMin">Prix min (HTG)</label><input type="number" id="fMin" inputmode="numeric" value="'+esc(f.min)+'"></div>'+
        '<div class="field"><label for="fMax">Prix max (HTG)</label><input type="number" id="fMax" inputmode="numeric" value="'+esc(f.max)+'"></div></div>'+
        '<div class="field"><label for="fAud">Pour qui</label><select id="fAud"><option value="">Tout le monde</option><option value="femme"'+(f.aud==='femme'?' selected':'')+'>Femmes</option><option value="homme"'+(f.aud==='homme'?' selected':'')+'>Hommes</option><option value="enfant"'+(f.aud==='enfant'?' selected':'')+'>Enfants</option></select></div>'+
        '<div class="field"><label for="fCity">Ville du vendeur</label><select id="fCity"><option value="">Toutes</option>'+cities.map(c=>'<option'+(c===f.city?' selected':'')+'>'+c+'</option>').join('')+'</select></div>'+
        '<label class="check"><input type="checkbox" id="fPromo"'+(f.promo?' checked':'')+'> <span>En promotion</span></label>'+
        '<label class="check" style="margin-top:8px"><input type="checkbox" id="fStock"'+(f.stock?' checked':'')+'> <span>Disponible maintenant</span></label>'}).then(yes=>{
        if(yes){f.min=$('#fMin').value;f.max=$('#fMax').value;f.aud=$('#fAud').value;f.city=$('#fCity').value;f.promo=$('#fPromo').checked;f.stock=$('#fStock').checked;}
        else{f.min='';f.max='';f.aud='';f.city='';f.promo=false;f.stock=false;}
        save();run();});
    }
    o.setSub=s=>{f.sub=s;run();};
    run();
  },

    topbar('back',{title:'Panier'});
    restoreRest();
    if(!S.cart.length){
      this.set('<div class="card enter"><div class="empty"><div class="empty__ic">'+ico('cart')+'</div><h3>Votre panier est vide</h3><p>Ajoutez ce qui vous plaît, sans compte nécessaire pour regarder.</p><a class="btn btn--pri" href="#/">Découvrir</a></div></div>'+
        '<div class="sechead"><h2>Recommandés pour vous</h2></div><div id="rec">'+skeleton(2)+'</div>');
      const all=await fetchCatalog({limit:40}); $('#rec').innerHTML=grid(sortList(all.filter(x=>!x.is_demo&&x.total_stock),'pert').slice(0,8)); bindCards(); return;
    }
    this.set(skeleton(2));
    const ids=S.cart.map(l=>l.variantId);
    const {data:vs,error}=await sb.from('product_variants').select('*, products(id,title,status,shop_id, shops(id,name,slug,city), product_images(storage_path,is_primary,position))').in('id',ids);
    if(error){fail(error,'Panier');return;}
    const valid=(vs||[]).filter(v=>v.products&&v.products.status==='published');
    if(valid.length!==S.cart.length){S.cart=S.cart.filter(l=>valid.some(v=>v.id===l.variantId));saveCart();paintTabbar();}
    if(!S.cart.length){this.cart();return;}
    const sel=new Set(LS.get('valex_sel',null)||S.cart.map(l=>l.variantId)); [...sel].forEach(x=>{if(!S.cart.some(l=>l.variantId===x))sel.delete(x);});
    const groups={}; valid.forEach(v=>{const sh=v.products.shops;(groups[sh.id]=groups[sh.id]||{shop:sh,items:[]}).items.push(v);});
    const {data:dels}=await sb.from('shop_delivery').select('*').in('shop_id',Object.keys(groups));
    const qty=id=>(S.cart.find(x=>x.variantId===id)||{}).qty||0;
    const self=this;
    function totals(){let sub=0,ship=0,n=0;Object.values(groups).forEach(g=>{const on=g.items.filter(v=>sel.has(v.id));
      on.forEach(v=>{sub+=lineTotal(v,qty(v.id));n+=qty(v.id);}); const d=(dels||[]).find(x=>x.shop_id===g.shop.id);
      if(on.length&&d&&(d.mode==='separate'||d.mode==='zones'))ship+=d.fee_cents||0;}); return {sub,ship,n};}
    function paint(){
      const t=totals(), all=valid.every(v=>sel.has(v.id));
      self.set('<div class="cartbar enter"><span>'+valid.length+' article'+(valid.length>1?'s':'')+' · '+Object.keys(groups).length+' boutique'+(Object.keys(groups).length>1?'s':'')+'</span>'+
        '<button class="btn btn--sm" id="shareCart">'+ico('share',2)+'Partager mon panier</button></div>'+
        Object.values(groups).map(g=>{const gall=g.items.every(v=>sel.has(v.id)); const d=(dels||[]).find(x=>x.shop_id===g.shop.id);
          return '<div class="card cgroup enter"><div class="card__h"><label class="cbx"><input type="checkbox" data-g="'+g.shop.id+'"'+(gall?' checked':'')+'><span></span></label>'+
          '<a href="#/boutique/'+esc(g.shop.slug)+'"><h3>'+esc(g.shop.name)+'</h3></a><span class="t-small" style="margin-left:auto">'+esc(g.shop.city||'')+'</span></div>'+
          '<div class="card__b" style="display:grid;gap:12px">'+g.items.map(v=>{const im=(v.products.product_images||[]).sort((a,b)=>(b.is_primary-a.is_primary)||(a.position-b.position))[0];
            const lab=[v.size,v.color].filter(Boolean).join(' · ');
            return '<div class="citem"><label class="cbx"><input type="checkbox" data-v="'+v.id+'"'+(sel.has(v.id)?' checked':'')+'><span></span></label>'+
            '<a class="citem__img" href="#/produit/'+v.products.id+'">'+(im?'<img src="'+prodImg(im.storage_path)+'" alt="">':'')+'</a>'+
            '<span class="citem__b"><strong>'+esc(v.products.title)+'</strong>'+(lab?'<span class="t-small">'+esc(lab)+'</span>':'')+
            (v.stock<=2?'<span class="t-small" style="color:var(--pine)">Plus que '+v.stock+'</span>':'')+'<span class="price">'+gds(lineTotal(v,qty(v.id)))+'</span>'+(lotNote(v,qty(v.id))?'<span class="t-small lotok">'+lotNote(v,qty(v.id))+'</span>':(v.lot3_cents&&qty(v.id)<3?'<span class="t-small lothint">3 pour '+gds(v.lot3_cents)+'</span>':''))+'</span>'+
            '<span class="qty"><button data-m="'+v.id+'" aria-label="Moins">−</button><span>'+qty(v.id)+'</span><button data-pl="'+v.id+'" data-max="'+v.stock+'" aria-label="Plus">+</button></span></div>';}).join('')+'</div>'+
          '<div class="card__f"><span class="t-small">Livraison : '+(d&&d.fee_cents&&(d.mode==='separate'||d.mode==='zones')?gds(d.fee_cents):(d&&d.mode==='pickup'?'retrait sur place':'incluse'))+(d&&d.delay_label?' · '+esc(d.delay_label):'')+'</span></div></div>';}).join('')+
        '<div class="trustbox enter">'+ico('shield',2)+'<span><strong>Achat protégé</strong> Paiement à la livraison possible, code de réception secret, signalement en cas de problème.</span></div>'+
        '<div class="paybar"><label class="cbx"><input type="checkbox" id="allSel"'+(all?' checked':'')+'><span></span><em>Tout</em></label>'+
        '<span class="paybar__t"><b>'+gds(t.sub+t.ship)+'</b><span>'+(t.ship?'dont livraison '+gds(t.ship):'livraison incluse')+'</span></span>'+
        '<button class="btn btn--pri" id="checkout"'+(t.n?'':' disabled')+'>Commander'+(t.n?' ('+t.n+')':'')+'</button></div>');
      $$('[data-v]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.v):sel.delete(c.dataset.v);LS.set('valex_sel',[...sel]);paint();});
      $$('[data-g]').forEach(c=>c.onchange=()=>{groups[c.dataset.g].items.forEach(v=>c.checked?sel.add(v.id):sel.delete(v.id));LS.set('valex_sel',[...sel]);paint();});
      $('#allSel').onchange=e=>{valid.forEach(v=>e.target.checked?sel.add(v.id):sel.delete(v.id));LS.set('valex_sel',[...sel]);paint();};
      $$('[data-pl]').forEach(b=>b.onclick=()=>{const l=S.cart.find(x=>x.variantId===b.dataset.pl);if(l.qty>=Number(b.dataset.max))return toast('Stock maximum atteint.');l.qty++;saveCart();paintTabbar();paint();});
      $$('[data-m]').forEach(b=>b.onclick=()=>{const l=S.cart.find(x=>x.variantId===b.dataset.m);l.qty--;
        if(l.qty<=0){S.cart=S.cart.filter(x=>x.variantId!==b.dataset.m);saveCart();paintTabbar();self.cart();return;}saveCart();paintTabbar();paint();});
      $('#shareCart').onclick=()=>{const code=S.cart.map(l=>l.variantId+':'+l.qty).join(',');
        shareLink('Mon panier VAlex — tu peux le commander pour moi',SITE()+'#/panier-partage/'+encodeURIComponent(btoa(code)));};
      $('#checkout').onclick=async ()=>{
        if(!S.user){ if(await ask({title:'Connectez-vous pour commander',body:'<p>Un compte est nécessaire pour envoyer une commande à un vendeur.</p>',ok:'Créer un compte',cancel:'Plus tard'}))go('#/compte'); return; }
        const rest=S.cart.filter(l=>!sel.has(l.variantId));
        if(rest.length){LS.set('valex_cart_rest',rest); S.cart=S.cart.filter(l=>sel.has(l.variantId)); saveCart();}
        go('#/commander');};
    }
    paint();
  },

  async sharedCart(code){
    topbar('back',{title:'Panier partagé'});
    let lines=[]; try{lines=atob(decodeURIComponent(code||'')).split(',').map(x=>{const [v,q]=x.split(':');return {variantId:v,qty:Math.max(1,Number(q)||1)};}).filter(l=>l.variantId);}catch(e){}
    if(!lines.length){this.set('<div class="card"><div class="empty"><h3>Lien invalide</h3><p>Demandez à la personne de vous renvoyer son panier.</p></div></div>');return;}
    const {data}=await sb.from('product_variants').select('*, products(id,title,status, product_images(storage_path,is_primary,position))').in('id',lines.map(l=>l.variantId));
    const ok=(data||[]).filter(v=>v.products&&v.products.status==='published');
    let tot=0; ok.forEach(v=>tot+=lineTotal(v,lines.find(l=>l.variantId===v.id).qty));
    this.set('<div class="card enter"><div class="card__b"><h3 class="t-h3">On vous a envoyé un panier</h3><p class="t-small" style="margin-top:6px">Vous pouvez le commander et le payer pour cette personne. À l\'étape suivante, indiquez son adresse de livraison.</p></div></div>'+
      '<div class="card enter" style="margin-top:12px"><div class="card__b" style="display:grid;gap:10px">'+ok.map(v=>{const im=(v.products.product_images||[])[0];const q=lines.find(l=>l.variantId===v.id).qty;
        return '<div class="citem"><span class="citem__img">'+(im?'<img src="'+prodImg(im.storage_path)+'" alt="">':'')+'</span><span class="citem__b"><strong>'+esc(v.products.title)+'</strong><span class="t-small">'+esc([v.size,v.color].filter(Boolean).join(' · '))+' × '+q+'</span><span class="price">'+gds(lineTotal(v,q))+'</span></span></div>';}).join('')+'</div>'+
      '<div class="card__f"><b>Total articles : '+gds(tot)+'</b></div></div>'+
      '<button class="btn btn--pri btn--wide btn--lg" id="take" style="margin-top:14px">Ajouter à mon panier</button>');
    $('#take').onclick=()=>{ok.forEach(v=>{const q=lines.find(l=>l.variantId===v.id).qty; const l=S.cart.find(x=>x.variantId===v.id); if(l)l.qty=Math.max(l.qty,q); else S.cart.push({variantId:v.id,qty:Math.min(q,v.stock||q)});});
      saveCart(); paintTabbar(); go('#/panier');};
  }
});

/* panier : articles non sélectionnés mis de côté pendant la commande */
function restoreRest(){
  const rest=LS.get('valex_cart_rest',null); if(!rest||!rest.length)return;
  rest.forEach(r=>{const l=S.cart.find(x=>x.variantId===r.variantId); if(l)l.qty+=r.qty; else S.cart.push(r);});
  LS.set('valex_cart_rest',[]); saveCart();
}

/* prix façon Shein : le chiffre en grand, la monnaie en petit */

/* petites infos qui défilent verticalement (une ligne, plusieurs messages) */
function tickerLines(p){
  const l=[];
  if((p.sold_count||0)>0)l.push(p.sold_count+' vendu'+(p.sold_count>1?'s':''));
  if((p.rating_count||0)>=3&&p.five_star_pct)l.push(p.five_star_pct+' % d\'avis 5 étoiles');
  else if((p.rating_count||0)>0&&p.rating_avg)l.push('Note '+String(p.rating_avg).replace('.',',')+' sur 5');
  if(p.total_stock>0&&p.total_stock<=3)l.push('Plus que '+p.total_stock+' en stock');
  if(p.shop_city)l.push('Expédié depuis '+p.shop_city);
  return l;
}
setInterval(()=>{ $$('.tick').forEach(t=>{const n=t.children.length; if(n<2)return; const k=((+t.dataset.k||0)+1)%n; t.dataset.k=k;

/* carte produit, version Shein */
pcard=function(p,i){
  const cover=prodImg(p.cover_path), price=PX(p), off=OFF(p);
  const tl=[];
  if(p.is_demo)tl.push('<span class="tg tg--demo">Exemple</span>');
  else if(!p.total_stock)tl.push('<span class="tg tg--out">Épuisé</span>');
  if(p.video_path)tl.push('<span class="tg tg--vid">'+ico('play',2.2)+'Vidéo</span>');
  const hx=(p.color_hexes||[]).filter(Boolean);
  const sw=hx.length>1?'<span class="sw">'+hx.slice(0,3).map(h=>'<i style="'+swatch(h)+'"></i>').join('')+(hx.length>3?'<em>'+hx.length+'</em>':'')+'</span>':'';
  const tk=tickerLines(p);
  const rank=RANK[p.id]?'<span class="mn mn--rank">N°'+RANK[p.id]+' des ventes · '+esc(p.category_label||'')+ico('chev',2.4)+'</span>':'';
  return '<div class="pcard" role="link" tabindex="0" data-p="'+p.id+'" style="animation-delay:'+Math.min(i||0,12)*.03+'s">'+
    '<span class="pcard__img">'+(cover?'<img src="'+cover+'" alt="" loading="lazy">':ico('box'))+
    (tl.length?'<span class="pcard__tags">'+tl.join('')+'</span>':'')+sw+'</span>'+
    '<span class="pcard__b"><span class="pc-t">'+esc(p.title)+'</span>'+rank+
    (tk.length?'<span class="tickw"><span class="tick" style="--n:'+tk.length+'">'+tk.map(x=>'<span>'+esc(x)+'</span>').join('')+'</span></span>':'')+
    '<span class="pc-pr">'+bigPrice(price)+(off>=5?'<span class="offc">−'+off+' %</span>':'')+'</span>'+
    (off>=5?'<span class="was">'+gds(p.compare_at_cents)+'</span>':'')+
    '<span class="pc-sh">'+(p.shop_verified?'<span class="vbadge" title="Vérifiée par VAlex">'+ico('verified',2)+'</span>':'')+esc(p.shop_name||'')+'</span>'+
    (!p.is_demo&&p.total_stock?'<button class="qplus" data-qa="'+p.id+'" aria-label="Ajouter au panier">'+ico('plus',2.4)+'</button>':'')+
    '</span></div>';
};
/* grille en quinconce : 2 colonnes sur téléphone, jusqu'à 6 sur grand écran ; chaque carte va dans la plus courte */
function NCOL(w){ w=w||Math.min(window.innerWidth,1440); return w<600?2:w<900?3:w<1180?4:w<1400?5:6; }
grid=function(l,n){
  if(!l.length)return '';
  n=n||NCOL(); const cols=Array.from({length:n},()=>[]), h=Array(n).fill(0);
  l.forEach((p,i)=>{ const est=100+(RANK[p.id]?16:0)+(tickerLines(p).length?16:0)+(OFF(p)>=5?16:0)+(String(p.title).length>22?18:0);
    const k=h.indexOf(Math.min(...h)); cols[k].push(pcard(p,i)); h[k]+=est; });
  return '<div class="mgrid" style="--n:'+n+'">'+cols.map(c=>'<div>'+c.join('')+'</div>').join('')+'</div>';
};
/* on redessine si l'écran change de taille (rotation, fenêtre PC) */
(function(){ let last=NCOL(), t=0; window.addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(()=>{ const n=NCOL(); if(n!==last){ last=n; if(!document.querySelector('input:focus,textarea:focus'))route(); } },250); }); })();
bindCards=function(){
  $$('.pcard').forEach(c=>{c.onclick=e=>{ if(e.target.closest('.qplus'))return; go('#/produit/'+c.dataset.p); }; c.onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('.qplus'))go('#/produit/'+c.dataset.p);};});
  $$('.qplus').forEach(b=>b.onclick=e=>{ e.stopPropagation(); quickAdd(b.dataset.qa,b); });
};
/* « + » sur la carte : ajoute directement, ou fait choisir taille/couleur sans quitter la page */
async function quickAdd(pid,btn){
  const {data}=await sb.from('product_variants').select('*').eq('product_id',pid).order('position');
  const ok=(data||[]).filter(v=>v.stock>0);
  const done=()=>{ if(btn){btn.classList.add('done'); setTimeout(()=>btn.classList.remove('done'),900);} };
  if(!ok.length)return toast('Cet article est épuisé.');
  if(ok.length===1){ cartAdd(ok[0].id,1); toast('Ajouté au panier.'); return done(); }
  let pick=null;
  setTimeout(()=>$$('#qpk button').forEach(x=>x.onclick=()=>{ pick=x.dataset.v; $$('#qpk button').forEach(y=>y.classList.toggle('on',y===x)); }),0);
  const r=await ask({title:'Choisissez',body:'<div class="qpk" id="qpk">'+ok.map(v=>'<button type="button" data-v="'+v.id+'">'+(v.color_hex?'<i style="'+swatch(v.color_hex)+'"></i>':'')+'<span>'+esc([v.size,v.color].filter(Boolean).join(' · ')||'Modèle unique')+'</span><b>'+gds(v.price_cents)+'</b></button>').join('')+'</div>',ok:'Ajouter au panier',cancel:'Annuler'});
  if(!r)return; if(!pick)return toast('Choisissez une taille ou une couleur.');
  cartAdd(pick,1); toast('Ajouté au panier.'); done();
}

    const list=age?kids.filter(k=>k[1]===age):kids;

  } else {
    const subs=(AUD_RAYONS[aud]||[]).flatMap(rs=>{const r=catBySlug(rs);return r?subsOf(r.id).map(c=>({c,r})):[];});
    const cover=(c,r)=>{const x=all.filter(p=>p.category_slug===c.slug&&AUD_FILTER[aud](p)&&p.cover_path&&!p.is_demo).sort((a,b)=>(b.views||0)-(a.views||0))[0];return x?prodImg(x.cover_path):RAYON_IMG(r.slug);};

  }
  return ban+tiles+circles;
}

/* même calcul que la fonction SQL line_total : douzaines, puis lots de 3, puis à l'unité */
function lineTotal(v,q){ let r=q,t=0;
  if(v&&v.lot12_cents){t+=Math.floor(r/12)*v.lot12_cents; r%=12;}
  if(v&&v.lot3_cents){t+=Math.floor(r/3)*v.lot3_cents; r%=3;}
  return t+r*((v&&v.price_cents)||0); }
window.lineTotal=lineTotal;
const lotNote=(v,q)=>{const plein=q*v.price_cents, t=lineTotal(v,q); return t<plein?'Prix lot appliqué · −'+gds(plein-t):'';};

/* ---------- SCANNER DE CODE-BARRES (gratuit) ---------- */
async function lookupBarcode(code){
  const bases=[['https://world.openfoodfacts.org','beaute',false],['https://world.openbeautyfacts.org','beaute',true],['https://world.openproductsfacts.org','',false]];
  for(const [u,ray,beauty] of bases){
    try{ const r=await fetch(u+'/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_fr,brands,quantity,categories'); const j=await r.json();
      if(j&&j.status===1&&j.product){const x=j.product; return {title:(x.product_name_fr||x.product_name||'').trim(),brand:(x.brands||'').split(',')[0].trim(),qty:x.quantity||'',cats:x.categories||'',beauty:beauty,source:u.replace('https://world.','')};}
    }catch(e){}
  }
  try{ const r=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+encodeURIComponent(code)); const j=await r.json();
    const it=j&&j.items&&j.items[0]; if(it)return {title:it.title||'',brand:it.brand||'',qty:'',cats:it.category||'',source:'upcitemdb.com'}; }catch(e){}
  return null;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Lecteur indisponible hors connexion.'));document.head.appendChild(s);});}
async function scanBarcode(){
  return new Promise(async (done)=>{
    const m=document.createElement('div'); m.className='scanbox';
    m.innerHTML='<div class="scanbox__in"><video id="scV" playsinline muted></video><span class="scanbox__line"></span>'+
      '<p>Placez le code-barres dans le cadre</p><div class="scanbox__row"><input id="scM" inputmode="numeric" placeholder="ou tapez les chiffres"><button class="btn btn--pri btn--sm" id="scOk">OK</button></div>'+
      '<button class="btn btn--sm" id="scX">Fermer</button></div>';
    document.body.appendChild(m);
    let stream=null, stop=false, reader=null;
    const end=v=>{stop=true; try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){} try{reader&&reader.reset&&reader.reset();}catch(e){} m.remove(); done(v);};
    $('#scX').onclick=()=>end(null);
    $('#scOk').onclick=()=>{const v=$('#scM').value.replace(/\D/g,''); if(v.length>=6)end(v); else toast('Code trop court.');};
    try{
      if('BarcodeDetector' in window){
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        const vd=$('#scV'); vd.srcObject=stream; await vd.play();
        const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
        (async function loop(){ if(stop)return; try{const r=await det.detect(vd); if(r&&r[0]){end(r[0].rawValue);return;}}catch(e){} setTimeout(loop,250);})();
      } else {
        if(!window.ZXing)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');
        reader=new ZXing.BrowserMultiFormatReader();
        reader.decodeFromVideoDevice(null,'scV',(res)=>{ if(res&&!stop)end(res.getText()); });
      }
    }catch(e){ const p=m.querySelector('p'); if(p)p.textContent='Caméra indisponible ici : tapez les chiffres du code-barres.'; }
  });
}
window.scanBarcode=scanBarcode; window.lookupBarcode=lookupBarcode;

function bindBuilder(d,paint,collect){
  const pick={sz:new Set(d.vars.map(v=>v.size).filter(Boolean)),col:new Set(d.vars.map(v=>v.color).filter(Boolean))};
  $$('[data-bsz]').forEach(b=>b.onclick=()=>{const k=b.dataset.bsz; pick.sz.has(k)?pick.sz.delete(k):pick.sz.add(k); b.classList.toggle('on');});
  $$('[data-bcol]').forEach(b=>b.onclick=()=>{const k=b.dataset.bcol; pick.col.has(k)?pick.col.delete(k):pick.col.add(k); b.classList.toggle('on');});
  const o=$('#bSzOther'); if(o)o.onclick=async ()=>{ const ok=await ask({title:'Autre taille',body:'<div class="field" style="margin:0"><input id="bSzV" placeholder="Ex. 52, 3XL, 120 cm, 1 L"></div>',ok:'Ajouter'});
    const v=(($('#bSzV')||{}).value||'').trim(); if(ok&&v){pick.sz.add(v); collect(); d._extraSizes=(d._extraSizes||[]).concat(v); paint();}};
  const g=$('#bGo'); if(g)g.onclick=()=>{ collect();
    const sz=pick.sz.size?[...pick.sz]:[''], co=pick.col.size?[...pick.col]:[''];
    const keep=d.vars.filter(v=>(v.size||'')||(v.color||'')||v.id);
    const next=[];
    sz.forEach(s=>co.forEach(c=>{ const ex=keep.find(v=>(v.size||'')===s&&(v.color||'')===c);
      next.push(ex||{id:null,size:s,color:c,price:d.price||'',lot3:'',lot12:'',stock:1,measures:{},open:false}); }));
    d.vars.filter(v=>v.id&&!next.includes(v)).forEach(v=>d.removedVars.push(v.id));

/* --- Petits prix et Nouveautés : des règles claires ---
   Nouveautés : publié il y a moins de 14 jours, le plus récent d'abord.
   Petits prix : au moins 20 % moins cher que le prix médian de sa sous-catégorie
   (il faut au moins 3 articles pour comparer), ou le moins cher d'un même code-barres. */
function newArrivals(all){ const lim=Date.now()-14*864e5; return all.filter(p=>!p.is_demo&&new Date(p.published_at)>lim).sort((a,b)=>new Date(b.published_at)-new Date(a.published_at)); }
function lowPrices(all){
  const by={}; all.filter(p=>!p.is_demo&&p.total_stock).forEach(p=>(by[p.category_slug]=by[p.category_slug]||[]).push(p));
  const out=[];
  Object.values(by).forEach(a=>{ if(a.length<3)return; const s=a.map(PX).sort((x,y)=>x-y), med=s[Math.floor(s.length/2)];
    a.forEach(p=>{ if(PX(p)<=med*0.8)out.push(p); }); });
  return out.sort((a,b)=>PX(a)-PX(b));
}
window.newArrivals=newArrivals; window.lowPrices=lowPrices;
