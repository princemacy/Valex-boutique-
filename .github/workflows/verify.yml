name: Verify

# Controle du depot public sans publication.
# Aucun secret n'est necessaire.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controle anti-secrets, CSP et syntaxe
        run: node scripts/check-site.mjs site

      - name: Installer Wrangler
        run: npm install --no-audit --no-fund

      - name: Verification a blanc de la configuration Workers
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --dry-run
