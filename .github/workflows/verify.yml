name: Verify

# Verification du depot public. Aucune publication ici.
#
# Le deploiement de production est assure par Cloudflare Workers Builds,
# relie au depot public `princemacy/Valex-boutique-` et a la branche `main`.
# Les pushes sur une branche de travail et les pull requests ne deploient pas.
#
# Aucun secret Cloudflare n'est necessaire dans GitHub Actions. Ne copiez
# jamais un secret du depot prive vers ce depot public.
#
# Ce workflow execute les controles bloquants : anti-secrets, hash CSP,
# syntaxe, tests unitaires et verification a blanc de Wrangler.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dependances verrouillees
        run: npm ci --no-audit --no-fund

      - name: Anti-secrets, CSP et syntaxe
        run: npm run check

      - name: Tests unitaires
        run: npm test

      - name: Verification a blanc de la configuration Workers
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run dry-run
