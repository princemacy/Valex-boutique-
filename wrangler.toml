name = "valexboutique"
main = "site/_worker.js"
compatibility_date = "2026-11-23"
workers_dev = true

# Le site est servi par Workers Static Assets. Le Worker est le point d'entree :
# il applique les en-tetes de securite, les pages d'erreur, le rendu SEO des
# produits et boutiques, le sitemap et robots.txt.
#
# site/_worker.js est exclu des assets par site/.assetsignore. Sans cette
# exclusion, Wrangler refuse la publication avec :
#   "Uploading a Pages _worker.js file as an asset."
# Le code serveur ne doit jamais etre servi comme fichier public.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
